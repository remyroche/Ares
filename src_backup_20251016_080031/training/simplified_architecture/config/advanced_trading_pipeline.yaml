name: Advanced_Trading_Pipeline
version: 2.0.0
description: Advanced trading pipeline with HMM regime detection and ensemble models
environment: production

global_settings:
  data_source:
    type: exchange
    exchange: binance
    api_key_env: BINANCE_API_KEY
    api_secret_env: BINANCE_API_SECRET
    testnet: false
  model:
    type: multi_output_stacking_ensemble
    ensemble_type: stacking
    models:
      # Analyst models (5m timeframe)
      analyst:
        type: multi_output_stacking
        base_models:
          - type: time_series_transformer
            weight: 0.3
            hyperparameters:
              d_model: 64
              n_heads: 8
              n_layers: 4
              dropout: 0.1
              max_length: 100
          - type: catboost
            weight: 0.25
            hyperparameters:
              n_estimators: 2000
              learning_rate: 0.05
              max_depth: 8
              subsample: 0.8
              colsample_bytree: 0.8
          - type: lightgbm
            weight: 0.25
            hyperparameters:
              n_estimators: 2000
              learning_rate: 0.05
              max_depth: 8
              subsample: 0.8
              colsample_bytree: 0.8
          - type: random_forest
            weight: 0.2
            hyperparameters:
              n_estimators: 500
              max_depth: 10
              min_samples_split: 5
              min_samples_leaf: 2
        meta_learner:
          type: ridge
          hyperparameters:
            alpha: 1.0
            fit_intercept: true
        outputs:
          - signal_strength
          - confidence
          - risk_score
          - regime_label
        timeframe: 5m
        role: "analyst"
      
      # Tactician models (1m timeframe)
      tactician:
        type: multi_output_stacking
        base_models:
          - type: tabnet
            weight: 0.3
            hyperparameters:
              n_d: 64
              n_a: 64
              n_steps: 5
              gamma: 1.5
              lambda_sparse: 1e-3
          - type: catboost
            weight: 0.25
            hyperparameters:
              n_estimators: 1500
              learning_rate: 0.05
              max_depth: 6
              subsample: 0.8
              colsample_bytree: 0.8
          - type: lightgbm
            weight: 0.25
            hyperparameters:
              n_estimators: 1500
              learning_rate: 0.05
              max_depth: 6
              subsample: 0.8
              colsample_bytree: 0.8
          - type: ridge
            weight: 0.2
            hyperparameters:
              alpha: 1.0
              fit_intercept: true
        meta_learner:
          type: ridge
          hyperparameters:
            alpha: 0.5
            fit_intercept: true
        outputs:
          - entry_timing
          - position_size
          - stop_loss
          - take_profit
        timeframe: 1m
        role: "tactician"
        depends_on: "analyst"
  logging:
    level: INFO
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file: logs/trading_pipeline.log
  performance:
    max_memory_mb: 16384
    timeout_seconds: 7200
    parallel_workers: 4
  security:
    encrypt_artifacts: true
    encryption_key_env: ENCRYPTION_KEY
  monitoring:
    enable_metrics: true
    metrics_interval: 30
    alert_thresholds:
      memory_usage: 0.8
      execution_time: 3600

steps:
  - name: data_collection
    class_name: DataCollectionStep
    enabled: true
    timeout_seconds: 600
    retry_count: 3
    retry_delay_seconds: 10
    fail_fast: true
    priority: 4
    parameters:
      symbol: BTCUSDT
      timeframe: 1h
      lookback_days: 90
      include_volume: true
      include_orderbook: false
      data_quality_checks: true
    dependencies: []
    validation_rules:
      - type: data_quality
        min_rows: 2000
        max_null_percentage: 1.0
        required_columns: [open, high, low, close, volume]
    resource_limits:
      max_memory_mb: 2048
    metadata:
      description: "Collect market data from Binance exchange"
      tags: ["data", "collection", "binance", "crypto"]

  - name: hmm_regime_discovery
    class_name: HMMRegimeDiscoveryStep
    enabled: true
    timeout_seconds: 1200
    retry_count: 2
    retry_delay_seconds: 30
    fail_fast: true
    priority: 3
    parameters:
      n_components: 4
      max_iterations: 200
      covariance_type: full
      random_state: 42
      features:
        - returns
        - volatility
        - volume_ratio
        - price_momentum
      regime_threshold: 0.7
    dependencies: [data_collection]
    validation_rules:
      - type: regime_quality
        min_regime_samples: 500
        max_regime_entropy: 0.8
    resource_limits:
      max_memory_mb: 4096
    metadata:
      description: "Discover market regimes using Hidden Markov Models"
      tags: ["hmm", "regime", "discovery", "clustering"]

  - name: feature_engineering
    class_name: FeatureEngineeringStep
    enabled: true
    timeout_seconds: 1800
    retry_count: 1
    retry_delay_seconds: 60
    fail_fast: true
    priority: 3
    parameters:
      feature_types:
        - technical
        - statistical
        - wavelet
        - regime_based
        - cross_timeframe
      technical_indicators:
        - sma: [5, 10, 20, 50, 100, 200]
        - ema: [5, 10, 20, 50, 100, 200]
        - rsi: [14, 21, 30]
        - macd: [12, 26, 9]
        - bollinger_bands: [20, 2]
        - atr: [14, 21]
        - stochastic: [14, 3, 3]
      statistical_features:
        - returns: [1, 5, 10, 20]
        - volatility: [5, 10, 20, 30]
        - skewness: [10, 20, 30]
        - kurtosis: [10, 20, 30]
        - autocorrelation: [1, 5, 10]
      wavelet_features:
        - levels: [1, 2, 3, 4]
        - wavelets: [db4, db8, haar]
      regime_features:
        - regime_probability: true
        - regime_transition: true
        - regime_duration: true
      cross_timeframe:
        - timeframes: [5m, 15m, 1h, 4h, 1d]
        - features: [price_ratio, volume_ratio, momentum_ratio]
    dependencies: [hmm_regime_discovery]
    validation_rules:
      - type: feature_quality
        min_features: 50
        max_correlation: 0.9
        min_information_gain: 0.01
    resource_limits:
      max_memory_mb: 8192
    metadata:
      description: "Engineer comprehensive feature set including technical, statistical, and regime-based features"
      tags: ["features", "engineering", "technical", "statistical", "wavelet", "regime"]

  - name: feature_selection
    class_name: FeatureSelectionStep
    enabled: true
    timeout_seconds: 900
    retry_count: 1
    retry_delay_seconds: 30
    fail_fast: true
    priority: 2
    parameters:
      selection_method: multi_objective
      objectives:
        - information_gain
        - correlation_reduction
        - stability
      max_features: 100
      min_features: 20
      feature_groups:
        - technical: 40
        - statistical: 30
        - wavelet: 20
        - regime: 10
      stability_threshold: 0.8
    dependencies: [feature_engineering]
    validation_rules:
      - type: selection_quality
        min_selected_features: 20
        max_redundancy: 0.3
    resource_limits:
      max_memory_mb: 4096
    metadata:
      description: "Select optimal feature subset using multi-objective optimization"
      tags: ["feature_selection", "optimization", "multi_objective"]

  - name: analyst_models_training
    class_name: AnalystModelsTrainingStep
    enabled: true
    timeout_seconds: 7200
    retry_count: 1
    retry_delay_seconds: 120
    fail_fast: true
    priority: 2
    parameters:
      model_types:
        - "TCN"
        - "CatBoostRegressor"
        - "LGBMRegressor"
        - "RandomForestRegressor"
      enable_hpo: true
      hpo_n_trials: 100
      hpo_timeout_seconds: 3600
      hpo_cv_folds: 5
      min_samples_per_regime: 1000
      enable_data_augmentation: true
      augmentation_method: "smote"
      validation_split: 0.2
      enable_cross_validation: true
      cv_folds: 5
      save_models: true
      model_save_path: "./models/analyst_models"
      enable_evaluation: true
      evaluation_metrics:
        - "mse"
        - "mae"
        - "r2"
        - "mape"
        - "smape"
      enable_overfitting_prevention: true
      overfitting_threshold: 0.1
    dependencies: [feature_selection, hmm_regime_discovery]
    validation_rules:
      - type: model_quality
        min_accuracy: 0.6
        max_overfitting: 0.1
    resource_limits:
      max_memory_mb: 16384
    metadata:
      description: "Train Analyst individual models per-regime with HPO, saving, and metrics"
      tags: ["analyst", "models", "training", "per_regime", "hpo", "saving", "metrics"]

  - name: analyst_ensemble_training
    class_name: AnalystEnsembleTrainingStep
    enabled: true
    timeout_seconds: 7200
    retry_count: 1
    retry_delay_seconds: 120
    fail_fast: true
    priority: 2
    parameters:
      base_models:
        - "TCN"
        - "CatBoostRegressor"
        - "LGBMRegressor"
        - "RandomForestRegressor"
      meta_model: "Ridge"
      enable_hpo: true
      hpo_n_trials: 50
      hpo_timeout_seconds: 1800
      hpo_cv_folds: 5
      min_samples_per_regime: 1000
      enable_data_augmentation: true
      augmentation_method: "smote"
      validation_split: 0.2
      enable_cross_validation: true
      cv_folds: 5
      save_models: true
      model_save_path: "./models/analyst_ensemble"
      enable_evaluation: true
      evaluation_metrics:
        - "mse"
        - "mae"
        - "r2"
        - "mape"
        - "smape"
      enable_overfitting_prevention: true
      overfitting_threshold: 0.1
    dependencies: [analyst_models_training]
    validation_rules:
      - type: ensemble_quality
        min_base_accuracy: 0.6
        min_ensemble_improvement: 0.02
    resource_limits:
      max_memory_mb: 16384
    metadata:
      description: "Train Analyst ensemble models per-regime with HPO, saving, and metrics"
      tags: ["analyst", "ensemble", "training", "per_regime", "hpo", "saving", "metrics"]

  - name: tactician_models_training
    class_name: TacticianModelsTrainingStep
    enabled: true
    timeout_seconds: 7200
    retry_count: 1
    retry_delay_seconds: 120
    fail_fast: true
    priority: 3
    parameters:
      model_types:
        - "NODE"
        - "CatBoostRegressor"
        - "LGBMRegressor"
        - "Ridge"
      enable_hpo: true
      hpo_n_trials: 100
      hpo_timeout_seconds: 3600
      hpo_cv_folds: 5
      analyst_model_path: "./models/analyst_ensemble"
      analyst_output_names:
        - "signal_strength"
        - "confidence"
        - "risk_score"
        - "regime_label"
      analyst_threshold: 0.6
      validation_split: 0.2
      enable_cross_validation: true
      cv_folds: 5
      save_models: true
      model_save_path: "./models/tactician_models"
      enable_evaluation: true
      evaluation_metrics:
        - "mse"
        - "mae"
        - "r2"
        - "mape"
        - "smape"
      enable_overfitting_prevention: true
      overfitting_threshold: 0.1
    dependencies: [analyst_ensemble_training]
    validation_rules:
      - type: model_quality
        min_accuracy: 0.6
        max_overfitting: 0.1
    resource_limits:
      max_memory_mb: 16384
    metadata:
      description: "Train Tactician individual models on all regime data with HPO, saving, and metrics"
      tags: ["tactician", "models", "training", "all_regime", "hpo", "saving", "metrics"]

  - name: tactician_ensemble_training
    class_name: TacticianEnsembleTrainingStep
    enabled: true
    timeout_seconds: 7200
    retry_count: 1
    retry_delay_seconds: 120
    fail_fast: true
    priority: 3
    parameters:
      base_models:
        - "NODE"
        - "CatBoostRegressor"
        - "LGBMRegressor"
        - "Ridge"
      meta_model: "Ridge"
      enable_hpo: true
      hpo_n_trials: 50
      hpo_timeout_seconds: 1800
      hpo_cv_folds: 5
      analyst_model_path: "./models/analyst_ensemble"
      analyst_output_names:
        - "signal_strength"
        - "confidence"
        - "risk_score"
        - "regime_label"
      analyst_threshold: 0.6
      validation_split: 0.2
      enable_cross_validation: true
      cv_folds: 5
      save_models: true
      model_save_path: "./models/tactician_ensemble"
      enable_evaluation: true
      evaluation_metrics:
        - "mse"
        - "mae"
        - "r2"
        - "mape"
        - "smape"
      enable_overfitting_prevention: true
      overfitting_threshold: 0.1
    dependencies: [tactician_models_training]
    validation_rules:
      - type: ensemble_quality
        min_base_accuracy: 0.6
        min_ensemble_improvement: 0.02
    resource_limits:
      max_memory_mb: 16384
    metadata:
      description: "Train Tactician ensemble models on all regime data with HPO, saving, and metrics"
      tags: ["tactician", "ensemble", "training", "all_regime", "hpo", "saving", "metrics"]

  - name: model_validation
    class_name: ModelValidationStep
    enabled: true
    timeout_seconds: 1200
    retry_count: 1
    retry_delay_seconds: 60
    fail_fast: false
    priority: 1
    parameters:
      validation_methods:
        - time_series_split
        - walk_forward
        - monte_carlo
      time_series_split:
        n_splits: 10
        test_size: 0.2
        gap: 1
      walk_forward:
        initial_train_size: 0.6
        step_size: 0.1
        n_splits: 5
      monte_carlo:
        n_simulations: 100
        confidence_level: 0.95
      metrics:
        - accuracy
        - precision
        - recall
        - f1_score
        - roc_auc
        - sharpe_ratio
        - max_drawdown
        - calmar_ratio
    dependencies: [ensemble_training]
    validation_rules:
      - type: validation_quality
        min_samples: 200
        min_sharpe_ratio: 1.0
        max_drawdown: 0.2
    resource_limits:
      max_memory_mb: 4096
    metadata:
      description: "Comprehensive model validation using multiple methods"
      tags: ["validation", "time_series", "walk_forward", "monte_carlo"]

  - name: model_optimization
    class_name: ModelOptimizationStep
    enabled: true
    timeout_seconds: 1800
    retry_count: 1
    retry_delay_seconds: 90
    fail_fast: false
    priority: 1
    parameters:
      optimization_method: bayesian
      objective: sharpe_ratio
      hyperparameter_space:
        lightgbm:
          n_estimators: [1000, 3000]
          learning_rate: [0.01, 0.2]
          max_depth: [4, 12]
          subsample: [0.6, 1.0]
          colsample_bytree: [0.6, 1.0]
        xgboost:
          n_estimators: [1000, 3000]
          learning_rate: [0.01, 0.2]
          max_depth: [4, 12]
          subsample: [0.6, 1.0]
          colsample_bytree: [0.6, 1.0]
        neural_network:
          hidden_layers: [[128, 64], [256, 128, 64], [512, 256, 128, 64]]
          dropout: [0.1, 0.5]
          learning_rate: [0.0001, 0.01]
      n_trials: 100
      early_stopping:
        enabled: true
        patience: 10
    dependencies: [model_validation]
    validation_rules:
      - type: optimization_quality
        min_improvement: 0.01
        max_trials: 200
    resource_limits:
      max_memory_mb: 8192
    metadata:
      description: "Optimize ensemble model hyperparameters using Bayesian optimization"
      tags: ["optimization", "bayesian", "hyperparameters", "ensemble"]

  - name: model_persistence
    class_name: ModelPersistenceStep
    enabled: true
    timeout_seconds: 300
    retry_count: 2
    retry_delay_seconds: 15
    fail_fast: false
    priority: 1
    parameters:
      save_models: true
      save_features: true
      save_metadata: true
      save_predictions: true
      model_format: joblib
      compression: gzip
      versioning: true
      backup_count: 3
      storage_path: models/advanced_trading/
    dependencies: [model_optimization]
    validation_rules:
      - type: persistence_quality
        min_file_size: 1024
        max_file_size: 104857600
    resource_limits:
      max_memory_mb: 1024
    metadata:
      description: "Save trained models and artifacts with versioning and backup"
      tags: ["persistence", "saving", "versioning", "backup"]

metadata:
  author: "Advanced Trading Team"
  created_at: "2024-01-01T00:00:00Z"
  tags: ["advanced", "trading", "ensemble", "hmm", "regime", "optimization", "multi_output", "stacking", "analyst", "tactician"]
  documentation: "https://docs.example.com/pipelines/advanced_trading"
  performance_targets:
    accuracy: 0.65
    sharpe_ratio: 1.5
    max_drawdown: 0.15
    execution_time: 3600
    multi_output_accuracy: 0.6
    analyst_accuracy: 0.7
    tactician_accuracy: 0.65