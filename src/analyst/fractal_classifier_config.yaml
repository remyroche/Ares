# Configuration for Fractal Location Classifier

analyst:
  unified_regime_classifier:
    # Fractal timeframes for multi-timeframe S/R analysis
    fractal_timeframes:
      - name: "1m"
        periods: 60      # 60 1m candles = 1 hour
        weight: 0.1      # Lower weight for micro structure
      - name: "5m"
        periods: 12      # 12 5m candles = 1 hour
        weight: 0.15
      - name: "15m"
        periods: 4       # 4 15m candles = 1 hour  
        weight: 0.2
      - name: "1h"
        periods: 1       # Base timeframe
        weight: 0.25     # Highest weight for base timeframe
      - name: "4h"
        periods: 0.25    # 1/4 of 4h candle
        weight: 0.2
      - name: "1d"
        periods: 0.042   # ~1 hour of daily candle
        weight: 0.1
    
    # Location classification thresholds
    proximity_threshold: 0.002      # 0.2% - Price must be within this % of level
    breakout_threshold: 0.005       # 0.5% - Price must be beyond this % for breakout
    strong_level_min_timeframes: 3  # Level must appear in 3+ timeframes to be "strong"
    min_touches_for_validity: 2     # Minimum touches for a valid S/R level
    volume_confirmation_threshold: 1.5  # Volume must be 1.5x average for confirmation
    
    # S/R integration
    enable_sr_integration: true
    
    # Example location types generated:
    # - STRONG_SUPPORT / STRONG_RESISTANCE (multi-timeframe confluence)
    # - SUPPORT_1M, SUPPORT_5M, SUPPORT_15M, etc. (timeframe-specific)
    # - RESISTANCE_1M, RESISTANCE_5M, RESISTANCE_15M, etc.
    # - BREAKOUT_SUPPORT / BREAKOUT_RESISTANCE (confirmed breakouts)
    # - FALSE_BREAKOUT_SUPPORT / FALSE_BREAKOUT_RESISTANCE (unconfirmed)
    # - RETEST_SUPPORT / RETEST_RESISTANCE (retesting broken levels)
    # - CONSOLIDATION_RANGE (between nearby S/R)
    # - OPEN_RANGE (no significant levels nearby)