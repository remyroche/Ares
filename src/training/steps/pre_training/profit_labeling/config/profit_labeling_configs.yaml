# Enhanced Profit Labeling System Configurations
# This file contains various configuration presets for different use cases

# Basic Configuration - Simple setup for testing
basic:
  data_path: "data/klines"
  symbols: ["BTCUSDT"]
  timeframes: ["1h"]
  start_date: "2023-01-01"
  end_date: "2023-12-31"
  feature_categories: ["volatility", "momentum", "volume"]
  max_features: 100
  feature_selection_method: "mrmr"
  volatility_threshold: 0.02
  horizon_quantiles: [0.25, 0.5, 0.75]
  target_thresholds:
    small: 0.01
    medium: 0.02
    high: 0.05
  enable_bayesian_optimization: false
  n_trials: 50
  n_jobs: -1
  enable_gpu: false
  enable_parallel: true
  memory_efficient: true
  min_quality_score: 0.7
  enable_noise_gating: true
  enable_leakage_detection: true

