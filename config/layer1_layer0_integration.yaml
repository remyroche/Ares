# Configuration for Layer0-Enhanced Layer1 Optimization

# Enable Layer0 price integration for Layer1 weighting optimization
layer1_use_layer0_prices: true

# Layer1 optimization parameters
layer1_n_trials: 60
layer1_objective_mode: "proxy"  # "proxy" or "predictive_cv"
layer1_uniqueness_horizon_bars: 24
transaction_cost: 0.001

# Layer0 enhanced filtering parameters (will be loaded from Layer0 summary)
# These are automatically loaded from the latest Layer0 optimization
# Available parameters:
# - kalman_Q, kalman_R: Kalman filter noise parameters
# - vwap_weight, vwap_lookback: VWAP parameters
# - median_filter_enabled, median_window: Median filter parameters
# - adaptive_kalman_enabled, adaptive_noise_window, adaptive_adaptation_rate: Adaptive Kalman parameters
# - robust_vwap_enabled, robust_min_lookback, robust_max_lookback, robust_volatility_window: Robust VWAP parameters
# - savgol_filter_enabled, savgol_window, savgol_order: Savitzky-Golay filter parameters

# Expected SNR improvement with Layer0 prices:
# - Baseline (raw prices): ~56 dB SNR
# - Kalman only: ~68 dB SNR (+12 dB improvement)
# - All filters: ~69 dB SNR (+13 dB improvement)
# - Expected Layer1 weighting improvement: +0.5 to +1.5 dB additional

# Benefits of Layer0 price integration for Layer1:
# 1. Better volatility estimation from cleaner price signals
# 2. More accurate uniqueness calculations with reduced noise
# 3. Improved consistency scoring with feature-preserving filters
# 4. Enhanced predictive CV features from optimized price series
# 5. Better committee agreement scoring with cleaner signals

# Configuration validation:
# - If Layer0 params not available, falls back to raw prices with warning
# - Automatically detects and uses latest Layer0 optimization results
# - Logs which Layer0 parameters are loaded and used
