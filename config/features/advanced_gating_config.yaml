# Advanced Gating Configuration
# ==============================
# This config controls the advanced gating features for meta-labeling HPO:
# A. Regime-conditional barrier geometry
# B. Learned meta-gate (LGBM)
# C. Per-expert confidence calibration
# D. Abstention-aware voting
# E. Expert specialization and diversity regularization
# F. Layer3 feature caching for Layer2 reuse

# Master switch for advanced gating pipeline
enable_advanced_gating: true

# Advanced gating sub-config
advanced_gating:
  # A. Regime-conditional barrier geometry
  # Adjusts TP/SL/horizon based on detected market regime
  enable_regime_barriers: true
  
  # B. Learned meta-gate (LGBM-based)
  # Trains a model to predict optimal expert weights or take probability
  enable_meta_gate: true
  meta_gate_mode: "weights"  # "weights" or "take_prob"
  
  # C. Per-expert confidence calibration
  # Uses isotonic regression or Platt scaling to calibrate confidence scores
  enable_calibration: true
  calibration_method: "isotonic"  # "isotonic" or "platt"
  
  # D. Abstention-aware voting
  # Gates on coverage (fraction of experts that fired) in addition to consensus
  enable_abstention_aware: true
  coverage_min: 0.3  # Minimum coverage to consider consensus valid
  consensus_threshold: 0.5  # Threshold for take decision
  
  # E. Expert specialization and diversity
  enable_specialization: true
  specialization_strength: 0.5  # How much to weight specialization (0-1)
  enable_diversity: true
  diversity_lambda: 0.1  # Penalty strength for expert overlap

  # Regime barrier multipliers (optional override)
  # Default multipliers are applied per regime:
  # - trend: wider TP (1.5x), slightly wider SL (1.2x), longer horizon (1.3x)
  # - chop: tighter TP (0.7x), tighter SL (0.8x), shorter horizon (0.7x)
  # - vol_spike: wider TP (1.3x), much wider SL (1.5x), shorter horizon (0.8x)
  # - transition: neutral (1.0x all)
  # Uncomment to customize:
  # regime_barrier_config:
  #   trend:
  #     tp_mult: 1.5
  #     sl_mult: 1.2
  #     horizon_mult: 1.3
  #     trail_mult: 1.0
  #   chop:
  #     tp_mult: 0.7
  #     sl_mult: 0.8
  #     horizon_mult: 0.7
  #     trail_mult: 0.0

# Layer3 Feature Caching
# ======================
# Caches Layer3 meta-features (including NN embeddings) for Layer2 reuse
enable_layer3_feature_cache: true
use_layer3_feature_cache: true  # Whether to load from cache
layer3_cache_validate_hash: true  # Validate data hash before using cache
layer3_cache_max_age_hours: null  # Max cache age in hours (null = no limit)

# NN Sequence Embeddings
# ======================
# These are generated by short_nn_sequence_template.py and cached
meta_feature_engineering:
  enable_nn_sequence_embeddings: true
  nn_sequence_encoder:
    seq_len: 24  # Lookback window in bars
    embed_dim: 8  # Output embedding dimension
    encoder_type: "stacked"  # "conv", "lstm", "attention", "stacked"
    use_conv: true
    use_lstm: true
    use_attention: false  # Disabled for speed
    device: "cpu"  # "cpu" or "cuda"
    cache_path: null  # Optional: explicit cache path for NN embeddings

# Regime Detection Thresholds
# ===========================
# Used by advanced gating for regime classification
regime_detection:
  trend_threshold: 25.0  # ADX above this = trend regime
  chop_threshold: 20.0   # ADX below this = chop regime
  vol_spike_threshold: 1.5  # vol_ratio above this = vol_spike
  transition_window: 5  # Bars to look back for regime change detection

# Committee Expert Weights (Layer2)
# =================================
# These are optimized by HPO but can be seeded here
layer2_committee_defaults:
  w_scalp: 1.0
  w_swing: 1.0
  w_trend: 1.0
  w_breakout: 0.5  # New expert: breakout/range-expansion
  w_vwap_rev: 0.5  # New expert: VWAP/liquidity reversion
  w_vol_shock: 0.5  # New expert: volatility shock/event

# MoE Boost Parameters (Layer2 search space)
# ==========================================
# These control regime-conditional expert weight boosts
moe_boost_defaults:
  moe_breakout_boost: 0.0  # Boost breakout expert in transition regimes
  moe_vwap_boost: 0.0      # Boost VWAP reversion in chop regimes
  moe_vol_shock_boost: 0.0 # Boost vol shock expert in vol spikes
