[tool.poetry]
name = "ares"
version = "0.1.0"
description = "Advanced Regime-based Ensemble System for Financial Market Analysis"
authors = ["Remy Roche <remy@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Core scientific computing
numpy = "^1.24.0"
pandas = "^2.0.0"
scipy = "^1.10.0"
scikit-learn = "^1.3.0"

# Data visualization
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
plotly = "^5.15.0"

# Machine Learning & Deep Learning
tensorflow = "^2.13.0"
torch = "^2.0.0"
torchvision = "^0.15.0"
torchaudio = "^2.0.0"

# Clustering and HMM
hdbscan = "^0.8.29"
hmmlearn = "^0.3.0"
# Note: ssm-jax not available on PyPI, using hmmlearn instead

# Optimization and Hyperparameter Tuning
optuna = "^3.2.0"

# Model Explainability
shap = "^0.42.0"
lime = "^0.2.0.1"

# Financial Data and Analysis
ccxt = "^4.0.0"
yfinance = "^0.2.18"
ta = "^0.10.2"

# Async and Networking
aiohttp = "^3.8.0"
asyncio-throttle = "^1.0.0"
requests = "^2.31.0"

# Data Processing
pyarrow = "^12.0.0"
fastparquet = "^0.8.0"

# Utilities
psutil = "^5.9.0"
tqdm = "^4.65.0"
python-dateutil = "^2.8.0"
pytz = "^2023.3"
pyyaml = "^6.0"
python-dotenv = "^1.0.0"

# Performance Optimization
numba = "^0.57.0"

# Web Framework (for GUI)
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"

# Monitoring and Metrics
prometheus-client = "^0.19.0"

[tool.poetry.group.dev.dependencies]
# Code Quality Tools
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
pylint = "^2.17.0"
mypy = "^1.5.0"

# Testing
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"

# Documentation
sphinx = "^7.1.0"
sphinx-rtd-theme = "^1.3.0"

# Development Utilities
rich = "^13.0.0"
ipython = "^8.15.0"
jupyter = "^1.0.0"

[tool.poetry.group.optional.dependencies]
# GPU Acceleration (optional)
cupy-cuda11x = "^12.0.0"  # For CUDA 11.x
cupy-cuda12x = "^12.0.0"  # For CUDA 12.x

# Additional ML Libraries
xgboost = "^1.7.0"
lightgbm = "^4.0.0"
catboost = "^1.2.0"

# Advanced Analytics
statsmodels = "^0.14.0"
arch = "^6.2.0"

# Python version specific packages
vectorbt = {version = "^0.25.0", python = "<3.11"}  # Only for Python <3.11
# Note: pandas-ta requires Python 3.12+ and numpy 2.2.6+
# Install manually if needed: pip install pandas-ta

# Visualization Extensions
networkx = "^3.1.0"
graphviz = "^0.20.0"
squarify = "^0.4.3"

[tool.poetry.scripts]
ares = "src.launcher.ares_launcher:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]
known_third_party = ["numpy", "pandas", "scipy", "sklearn", "matplotlib", "seaborn"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "hdbscan.*",
    "vectorbt.*",
    "ccxt.*",
    "yfinance.*",
    "pandas_ta.*",
    "ta.*",
    "ssm.*",
    "hmmlearn.*",
    "shap.*",
    "lime.*",
    "optuna.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]