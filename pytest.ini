[tool:pytest]
# Test discovery and execution
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration
addopts = 
    --cov=src
    --cov-report=html:htmlcov/
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --strict-markers
    --tb=short
    --verbose

# Minimum coverage requirements
# Set to 80% as specified in requirements
cov_fail_under = 80

# Markers for different test categories
markers =
    unit: Unit tests for individual components
    integration: Integration tests between components
    slow: Slow running tests
    trading: Tests related to trading functionality
    exchange: Tests for exchange integrations
    simulator: Tests for trading simulator
    data: Tests for data handling and processing

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:src.utils.tprint

# Test environment variables
env =
    PYTHONPATH=src
    TESTING=True
    TPRINT_MINIMAL=1  # Enable minimal tprint mode for tests

# Async test support
asyncio_mode = auto

# Test parallelization (if pytest-xdist is installed)
# nprocesses = auto  # Uncomment to enable parallel testing
