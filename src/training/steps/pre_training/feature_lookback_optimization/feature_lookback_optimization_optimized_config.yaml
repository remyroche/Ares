# Optimized Feature Lookback Optimization Configuration
# This configuration addresses the issues identified in the review:
# 1. Removes duplicate logic for forward returns calculation
# 2. Ensures full alignment with multi_horizon_profit_labeler methodology
# 3. Adds proper tprint logging at every important stage
# 4. Optimizes for 5m timeframe by default
# 5. Handles failures gracefully without silent errors

optimized_feature_lookback_optimization:
  # Timeframe settings - 5m by default as requested
  default_timeframe: "5m"
  base_period_minutes: 5.0
  
  # Lookback optimization settings
  min_lookback: 5
  max_lookback: 98
  lookback_step: 5
  
  # Feature selection settings - exclude specified categories
  excluded_categories:
    - "interaction"
    - "cross_timeframe" 
    - "autoencoder"
    - "regime"
  
  excluded_features:
    - "wavelets"
    - "autoencoder"
    - "interaction"
    - "cross_timeframe"
    - "regime_"
  
  # Forward return calculation settings (fully aligned with multi_horizon_profit_labeler)
  enable_volatility_normalization: true
  enable_multi_target_scheme: true
  enable_enhanced_labels: true
  label_definition_type: "analyst"  # "analyst", "tactician"
  
  # Multi-target scheme configuration (aligned with multi_horizon_profit_labeler)
  multi_target_scheme:
    small_band: [0.4, 0.8]    # k_s range
    medium_band: [0.8, 1.3]   # k_m range
    high_band: [1.3, 2.0]     # k_h range
  
  # Optimization settings
  optimization_metric: "information_coefficient"
  cv_folds: 5
  max_optimization_time: 300  # seconds
  
  # Output settings
  save_results: true
  generate_reports: true
  output_directory: "feature_lookback_optimization_results"
  
  # Logging settings
  enable_detailed_logging: true
  log_level: "INFO"
  log_optimization_steps: true
  log_performance_metrics: true
  
  # Error handling settings
  enable_graceful_failures: true
  max_retries: 3
  fallback_to_simple_returns: true
  
  # Performance settings
  enable_memory_optimization: true
  enable_parallel_processing: true
  max_workers: 4
  chunk_size: 1000
  
  # Validation settings
  min_samples_for_ic: 100
  min_ic_threshold: 0.01
  max_feature_std: 10.0
  max_forward_returns_std: 5.0

# Integration with multi_horizon_profit_labeler
multi_horizon_integration:
  # Ensure perfect alignment with multi_horizon_profit_labeler
  use_precomputed_labels: true
  prefer_standardized_output: true
  fallback_to_generation: true
  
  # Label mapping for feature optimization
  label_mapping:
    immediate_opportunity: "small_band_targets"
    short_term_opportunity: "medium_band_targets" 
    leverage_adjusted_score: "high_band_targets"
  
  # Quality thresholds
  min_confidence_score: 0.5
  min_eligibility_ratio: 0.8
  min_quality_score: 0.6

# Feature bank integration
feature_bank_integration:
  # Categories to optimize (based on src/feature_generation/categories/)
  included_categories:
    - "returns"           # price_returns, log_returns, cumulative_returns, etc.
    - "momentum"          # RSI, MACD, stochastic, Williams %R, etc.
    - "volatility"        # Bollinger Bands, ATR, GARCH, etc.
    - "volume"            # volume ratios, OBV, CMF, VWAP deviations, etc.
    - "trend"             # moving averages, trend indicators, etc.
    - "oscillator"        # momentum oscillators, etc.
    - "support_resistance" # pivot points, levels, etc.
    - "candlestick_pattern" # doji, hammer, etc.
    - "acceleration"      # momentum, acceleration, jerk, trend strength, etc.
    - "entropy"           # Shannon, permutation, sample entropy, etc.
    - "advanced_statistical" # Hurst exponent, jump indicators, CVaR, etc.
    - "microstructure"    # order flow, liquidity features, etc.
    - "time"              # time-based features, anchors_tod, etc.
  
  # Feature validation
  validate_feature_metadata: true
  check_required_fields: true
  validate_lookback_ranges: true
  
  # Performance optimization
  enable_feature_caching: true
  enable_batch_processing: true
  memory_efficient_mode: true

# Reporting and monitoring
reporting:
  # Generate comprehensive reports
  generate_optimization_report: true
  generate_performance_report: true
  generate_alignment_report: true
  
  # Report formats
  output_formats:
    - "json"
    - "csv"
    - "html"
  
  # Report content
  include_detailed_metrics: true
  include_feature_analysis: true
  include_performance_analysis: true
  include_alignment_analysis: true
  
  # Visualization
  generate_plots: true
  plot_types:
    - "ic_distribution"
    - "lookback_optimization"
    - "feature_performance"
    - "alignment_metrics"

# Quality assurance
quality_assurance:
  # Validation checks
  validate_input_data: true
  validate_pipeline_state: true
  validate_optimization_results: true
  
  # Quality thresholds
  min_success_rate: 0.8
  min_average_ic: 0.05
  max_optimization_time: 600  # seconds
  
  # Error handling
  fail_fast_on_critical_errors: true
  log_all_errors: true
  preserve_partial_results: true