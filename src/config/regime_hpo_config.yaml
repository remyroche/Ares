# Regime HPO Configuration
# Configuration for regime-specific hyperparameter optimization

# Base model HPO settings
base_model_optimization:
  enabled: true
  n_trials: 100
  timeout_seconds: 3600  # 1 hour
  cv_folds: 5
  scoring_metric: 'balanced_accuracy'
  optimization_strategy: 'staged'  # 'staged', 'bayesian', 'hierarchical'
  
  # Model-specific settings
  catboost:
    enabled: true
    search_space:
      depth: [4, 5, 6]
      learning_rate: [0.03, 0.04, 0.05, 0.06]
      l2_leaf_reg: [6, 8, 10, 12]
      iterations: [500, 800, 1200]
      subsample: [0.6, 0.7, 0.8]
      colsample_bylevel: [0.6, 0.7, 0.8]
    stable_sweet_spot:
      depth: 5
      learning_rate: 0.05
      l2_leaf_reg: 8
      iterations: 800
  
  extratrees:
    enabled: true
    search_space:
      n_estimators: [300, 500, 800]
      max_depth: [10, 15, None]
      min_samples_split: [5, 10, 20]
      min_samples_leaf: [2, 5, 10]
      max_features: ['sqrt', 0.3, 0.5]
    stable_sweet_spot:
      n_estimators: 500
      max_depth: None
      min_samples_leaf: 5
      max_features: 'sqrt'
  
  bayesian_rule_lists:
    enabled: true
    search_space:
      # Keep complexity under control
      listlengthprior:  [2, 3, 4, 5]
      maxcardinality:   [2, 3]
      minsupport:       [0.02, 0.03, 0.05]
      # Priors / regularization
      alpha:            [0.5, 1.0, 2.0]
      beta:             [0.5, 1.0, 2.0]
      list_length_lambda: [3, 4, 5]          # if supported
      rule_length_penalty: [0.8, 1.0, 1.2]   # if supported
      # Sampler
      n_chains:         [2, 3]
      n_iter:           [6000, 10000, 14000]
      burn_in:          [1000, 2000]         # if supported
      thin:             [1, 5]               # if supported
      # Candidate mining (optional but helpful)
      discretization:   ["quantile3", "quantile5"]
      max_candidates:   [1000, 2000, 4000]

# Meta model HPO settings
meta_model_optimization:
  enabled: true
  n_trials: 50
  timeout_seconds: 1800  # 30 minutes
  cv_folds: 3
  scoring_metric: 'f1_macro'
  optimization_strategy: 'bayesian'
  
  # LightGBM Meta model settings
  lightgbm_meta:
    enabled: true
    search_space:
      num_leaves: [15, 23, 31]
      max_depth: [3, 4, 5]
      learning_rate: [0.03, 0.04, 0.05]
      min_data_in_leaf: [50, 100, 150]
      feature_fraction: [0.6, 0.75, 0.9]
      lambda_l1: [0, 1e-2, 1e-1]
      lambda_l2: [0, 1e-2, 1e-1]
      n_estimators: [200, 400, 600]
    stable_sweet_spot:
      num_leaves: 23
      max_depth: 4
      learning_rate: 0.04
      min_data_in_leaf: 100
      n_estimators: 400

# Meta-feature optimization
meta_feature_optimization:
  enabled: true
  n_trials: 30
  timeout_seconds: 900  # 15 minutes
  scoring_metric: 'regime_stability'
  
  # Meta-feature search space
  search_space:
    margin_weight: [0.0, 1.0]
    entropy_weight: [0.0, 1.0]
    gini_weight: [0.0, 1.0]
    variance_weight: [0.0, 1.0]
    disagreement_weight: [0.0, 1.0]
    js_divergence_weight: [0.0, 1.0]
    temporal_weight: [0.0, 1.0]
    regime_persistence_weight: [0.0, 1.0]
  
  # Meta-feature types
  features:
    disagreement_uncertainty:
      margin: true
      entropy: true
      gini_impurity: true
      pairwise_variance: true
      disagreement_rate: true
      js_divergence_spread: true
    
    temporal_dynamics:
      regime_persistence: true
      transition_probability: true
      regime_duration: true
      regime_frequency: true

# Optimization strategy settings
optimization_strategy:
  # Hierarchical optimization (recommended)
  hierarchical:
    enabled: true
    phases:
      - name: 'base_models'
        models: ['catboost', 'extratrees', 'bayesian_rule_lists']
        n_trials: 100
        timeout: 3600
      - name: 'meta_model'
        models: ['lightgbm_meta']
        n_trials: 50
        timeout: 1800
      - name: 'meta_features'
        enabled: true
        n_trials: 30
        timeout: 900
  
  # Staged optimization
  staged:
    enabled: true
    stages:
      - name: 'coarse_grid'
        method: 'grid'
        grid_points: 3
        timeout: 1800
      - name: 'fine_grid'
        method: 'grid'
        grid_points: 5
        timeout: 1800
      - name: 'bayesian'
        method: 'optuna_tpe'
        n_trials: 50
        timeout: 1800
  
  # Bayesian optimization
  bayesian:
    enabled: true
    sampler: 'tpe'
    pruner: 'median'
    n_trials: 100
    timeout: 3600

# Validation settings
validation:
  # Cross-validation
  cv:
    strategy: 'time_series'
    n_folds: 5
    gap: 1  # Gap between train and test sets
    enable_purged_kfold: true
  
  # Out-of-fold validation
  oof:
    enabled: true
    n_folds: 5
    gap: 1
    enable_early_stopping: true
    early_stopping_patience: 10
  
  # Time series validation
  time_series:
    enabled: true
    test_size: 0.2
    gap: 1
    enable_walk_forward: true

# Parallel processing
parallel_processing:
  enabled: true
  max_workers: 4
  backend: 'threading'  # 'threading', 'multiprocessing'
  enable_distributed: false

# Monitoring and logging
monitoring:
  enabled: true
  log_level: 'INFO'
  enable_progress_tracking: true
  enable_convergence_monitoring: true
  enable_performance_monitoring: true
  
  # Convergence criteria
  convergence:
    improvement_threshold: 0.001
    patience_trials: 20
    variance_threshold: 0.01
    confidence_level: 0.95
    min_trials_for_convergence: 10
  
  # Failure detection
  failure_detection:
    max_failure_rate: 0.3
    consecutive_failures_threshold: 5
    timeout_threshold: 3600
    memory_threshold: 0.9
    performance_degradation_threshold: 0.1

# Results storage
results:
  save_optimization_results: true
  save_best_models: true
  save_optimization_history: true
  results_directory: './hpo_results'
  
  # File formats
  formats:
    optimization_results: 'json'
    model_parameters: 'yaml'
    optimization_history: 'csv'
    convergence_analysis: 'json'

# Advanced features
advanced:
  # Transfer learning
  transfer_learning:
    enabled: true
    similarity_threshold: 0.8
    enable_parameter_transfer: true
    enable_architecture_transfer: true
  
  # Multi-objective optimization
  multi_objective:
    enabled: false
    objectives: ['accuracy', 'f1_score', 'regime_stability']
    objective_weights: [0.4, 0.3, 0.3]
    optimization_method: 'nsga2'
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.001
    monitor: 'validation_score'
    mode: 'max'
  
  # Pruning
  pruning:
    enabled: true
    pruner: 'median'
    n_startup_trials: 5
    n_warmup_steps: 10
    interval_steps: 1