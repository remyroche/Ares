# End-to-End Roadmap Configuration
# System contracts with non-negotiable budgets and constraints

system:
  feature_budget:
    pre_max: 120
    post_target: 45
    post_range: [30, 60]
    interactions_cap: 15
    transforms_per_parent: 1
  
  latency_budget_ms:
    total: 50
    feature_compute: 25
    model_inference: 5
    io_orchestration: 20
  
  lookback_ceiling_minutes: 120
  
  retrain:
    scheduled: "02:00 America/New_York"
    triggered_interval: "2h"
    fallback_p99_ms: 2

# Feature generation menus for lookback selection
menus:
  momentum_bars: [5, 12, 24]
  sigma_halflife_bars: [6, 12, 18]
  gk_window_bars: [6, 12, 24]
  vwap_roll_bars: [6, 12]
  rsi_period: [7, 14]
  autocorr_window: [6, 12]

# Locked interactions (15 total)
interactions_locked:
  - i/tension/mom5_x_negmom20
  - i/tension/rsi14_x_highvol
  - i/tension/bollz_x_widespread
  - i/tension/vwapdist_x_open30
  - i/micro/ofi_x_spread
  - i/micro/tradecount_x_spread
  - i/micro/microprice_x_ofi
  - i/micro/dollarvol_x_widespread
  - i/vol/r1_x_rvshort
  - i/vol/r3_x_rvshort
  - i/vol/vwapdist_x_rvshort
  - i/vol/autocorr_x_rvshort
  - i/model/yhat1_x_rvshort
  - i/model/yhat1_x_vwapdist
  - i/model/yhatconf_x_widespread

# Model configuration
model:
  tree_type: "lightgbm"
  lightgbm:
    max_depth: 3
    num_leaves: 8
    min_child_samples: 500
    feature_fraction: 0.7
    bagging_fraction: 0.8
    lambda_l2: 10.0
    learning_rate: 0.05

# Labeling configuration
labeling:
  bar_size: [5, 15]  # minutes
  horizons: [1, 3]   # bars
  regression_label: "log_return"  # yt(h) = log(Ct+h/Ct)
  classification: true  # sign(y^(h)_t) ∈ {-1, +1}
  
# Calendar and time configuration
calendar:
  exchange_aware: true
  dst_handling: true
  half_days: true
  session_vwap_reset: true
  causal_computation: true  # features computed at bar close

# Transform configuration
transforms:
  ewz_halflife: [9, 12, 18]
  tod_buckets: 48
  tod_granularity_minutes: 30
  winsor_quantiles: [0.001, 0.999]  # 0.1%, 99.9%

# Monitoring thresholds
monitoring:
  calibration_loss_threshold: 2.0  # sigma
  psi_threshold: 0.3
  correlation_drift_threshold: 0.5
  latency_p99_threshold: 50  # ms
  missing_data_threshold: 0.05  # 5% of bars

# Feature gates
feature_gates:
  max_lookback_minutes: 120
  max_compute_time_ms: 2
  max_correlation: 0.85
  causal_required: true