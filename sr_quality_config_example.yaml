# SR Quality Evaluation Configuration Example
# This configuration enables the comprehensive SR quality evaluation system

sr_optimization:
  # Enable quality evaluation in the pipeline
  enable_quality_evaluation: true

  # Quality thresholds for classification
  quality_thresholds:
    elite_threshold: 0.85        # Elite quality levels (top 5%)
    strong_threshold: 0.70       # Strong quality levels (top 15%)
    moderate_threshold: 0.50     # Moderate quality levels (top 50%)
    weak_threshold: 0.30         # Weak quality levels (top 80%)
    # Levels below 0.30 are rejected

    # Minimum requirements
    historical_min_tests: 5      # Minimum historical bounce tests
    confluence_min_levels: 2     # Minimum confluence levels
    volume_min_ratio: 1.2        # Minimum volume confirmation ratio

  # Bayesian optimization settings
  optimization:
    enabled: true
    n_calls: 50                  # Number of optimization iterations
    n_random_starts: 10          # Initial random explorations
    convergence_threshold: 0.001 # Stop when improvement < 0.1%

  # Training data preparation
  training_data:
    create_elite_only: true      # Only elite levels (highest quality)
    create_strong_plus: true     # Elite + Strong levels
    create_moderate_plus: true   # Elite + Strong + Moderate levels
    create_weighted_quality: true # All levels with quality-based weights
    min_samples_per_class: 100   # Minimum samples per quality class

# Example usage in pipeline:
# 1. Add this config to your main config.yaml
# 2. Run step 2.5 with: python ares_launcher.py training blank --symbol BTCUSDT --exchange binance
# 3. Quality evaluation will automatically run and results will be saved to reports/
# 4. Use the generated training datasets in downstream ML training steps

# Alternative: Run standalone evaluation
# python sr_quality_evaluation_example.py --symbol BTCUSDT --exchange binance
