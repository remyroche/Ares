name: Advanced_Trading_Pipeline
version: 2.0.0
description: Advanced trading pipeline with HMM regime detection and ensemble models
environment: production

global_settings:
  data_source:
    type: exchange
    exchange: binance
    api_key_env: BINANCE_API_KEY
    api_secret_env: BINANCE_API_SECRET
    testnet: false
  model:
    type: ensemble
    models:
      - type: lightgbm
        weight: 0.4
        hyperparameters:
          n_estimators: 2000
          learning_rate: 0.05
          max_depth: 8
      - type: xgboost
        weight: 0.3
        hyperparameters:
          n_estimators: 2000
          learning_rate: 0.05
          max_depth: 8
      - type: neural_network
        weight: 0.3
        hyperparameters:
          hidden_layers: [256, 128, 64]
          dropout: 0.2
          learning_rate: 0.001
  logging:
    level: INFO
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file: logs/trading_pipeline.log
  performance:
    max_memory_mb: 16384
    timeout_seconds: 7200
    parallel_workers: 4
  security:
    encrypt_artifacts: true
    encryption_key_env: ENCRYPTION_KEY
  monitoring:
    enable_metrics: true
    metrics_interval: 30
    alert_thresholds:
      memory_usage: 0.8
      execution_time: 3600

steps:
  - name: data_collection
    class_name: DataCollectionStep
    enabled: true
    timeout_seconds: 600
    retry_count: 3
    retry_delay_seconds: 10
    fail_fast: true
    priority: 4
    parameters:
      symbol: BTCUSDT
      timeframe: 1h
      lookback_days: 90
      include_volume: true
      include_orderbook: false
      data_quality_checks: true
    dependencies: []
    validation_rules:
      - type: data_quality
        min_rows: 2000
        max_null_percentage: 1.0
        required_columns: [open, high, low, close, volume]
    resource_limits:
      max_memory_mb: 2048
    metadata:
      description: "Collect market data from Binance exchange"
      tags: ["data", "collection", "binance", "crypto"]

  - name: hmm_regime_discovery
    class_name: HMMRegimeDiscoveryStep
    enabled: true
    timeout_seconds: 1200
    retry_count: 2
    retry_delay_seconds: 30
    fail_fast: true
    priority: 3
    parameters:
      n_components: 4
      max_iterations: 200
      covariance_type: full
      random_state: 42
      features:
        - returns
        - volatility
        - volume_ratio
        - price_momentum
      regime_threshold: 0.7
    dependencies: [data_collection]
    validation_rules:
      - type: regime_quality
        min_regime_samples: 500
        max_regime_entropy: 0.8
    resource_limits:
      max_memory_mb: 4096
    metadata:
      description: "Discover market regimes using Hidden Markov Models"
      tags: ["hmm", "regime", "discovery", "clustering"]

  - name: feature_engineering
    class_name: FeatureEngineeringStep
    enabled: true
    timeout_seconds: 1800
    retry_count: 1
    retry_delay_seconds: 60
    fail_fast: true
    priority: 3
    parameters:
      feature_types:
        - technical
        - statistical
        - wavelet
        - regime_based
        - cross_timeframe
      technical_indicators:
        - sma: [5, 10, 20, 50, 100, 200]
        - ema: [5, 10, 20, 50, 100, 200]
        - rsi: [14, 21, 30]
        - macd: [12, 26, 9]
        - bollinger_bands: [20, 2]
        - atr: [14, 21]
        - stochastic: [14, 3, 3]
      statistical_features:
        - returns: [1, 5, 10, 20]
        - volatility: [5, 10, 20, 30]
        - skewness: [10, 20, 30]
        - kurtosis: [10, 20, 30]
        - autocorrelation: [1, 5, 10]
      wavelet_features:
        - levels: [1, 2, 3, 4]
        - wavelets: [db4, db8, haar]
      regime_features:
        - regime_probability: true
        - regime_transition: true
        - regime_duration: true
      cross_timeframe:
        - timeframes: [5m, 15m, 1h, 4h, 1d]
        - features: [price_ratio, volume_ratio, momentum_ratio]
    dependencies: [hmm_regime_discovery]
    validation_rules:
      - type: feature_quality
        min_features: 50
        max_correlation: 0.9
        min_information_gain: 0.01
    resource_limits:
      max_memory_mb: 8192
    metadata:
      description: "Engineer comprehensive feature set including technical, statistical, and regime-based features"
      tags: ["features", "engineering", "technical", "statistical", "wavelet", "regime"]

  - name: feature_selection
    class_name: FeatureSelectionStep
    enabled: true
    timeout_seconds: 900
    retry_count: 1
    retry_delay_seconds: 30
    fail_fast: true
    priority: 2
    parameters:
      selection_method: multi_objective
      objectives:
        - information_gain
        - correlation_reduction
        - stability
      max_features: 100
      min_features: 20
      feature_groups:
        - technical: 40
        - statistical: 30
        - wavelet: 20
        - regime: 10
      stability_threshold: 0.8
    dependencies: [feature_engineering]
    validation_rules:
      - type: selection_quality
        min_selected_features: 20
        max_redundancy: 0.3
    resource_limits:
      max_memory_mb: 4096
    metadata:
      description: "Select optimal feature subset using multi-objective optimization"
      tags: ["feature_selection", "optimization", "multi_objective"]

  - name: ensemble_training
    class_name: EnsembleTrainingStep
    enabled: true
    timeout_seconds: 3600
    retry_count: 1
    retry_delay_seconds: 120
    fail_fast: true
    priority: 2
    parameters:
      ensemble_method: stacking
      base_models:
        - type: lightgbm
          hyperparameters:
            n_estimators: 2000
            learning_rate: 0.05
            max_depth: 8
            subsample: 0.8
            colsample_bytree: 0.8
            reg_alpha: 0.1
            reg_lambda: 0.1
        - type: xgboost
          hyperparameters:
            n_estimators: 2000
            learning_rate: 0.05
            max_depth: 8
            subsample: 0.8
            colsample_bytree: 0.8
            reg_alpha: 0.1
            reg_lambda: 0.1
        - type: neural_network
          hyperparameters:
            hidden_layers: [256, 128, 64]
            dropout: 0.2
            learning_rate: 0.001
            batch_size: 256
            epochs: 100
            early_stopping: true
      meta_learner:
        type: logistic_regression
        hyperparameters:
          C: 1.0
          max_iter: 1000
      cross_validation:
        method: time_series_split
        n_splits: 5
        test_size: 0.2
      early_stopping:
        enabled: true
        patience: 20
        min_delta: 0.001
    dependencies: [feature_selection]
    validation_rules:
      - type: ensemble_quality
        min_base_accuracy: 0.6
        min_ensemble_improvement: 0.02
    resource_limits:
      max_memory_mb: 12288
    metadata:
      description: "Train ensemble model with LightGBM, XGBoost, and Neural Network"
      tags: ["ensemble", "training", "stacking", "lightgbm", "xgboost", "neural_network"]

  - name: model_validation
    class_name: ModelValidationStep
    enabled: true
    timeout_seconds: 1200
    retry_count: 1
    retry_delay_seconds: 60
    fail_fast: false
    priority: 1
    parameters:
      validation_methods:
        - time_series_split
        - walk_forward
        - monte_carlo
      time_series_split:
        n_splits: 10
        test_size: 0.2
        gap: 1
      walk_forward:
        initial_train_size: 0.6
        step_size: 0.1
        n_splits: 5
      monte_carlo:
        n_simulations: 100
        confidence_level: 0.95
      metrics:
        - accuracy
        - precision
        - recall
        - f1_score
        - roc_auc
        - sharpe_ratio
        - max_drawdown
        - calmar_ratio
    dependencies: [ensemble_training]
    validation_rules:
      - type: validation_quality
        min_samples: 200
        min_sharpe_ratio: 1.0
        max_drawdown: 0.2
    resource_limits:
      max_memory_mb: 4096
    metadata:
      description: "Comprehensive model validation using multiple methods"
      tags: ["validation", "time_series", "walk_forward", "monte_carlo"]

  - name: model_optimization
    class_name: ModelOptimizationStep
    enabled: true
    timeout_seconds: 1800
    retry_count: 1
    retry_delay_seconds: 90
    fail_fast: false
    priority: 1
    parameters:
      optimization_method: bayesian
      objective: sharpe_ratio
      hyperparameter_space:
        lightgbm:
          n_estimators: [1000, 3000]
          learning_rate: [0.01, 0.2]
          max_depth: [4, 12]
          subsample: [0.6, 1.0]
          colsample_bytree: [0.6, 1.0]
        xgboost:
          n_estimators: [1000, 3000]
          learning_rate: [0.01, 0.2]
          max_depth: [4, 12]
          subsample: [0.6, 1.0]
          colsample_bytree: [0.6, 1.0]
        neural_network:
          hidden_layers: [[128, 64], [256, 128, 64], [512, 256, 128, 64]]
          dropout: [0.1, 0.5]
          learning_rate: [0.0001, 0.01]
      n_trials: 100
      early_stopping:
        enabled: true
        patience: 10
    dependencies: [model_validation]
    validation_rules:
      - type: optimization_quality
        min_improvement: 0.01
        max_trials: 200
    resource_limits:
      max_memory_mb: 8192
    metadata:
      description: "Optimize ensemble model hyperparameters using Bayesian optimization"
      tags: ["optimization", "bayesian", "hyperparameters", "ensemble"]

  - name: model_persistence
    class_name: ModelPersistenceStep
    enabled: true
    timeout_seconds: 300
    retry_count: 2
    retry_delay_seconds: 15
    fail_fast: false
    priority: 1
    parameters:
      save_models: true
      save_features: true
      save_metadata: true
      save_predictions: true
      model_format: joblib
      compression: gzip
      versioning: true
      backup_count: 3
      storage_path: models/advanced_trading/
    dependencies: [model_optimization]
    validation_rules:
      - type: persistence_quality
        min_file_size: 1024
        max_file_size: 104857600
    resource_limits:
      max_memory_mb: 1024
    metadata:
      description: "Save trained models and artifacts with versioning and backup"
      tags: ["persistence", "saving", "versioning", "backup"]

metadata:
  author: "Advanced Trading Team"
  created_at: "2024-01-01T00:00:00Z"
  tags: ["advanced", "trading", "ensemble", "hmm", "regime", "optimization"]
  documentation: "https://docs.example.com/pipelines/advanced_trading"
  performance_targets:
    accuracy: 0.65
    sharpe_ratio: 1.5
    max_drawdown: 0.15
    execution_time: 3600