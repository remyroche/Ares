name: Code Quality Checks

on:
  push:
    branches:
      - main # Run on pushes to the main branch
      - develop # Run on pushes to the develop branch
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest # Use a Linux runner

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Action to checkout your repository code

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Poetry
      uses: snok/install-poetry@v1
      with:
        version: '1.8.2' # Use a specific version for reproducibility
        virtualenvs-in-project: true

    - name: Install TA-Lib C Library
      run: |
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz -O /tmp/ta-lib-0.4.0-src.tar.gz
        tar -xzf /tmp/ta-lib-0.4.0-src.tar.gz -C /tmp
        cd /tmp/ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install
    
    - name: Install dependencies
      run: |
        poetry install --no-root --sync

    - name: Run Linters and Formatters
      run: |
        poetry run ruff check .
        poetry run ruff format . --check

    - name: Dead code detection with Vulture
      run: |
        echo "=== Vulture Dead Code Detection ==="
        poetry run vulture src/ --min-confidence 80 --exclude=test_models,test_results,log || true
        echo "=== End Vulture Report ==="

    - name: Dead code detection with Pyright
      run: |
        echo "=== Pyright Dead Code Detection ==="
        poetry run pyright --outputformat=text src/ || true
        echo "=== End Pyright Report ==="

    - name: Run MyPy (Static Type Checking)
      run: |
        echo "=== MyPy Type Checking ==="
        poetry run mypy src/ --show-error-codes --show-column-numbers
        echo "=== End MyPy Report ==="

    - name: Run Radon (Code Complexity and Maintainability)
      run: |
        echo "=== Radon Complexity Analysis ==="
        poetry run radon cc src/ -s -nc
        echo "=== End Radon Report ==="

    - name: Check for unused imports and variables
      run: |
        echo "=== Unused Code Detection ==="
        poetry run ruff check . --select=F401,F841 --output-format=text || true
        echo "=== End Unused Code Report ==="

    - name: Check for unreachable code
      run: |
        echo "=== Unreachable Code Detection ==="
        poetry run ruff check . --select=RET504 --output-format=text || true
        echo "=== End Unreachable Code Report ==="
