name: Code Quality Checks

on:
  push:
    branches:
      - main # Run on pushes to the main branch
      - develop # Run on pushes to the develop branch
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest # Use a Linux runner

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Action to checkout your repository code

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Poetry
      uses: snok/install-poetry@v1
      with:
        version: 'latest' # Use latest version for compatibility with lock file
        virtualenvs-in-project: true

    - name: Install TA-Lib C Library
      run: |
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz -O /tmp/ta-lib-0.4.0-src.tar.gz
        tar -xzf /tmp/ta-lib-0.4.0-src.tar.gz -C /tmp
        cd /tmp/ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install
    
    - name: Install Numpy (Build Requirement)
      run: |
        poetry env use 3.11
        poetry run pip install "numpy>=1.24.0"

    - name: Install dependencies
      env:
        TA_INCLUDE_PATH: /usr/include
        TA_LIBRARY_PATH: /usr/lib
      run: |
        poetry install --no-root --sync

    - name: Run Linters and Formatters
      run: |
        poetry run ruff check . --exclude-from .gitignore
        poetry run ruff format . --check --exclude-from .gitignore

    - name: Dead code detection
      run: poetry run vulture src/ --min-confidence 80 --exclude-from .gitignore || true

    - name: Run MyPy (Static Type Checking)
      run: poetry run mypy --ignore-missing-imports --package src --exclude-from .gitignore

    - name: Run Radon (Code Complexity and Maintainability)
      run: poetry run radon cc src/ -s -nc --exclude-from .gitignore
