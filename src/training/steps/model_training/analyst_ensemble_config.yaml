# Analyst Ensemble Training Configuration
# Configuration for ensemble analyst models training (15m timeframe, runs every 15m)
# Role: Decides IF we trade and emit a green light for the Tactician
# Uses outputs from Analyst base models

analyst_config:
  model_name: "analyst_ensemble"
  model_type: "meta_ensemble"
  target: "trading_signal"  # Green light signal for trading
  base_timeframe: "5m"  # Base timeframe for cross-timeframe features
  execution_timeframe: "15m"  # When to run the model
  execution_frequency: "15m"  # Run every 15 minutes
  
  # Meta-learner configuration (uses Analyst base model outputs)
  meta_learner:
    model_type: "stacker_lgbm_calibrated"
    params:
      n_estimators: 500
      learning_rate: 0.05
      max_depth: 6
      num_leaves: 63
      subsample: 0.9
      colsample_bytree: 0.9
      random_state: 42
      verbosity: -1
      n_jobs: -1
    calibration:
      method: "isotonic"
      enable_temperature_scaling: true
  
  # Input features from Analyst base models
  base_model_outputs:
    lgbm_output: "analyst_base_lgbm_predictions"
    tcn_output: "analyst_base_tcn_predictions"
    catboost_output: "analyst_base_catboost_predictions"
    meta_learner_output: "analyst_base_meta_learner_predictions"
  
  # Training configuration
  # NOTE: The absolute sample numbers below are now OVERRIDDEN by percentage-based allocations
  # calculated in unified_models_training_step.py. Default percentages are:
  # - Training: 70% of total samples
  # - Validation: 15% of total samples
  # - Test: 15% of total samples
  # You can override these percentages by setting train_percentage, validation_percentage, 
  # and test_percentage in the runtime config
  training:
    training_samples: 15000  # Deprecated - calculated as % of total samples
    validation_samples: 5000  # Deprecated - calculated as % of total samples
    test_samples: 3000  # Deprecated - calculated as % of total samples
    enable_cross_validation: true
    cv_folds: 5
    enable_early_stopping: true
    early_stopping_patience: 15
    validation_split: 0.2
    test_split: 0.1
  
  # Performance settings
  performance:
    expected_accuracy: 0.85
    expected_diversity_score: 0.92
    training_time_limit: 600  # seconds
    memory_limit_mb: 4096
  
  # Output settings
  output:
    save_models: true
    save_predictions: true
    generate_reports: true
    output_dir: "./analyst_ensemble_models"

# Feature engineering configuration
feature_engineering:
  # Primary feature source
  primary_features:
    source: "feature_generation_final_feature_selection_step"
    artifact_name: "analyst_features"  # Will be determined by direction, exchange, asset, token
    initial_count: 300  # 300+ features before selection
    target_count: 100   # Down to 100 after selection
  
  # Cross-timeframe features
  cross_timeframe:
    enable: true
    base_timeframe: "5m"
    target_timeframes: ["1m", "5m", "15m", "30m", "1h", "4h", "1d"]
    feature_types: ["technical_indicators", "price_action", "volume_profile", "volatility"]
  
  # Regime features (probabilities for each regime)
  regime_features:
    enable: true
    source: "regime_ml_models"
    feature_names: ["regime_prob_0", "regime_prob_1", "regime_prob_2", "regime_prob_3"]
    include_regime_outputs: true
  
  # Analyst base model outputs as features
  analyst_base_outputs:
    enable: true
    source: "analyst_base_models"
    features:
      - "lgbm_predictions"
      - "lgbm_patchtst_predictions"
      - "catboost_predictions"
      - "meta_learner_predictions"
      - "base_model_confidence_scores"
  
  # Feature selection
  feature_selection:
    method: "lasso"
    alpha: 0.01
    max_features: 100
    enable_recursive_elimination: true
    enable_feature_importance: true
  
  # Feature scaling
  scaling:
    method: "robust"
    enable_outlier_handling: true
    outlier_threshold: 3.0

# Data preparation configuration
data_preparation:
  # Time series specific
  time_series:
    enable_temporal_features: true
    lookback_window: 100
    forecast_horizon: 1
  
  # Target generation
  target_generation:
    method: "price_momentum"
    lookback_periods: [5, 10, 20]
    threshold: 0.02

# Model evaluation configuration
evaluation:
  metrics:
    regression: ["mse", "mae", "r2", "mape"]
    classification: ["accuracy", "precision", "recall", "f1"]
  
  # Cross-validation
  cross_validation:
    method: "time_series_split"
    n_splits: 5
    test_size: 0.2
  
  # Model comparison
  comparison:
    enable_model_ranking: true
    ranking_metric: "r2"
    enable_feature_importance: true
    enable_model_explanations: true

# Hardware optimization
hardware:
  enable_gpu_acceleration: true
  enable_memory_optimization: true
  enable_parallel_processing: true
  memory_limit_gb: 4.0
  max_workers: null

# Logging configuration
logging:
  level: "INFO"
  enable_detailed_logging: true
  log_predictions: true
  log_performance_metrics: true
  log_feature_importance: true
  log_ensemble_metrics: true
  
  # Logging intervals
  intervals:
    training_progress: 50  # log every 50 iterations
    prediction_summary: 500  # log every 500 predictions
    performance_update: 2000  # log every 2000 samples
    ensemble_update: 1000  # log every 1000 ensemble predictions