# Analyst Base Training Configuration
# Configuration for base analyst models training (15m timeframe, runs every 15m)
# Role: Decides IF we trade and emit a green light for the Tactician

analyst_config:
  model_name: "analyst_base"
  model_type: "multi_model_ensemble"
  target: "trading_signal"  # Green light signal for trading
  base_timeframe: "5m"  # Base timeframe for cross-timeframe features
  execution_timeframe: "15m"  # When to run the model
  execution_frequency: "15m"  # Run every 15 minutes
  
  # Base models configuration
  base_models:
    lgbm:
      model_type: "LGBMRegressor"
      params:
        n_estimators: 1000
        learning_rate: 0.1
        max_depth: 8
        num_leaves: 255
        subsample: 0.8
        colsample_bytree: 0.8
        random_state: 42
        verbosity: -1
        n_jobs: -1
    
    tcn:
      model_type: "CausalDilatedTCN"
      params:
        # Note: input_size is now dynamic (100+ features OR latent_dim=16 if autoencoder is used)
        num_filters: 64
        num_layers: 4
        kernel_size: 3
        dilation_base: 2
        dropout: 0.2
        learning_rate: 0.001
        batch_size: 64  # Increased from 32 for faster training
        epochs: 50  # Reduced from 100 (early stopping will catch optimal point)
        early_stopping_patience: 7  # Reduced from 10 for faster convergence detection
        # NEW: Autoencoder integration for faster training & inference
        use_autoencoder: true  # Enable feature compression with frozen autoencoder
        autoencoder_path: "models/analyst_autoencoder_encoder.pth"
        latent_dim: 16  # Compress 100+ features to 16 dimensions
        train_autoencoder_if_missing: true  # Auto-train encoder if not found
        autoencoder_epochs: 25  # Reduced from 50 (sufficient for convergence)
      
      # NEW: Hierarchical Hyperparameter Optimization (HPO)
      hpo:
        enabled: false  # Set to true to run HPO before training
        metric: "accuracy"  # Metric to optimize: "accuracy", "f1", "auc"
        n_rounds: 2  # Number of optimization rounds (2 recommended)
        stages:
          - "coarse_grid"  # Fast exploration
          - "fine_grid"    # Refinement around best
          - "tpe"          # Tree-structured Parzen Estimator (advanced)
        enable_final_refinement: true
        final_refinement_trials: 50
        save_results: true
        results_dir: "artifacts/hpo/analyst_tcn"
    
    catboost:
      model_type: "CatBoostRegressor"
      params:
        iterations: 500  # Reduced from 1500 for faster training
        learning_rate: 0.1  # Increased from 0.08 to compensate for fewer iterations
        depth: 6  # Reduced from 8 for faster training
        l2_leaf_reg: 3.0
        random_seed: 42
        verbose: false
        thread_count: 6  # Limited from -1 to reduce CPU strain
        early_stopping_rounds: 50  # Stop if no improvement
  
  # Training configuration
  # NOTE: The absolute sample numbers below are now OVERRIDDEN by percentage-based allocations
  # calculated in unified_models_training_step.py. Default percentages are:
  # - Training: 70% of total samples
  # - Validation: 15% of total samples
  # - Test: 15% of total samples
  # You can override these percentages by setting train_percentage, validation_percentage, 
  # and test_percentage in the runtime config
  training:
    training_samples: 50000  # Deprecated - calculated as % of total samples
    validation_samples: 15000  # Deprecated - calculated as % of total samples
    test_samples: 10000  # Deprecated - calculated as % of total samples
    enable_cross_validation: true
    cv_folds: 5
    enable_early_stopping: true
    early_stopping_patience: 20
    validation_split: 0.2
    test_split: 0.1
    enable_time_series_split: true
  
  # Performance settings
  performance:
    expected_accuracy: 0.78
    training_time_limit: 300  # seconds
    memory_limit_mb: 2048
  
  # Output settings
  output:
    save_models: true
    save_predictions: true
    generate_reports: true
    output_dir: "./analyst_base_models"

# Feature engineering configuration
feature_engineering:
  # Primary feature source
  primary_features:
    source: "feature_generation_final_feature_selection_step"
    artifact_name: "analyst_features"  # Will be determined by direction, exchange, asset, token
    initial_count: 300  # 300+ features before selection
    target_count: 100   # Down to 100 after selection
  
  # Cross-timeframe features
  cross_timeframe:
    enable: true
    base_timeframe: "5m"
    target_timeframes: ["1m", "5m", "15m", "30m", "1h", "4h", "1d"]
    feature_types: ["technical_indicators", "price_action", "volume_profile", "volatility"]
  
  # Regime features (probabilities for each regime)
  regime_features:
    enable: true
    source: "regime_ml_models"
    feature_names: ["regime_prob_0", "regime_prob_1", "regime_prob_2", "regime_prob_3"]
    include_regime_outputs: true
  
  # Feature selection
  feature_selection:
    method: "lasso"
    alpha: 0.01
    max_features: 100
    enable_recursive_elimination: true
    enable_feature_importance: true
  
  # Feature scaling
  scaling:
    method: "robust"
    enable_outlier_handling: true
    outlier_threshold: 3.0

# Data preparation configuration
data_preparation:
  # Time series specific
  time_series:
    enable_temporal_features: true
    lookback_window: 50
    forecast_horizon: 1
  
  # Target generation
  target_generation:
    method: "price_momentum"
    lookback_periods: [5, 10, 20]
    threshold: 0.02

# Model evaluation configuration
evaluation:
  metrics:
    regression: ["mse", "mae", "r2", "mape"]
    classification: ["accuracy", "precision", "recall", "f1"]
  
  # Cross-validation
  cross_validation:
    method: "time_series_split"
    n_splits: 5
    test_size: 0.2
  
  # Model comparison
  comparison:
    enable_model_ranking: true
    ranking_metric: "r2"
    enable_feature_importance: true

# Hardware optimization
hardware:
  enable_gpu_acceleration: false  # CatBoost doesn't use GPU
  enable_memory_optimization: true
  enable_parallel_processing: true
  memory_limit_gb: 2.0
  max_workers: null

# Logging configuration
logging:
  level: "INFO"
  enable_detailed_logging: true
  log_predictions: true
  log_performance_metrics: true
  log_feature_importance: true
  
  # Logging intervals
  intervals:
    training_progress: 100  # log every 100 iterations
    prediction_summary: 1000  # log every 1000 predictions
    performance_update: 5000  # log every 5000 samples