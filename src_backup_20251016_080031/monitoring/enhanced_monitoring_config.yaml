# Enhanced Monitoring Configuration
# Comprehensive monitoring system for trading decisions across backtesting, paper trading, and live trading

enhanced_monitoring:
  # Core monitoring settings
  enable_monitoring: true
  enable_explanations: true
  enable_real_time_tracking: true
  
  # Export settings
  monthly_export_enabled: true
  daily_export_enabled: true
  export_directory: "enhanced_monitoring_exports"
  
  # Performance tracking
  max_decisions_in_memory: 50000
  performance_window_days: 30
  
  # SHAP/LIME settings
  enable_shap: true
  enable_lime: true
  explanation_timeout: 30
  
  # Trading integration
  auto_integrate_trading_systems: true
  capture_all_trading_modes: true
  
  # Data retention
  data_retention_days: 365
  cleanup_frequency_hours: 24

# Enhanced ML Monitoring Configuration
enhanced_ml_monitoring:
  enable_shap: true
  enable_lime: true
  csv_export_interval_days: 30
  max_decisions_in_memory: 10000
  export_directory: "monitoring_exports"

# SHAP Analysis Configuration
shap_analysis:
  enable_shap: true
  max_features: 50
  explanation_timeout: 30
  cache_explainers: true
  max_cached_explainers: 10

# LIME Analysis Configuration
lime_analysis:
  enable_lime: true
  max_features: 20
  num_samples: 1000
  explanation_timeout: 30
  cache_explainers: true
  max_cached_explainers: 10

# Explainability Integration Configuration
explainability_integration:
  enable_combined_explanations: true
  explanation_storage_path: "explanations"
  cleanup_frequency_days: 30
  max_stored_explanations: 10000

# Trade Decision Context Capture Configuration
trade_decision_capture:
  enable_market_conditions: true
  enable_hmm_context: true
  enable_signal_context: true
  enable_model_context: true
  enable_ensemble_context: true
  
  # Data sources (optional - can be None)
  market_data_source: null
  hmm_model_source: null
  signal_generator_source: null
  
  # Technical indicator settings
  technical_indicators:
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bollinger_period: 20
    bollinger_std: 2
    atr_period: 14
    adx_period: 14

# Ensemble Monitoring Configuration
ensemble_monitoring:
  weight_update_frequency_hours: 24
  performance_window_days: 30
  min_weight_threshold: 0.01
  max_weight_threshold: 0.8
  rebalance_threshold: 0.1
  enable_automatic_rebalancing: true
  rebalancing_frequency_hours: 168  # Weekly

# Daily Summary Tracker Configuration
daily_summary_tracker:
  enable_real_time_updates: true
  summary_retention_days: 365
  export_directory: "daily_summaries"
  auto_export_daily: true
  auto_export_weekly: true
  auto_export_monthly: true

# Trading Integration Configuration
trading_integration:
  enable_monitoring: true
  capture_explanations: true
  capture_performance_metrics: true
  real_time_export: false
  export_interval_minutes: 60
  max_memory_decisions: 10000
  
  # Integration settings for different trading modes
  backtesting:
    enable_integration: true
    capture_all_decisions: true
    export_frequency: "end_of_run"
  
  paper_trading:
    enable_integration: true
    capture_all_decisions: true
    export_frequency: "daily"
  
  live_trading:
    enable_integration: true
    capture_all_decisions: true
    export_frequency: "hourly"
    enable_real_time_alerts: true

# CSV Export Configuration
csv_exports:
  # Monthly report settings
  monthly_reports:
    enabled: true
    include_detailed_decisions: true
    include_daily_summaries: true
    include_model_performance: true
    include_ensemble_analysis: true
    include_regime_analysis: true
    include_risk_metrics: true
  
  # Daily ongoing CSV settings
  daily_ongoing:
    enabled: true
    filename: "ongoing_daily_metrics.csv"
    include_columns:
      - date
      - exchange
      - asset
      - total_trades
      - long_trades
      - short_trades
      - hold_trades
      - dominant_hmm_clusters
      - sharpe_ratio
      - pnl_absolute
      - pnl_percentage
      - win_rate
      - profit_factor
      - max_drawdown
      - avg_confidence
      - avg_risk_score
      - model_accuracy_avg
      - ensemble_consensus_avg
  
  # Export formats
  export_formats:
    csv: true
    json: false
    parquet: false
    excel: false

# Performance Monitoring Configuration
performance_monitoring:
  # Model performance tracking
  model_performance:
    track_accuracy: true
    track_precision: true
    track_recall: true
    track_f1_score: true
    track_auc_score: true
    track_win_rate: true
    track_profit_factor: true
    track_sharpe_ratio: true
    track_max_drawdown: true
    track_prediction_confidence: true
    track_feature_importance_stability: true
    track_concept_drift: true
    track_data_drift: true
  
  # Ensemble performance tracking
  ensemble_performance:
    track_model_diversity: true
    track_consensus_quality: true
    track_disagreement_impact: true
    track_weight_stability: true
    track_ensemble_accuracy: true
    track_ensemble_sharpe: true
    track_ensemble_drawdown: true

# Risk Monitoring Configuration
risk_monitoring:
  # Risk metrics to track
  risk_metrics:
    var_95: true
    var_99: true
    expected_shortfall: true
    max_drawdown: true
    sharpe_ratio: true
    sortino_ratio: true
    calmar_ratio: true
    omega_ratio: true
  
  # Risk thresholds
  risk_thresholds:
    max_drawdown_threshold: 0.20  # 20%
    var_95_threshold: 0.05  # 5%
    sharpe_ratio_minimum: 1.0
    win_rate_minimum: 0.45  # 45%
  
  # Risk alerts
  risk_alerts:
    enable_alerts: true
    alert_on_drawdown_breach: true
    alert_on_var_breach: true
    alert_on_sharpe_decline: true
    alert_on_win_rate_decline: true

# HMM Regime Monitoring Configuration
hmm_regime_monitoring:
  enable_regime_tracking: true
  track_regime_transitions: true
  track_regime_performance: true
  track_regime_stability: true
  regime_performance_window: 30  # days
  
  # Regime-specific settings
  regime_settings:
    min_regime_duration: 5  # minimum periods in a regime
    regime_transition_threshold: 0.7  # probability threshold for regime change
    track_regime_volatility: true
    track_regime_trend_strength: true
    track_regime_momentum: true

# Logging Configuration
logging:
  log_level: "INFO"
  log_file: "enhanced_monitoring.log"
  log_rotation: "daily"
  log_retention_days: 30
  enable_console_logging: true
  enable_file_logging: true
  
  # Log categories
  log_categories:
    trade_decisions: true
    model_explanations: true
    ensemble_performance: true
    risk_metrics: true
    regime_analysis: true
    export_operations: true
    error_handling: true

# Database Configuration (optional)
database:
  enable_database_storage: false
  database_url: "sqlite:///enhanced_monitoring.db"
  connection_pool_size: 10
  query_timeout: 30
  
  # Table configurations
  tables:
    trade_decisions:
      enable: true
      retention_days: 365
      batch_size: 1000
    
    model_performance:
      enable: true
      retention_days: 365
      batch_size: 100
    
    ensemble_performance:
      enable: true
      retention_days: 365
      batch_size: 100
    
    daily_summaries:
      enable: true
      retention_days: 1095  # 3 years
      batch_size: 100

# API Configuration (optional)
api:
  enable_api: false
  api_host: "localhost"
  api_port: 8080
  api_debug: false
  
  # API endpoints
  endpoints:
    trade_decisions: true
    model_performance: true
    ensemble_analysis: true
    daily_summaries: true
    risk_metrics: true
    regime_analysis: true
  
  # Authentication
  authentication:
    enable_auth: false
    api_key_required: false
    jwt_secret: "your-secret-key"

# Alerting Configuration
alerting:
  enable_alerts: false
  
  # Alert channels
  channels:
    email:
      enabled: false
      smtp_server: "smtp.gmail.com"
      smtp_port: 587
      username: ""
      password: ""
      recipients: []
    
    slack:
      enabled: false
      webhook_url: ""
      channel: "#trading-alerts"
    
    webhook:
      enabled: false
      webhook_url: ""
      timeout: 30
  
  # Alert conditions
  alert_conditions:
    high_drawdown:
      enabled: true
      threshold: 0.15  # 15%
      cooldown_minutes: 60
    
    low_sharpe_ratio:
      enabled: true
      threshold: 0.5
      cooldown_minutes: 120
    
    model_degradation:
      enabled: true
      accuracy_drop_threshold: 0.1  # 10%
      cooldown_minutes: 180
    
    ensemble_disagreement:
      enabled: true
      disagreement_threshold: 0.3  # 30%
      cooldown_minutes: 60

# Development and Testing Configuration
development:
  enable_debug_mode: false
  enable_profiling: false
  enable_mock_data: false
  
  # Testing settings
  testing:
    use_mock_models: false
    use_mock_market_data: false
    simulate_latency: false
    latency_range_ms: [10, 100]
  
  # Performance testing
  performance_testing:
    enable_load_testing: false
    max_concurrent_requests: 100
    test_duration_minutes: 60