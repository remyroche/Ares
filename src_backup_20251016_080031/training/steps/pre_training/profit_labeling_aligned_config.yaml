# Profit Labeling Aligned Configuration
# This configuration ensures all optimization systems use the same quality thresholds
# and objectives as defined in the profit labeling framework

# Global optimization settings
optimization:
  primary_objective: "multi_objective"  # ic_only, lqs_only, multi_objective, quality_filtered
  enable_quality_scoring: true
  enable_multi_objective: true
  
  # Multi-objective weights
  weights:
    ic: 0.4
    lqs: 0.4
    stability: 0.2

# Profit labeling quality thresholds (aligned with framework)
quality_thresholds:
  min_lqs_threshold: 0.3
  min_auc_threshold: 0.55
  max_auc_std_threshold: 0.03
  min_psi_threshold: 0.1
  max_flip_rate_threshold: 0.15
  min_balance_threshold: 0.35
  max_balance_threshold: 0.65
  max_correlation_threshold: 0.4

# Feature filtering settings
feature_filtering:
  enable_quality_filtering: true
  min_feature_quality_score: 0.2
  max_feature_correlation: 0.8
  enable_noise_gating: true

# Feature lookback optimization settings
feature_lookback_optimization:
  optimization_metric: "lqs_combined"  # Use LQS instead of just IC
  enable_quality_scoring: true
  enable_multi_objective: true
  
  # Lookback range
  min_lookback: 5
  max_lookback: 98
  lookback_step: 5
  
  # Quality thresholds (inherited from global)
  min_lqs_threshold: 0.3
  min_auc_threshold: 0.55
  max_auc_std_threshold: 0.03
  min_psi_threshold: 0.1
  max_flip_rate_threshold: 0.15
  min_balance_threshold: 0.35
  max_balance_threshold: 0.65
  max_correlation_threshold: 0.4
  
  # Multi-objective weights
  ic_weight: 0.4
  lqs_weight: 0.4
  stability_weight: 0.2

# Interaction feature generator settings
interaction_feature_generator:
  # IC surface estimation with LQS integration
  ic_surface:
    enable_lqs_scoring: true
    quality_scorer_available: true
    
  # Walk-forward stability testing
  stability_testing:
    enable_quality_validation: true
    min_quality_threshold: 0.2
    
  # Hierarchical Bayesian shrinkage
  hierarchical_shrinkage:
    enable_quality_priors: true
    quality_weight: 0.3

# Quality scoring configuration
quality_scoring:
  baseline_models: ["logistic", "random_forest"]
  test_size: 0.2
  n_splits: 5
  random_state: 42
  
  # Quality thresholds
  min_lqs_score: 0.3
  min_auc_threshold: 0.55
  max_auc_std_threshold: 0.03
  min_psi_threshold: 0.1
  max_flip_rate_threshold: 0.15
  min_balance_threshold: 0.35
  max_balance_threshold: 0.65
  max_correlation_threshold: 0.4

# Multi-target scheme configuration
multi_target_scheme:
  small_band: [0.4, 0.8]
  medium_band: [0.8, 1.3]
  high_band: [1.3, 2.0]
  enable_optimization: true
  optimization_method: "bayesian"
  n_trials: 50
  optimization_metric: "lqs"
  
  # Quality thresholds for target selection
  min_lqs_score: 0.3
  max_correlation_threshold: 0.6
  min_class_balance: 0.35
  max_class_balance: 0.65

# Noise gating configuration
noise_gating:
  min_volume_threshold: 1000
  max_spread_ratio: 0.01
  min_tick_count: 10
  enable_volatility_filtering: true
  volatility_threshold_percentile: 5.0

# Volatility modeling configuration
volatility_modeling:
  method: "garch"
  window_size: 252
  min_periods: 50
  enable_regime_detection: true
  regime_threshold: 0.1

# Output settings
output:
  save_results: true
  generate_reports: true
  output_directory: "profit_labeling_aligned_results"
  include_quality_metrics: true
  include_lqs_breakdown: true