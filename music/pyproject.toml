[tool.poetry]
name = "music-factory"
version = "0.1.0"
description = "Automated AI Music Factory"
authors = ["AI <ai@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
sqlalchemy = "^2.0.30"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
celery = "^5.4.0"
redis = "^5.0.4"
boto3 = "^1.34.110"
pydantic = "^2.7.2"
pydantic-settings = "^2.2.1"
python-multipart = "^0.0.9"
pillow = "^10.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.1"
ruff = "^0.4.5"
black = "^24.4.2"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"
