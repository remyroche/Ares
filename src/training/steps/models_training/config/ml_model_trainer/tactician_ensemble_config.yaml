# Tactician Ensemble Models Configuration
# This config defines ensemble models that combine multiple tactician base models

model_type: "tactician_ensemble"
timeframe: "15m"
description: "Tactician ensemble models combining multiple base models for enhanced tactical decisions"

# Tactician Ensemble Models Configuration
# Meta-learner: stacker_lgbm_calibrated with gating
models:
  - name: "stacker_lgbm_calibrated_gated"
    type: "STACKER_LGBM_CALIBRATED_GATED"
    enabled: true
    description: "Stacked ensemble with LightGBM meta-learner, calibration, and gating mechanism"
    parameters:
      # Base models (inherited from tactician base) - Fixed naming consistency
      base_models:
        - "lgbm_gru_embeddings"
        - "catboost_tactician"
        - "causal_dilated_tcn"
      
      # Meta-learner configuration
      meta_learner_type: "LIGHTGBM"
      meta_learner_params:
        objective: "binary"
        metric: "binary_logloss"
        boosting_type: "gbdt"
        num_leaves: 31
        learning_rate: 0.05
        feature_fraction: 0.9
        bagging_fraction: 0.8
        bagging_freq: 5
        verbose: -1
        random_state: 42
        n_estimators: 1000
        early_stopping_rounds: 50
        min_data_in_leaf: 20
        min_gain_to_split: 0.0
        lambda_l1: 0.0
        lambda_l2: 0.0
      
      # Stacking configuration
      cv_folds: 5
      use_features_in_secondary: true
      use_proba_as_level1: true  # binary classification, so use probabilities
      n_jobs: -1
      
      # Calibration parameters
      calibration_method: "isotonic"  # isotonic or platt
      calibration_cv_folds: 3
      calibration_test_size: 0.2
      
      # Note: Gating mechanism removed - using standard stacking approach
      
      # Performance optimization
      enable_parallel_processing: true
      memory_efficient: true
      
      # Tactician-specific parameters
      prediction_horizon: 1
      # Adaptive confidence threshold based on market volatility
      confidence_threshold:
        base_threshold: 0.7
        volatility_adjustment: true
        volatility_window: 20  # Lookback window for volatility calculation
        min_threshold: 0.5  # Minimum confidence threshold
        max_threshold: 0.9  # Maximum confidence threshold
        volatility_threshold: 0.02  # Volatility threshold for adjustment
        adjustment_factor: 0.1  # How much to adjust based on volatility
      uncertainty_estimation: true
      blend_method: "stacking"  # Use stacking instead of weighted average
      validation_split: 0.2

# Base Models for Ensemble - Fixed naming to match tactician_base_config.yaml
base_models:
  - name: "lgbm_gru_embeddings"
    type: "LIGHTGBM_GRU"
    enabled: true
    parameters:
      objective: "binary"
      metric: "binary_logloss"
      boosting_type: "gbdt"
      num_leaves: 31
      learning_rate: 0.08
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 5
      verbose: -1
      random_state: 42
      n_estimators: 400  # Reduced for efficiency
      early_stopping_rounds: 30  # Reduced for efficiency
      gru_hidden_size: 32
      gru_num_layers: 2
      gru_dropout: 0.2
      gru_bidirectional: false
      embedding_dim: 16
      sequence_length: 20
      gru_learning_rate: 0.002
      gru_epochs: 30
      gru_batch_size: 64

  - name: "catboost_tactician"
    type: "CATBOOST"
    enabled: true
    parameters:
      objective: "Logloss"
      eval_metric: "Logloss"
      iterations: 400  # Reduced for efficiency
      learning_rate: 0.08
      depth: 6
      l2_leaf_reg: 5
      random_seed: 42
      early_stopping_rounds: 30  # Reduced for efficiency
      verbose: false
      min_data_in_leaf: 25
      bootstrap_type: "Bayesian"
      bagging_temperature: 0.8
      subsample: 0.8
      loss_function: "Logloss"
      custom_metric: ["AUC", "Precision", "Recall"]
      boosting_type: "Plain"

  - name: "causal_dilated_tcn"
    type: "CAUSAL_DILATED_TCN"
    enabled: true
    parameters:
      input_channels: 1
      output_channels: 64
      num_layers: 4
      kernel_size: 3
      dilation_base: 2
      dropout: 0.1
      causal_padding: true
      zero_init_residual: true
      learning_rate: 0.002
      batch_size: 64
      epochs: 40  # Reduced for efficiency
      early_stopping_patience: 10  # Reduced for efficiency
      weight_decay: 1e-3
      sequence_length: 50
      prediction_horizon: 1
      optimizer: "adam"
      scheduler: "cosine"
      warmup_epochs: 10
      gradient_clip_norm: 1.0
      label_smoothing: 0.0
      learning_rate_init: 0.001
      max_iter: 1000
      early_stopping: true
      validation_fraction: 0.1
      n_iter_no_change: 10
      random_state: 42

# Target Configuration
targets:
  primary: "position_confidence"  # Calibrated confidence score for position entry/stay (0-1)
  secondary: "position_target"  # Original binary classification target (0/1)
  target_type: "binary_classification"
  confidence_calibration: true
  calibration_method: "isotonic"  # or "platt", "sigmoid"
  
  # Target validation
  target_validation:
    check_binary_target: true
    check_confidence_bounds: true
    confidence_bounds: [0.0, 1.0]
    binary_target_values: [0, 1]
    check_temporal_consistency: true
    check_lookahead_bias: true  # Critical for ensemble models

# Input Configuration
inputs:
  # Pre-selected features from upstream feature generation
  # These are specific to tactician model type and direction (shorts/longs)
  pre_selected_features:
    description: "Features pre-selected by feature_generation_final_feature_selection_step"
    source: "upstream_feature_generation"
    
  # Regime features from regime_ensemble_training
  regime_features:
    description: "Regime features generated by regime ML model"
    source: "regime_ensemble_training"
    enabled: true
    
  # Tactician base model outputs
  tactician_base_outputs:
    description: "Outputs from Tactician base models"
    source: "tactician_base_training"
    enabled: true
    
  # Analyst ensemble model outputs
  analyst_ensemble_outputs:
    description: "Outputs from Analyst ensemble model"
    source: "analyst_ensemble_training"
    enabled: true
  
  # Regime model outputs (from previous pipeline steps)
  regime_outputs:
    - "regime_classification"
    - "regime_probabilities"
    - "regime_transition_matrix"
    - "regime_volatility_estimates"
    - "regime_correlation_structure"
  
  # Analyst model outputs (from analyst base and ensemble models)
  analyst_outputs:
    - "analyst_base_predictions"
    - "analyst_base_confidence"
    - "analyst_ensemble_predictions"
    - "analyst_ensemble_confidence"
    - "analyst_feature_importance"
    - "analyst_shap_values"
  
  # Previous tactician model outputs (from tactician base models)
  previous_model_outputs:
    - "tactician_base_predictions"  # From tactician base models
    - "tactician_base_entry_timing"  # From tactician base models
    - "tactician_base_exit_timing"  # From tactician base models
    - "tactician_base_position_sizing"  # From tactician base models
    - "tactician_base_confidence"  # From tactician base models

# Training Configuration
training:
  validation_split: 0.15
  cv_folds: 5
  test_split: 0.05
  random_state: 42
  stratify: true  # Binary classification uses stratification
  
  # Cross-validation strategy - Enhanced for financial data
  cv_strategy: "PurgedTimeSeriesSplit"  # Prevents lookahead bias
  cv_params:
    n_splits: 5
    test_size: 0.2
    purge_length: 5  # Purge 5 periods to prevent leakage
    embargo_length: 2  # Embargo 2 periods after test set
  
  # Caching configuration - Uses unified configuration
  caching:
    config_source: "unified_memory_config.yaml"
    model_type: "tactician_ensemble"
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 50
    min_delta: 0.001
    monitor: "val_loss"
    mode: "min"
  
  # Hyperparameter optimization
  hyperparameter_optimization:
    enabled: true
    method: "optuna"
    n_trials: 100
    timeout: 3600  # 1 hour
    direction: "maximize"
    metric: "f1_score"
  
  # Note: Multi-output training removed - using binary classification for confidence scoring
  
  # Ensemble-specific training
  ensemble_training:
    # Stacking training
    stacking:
      meta_learner_cv: 5
      use_features_in_secondary: true
      meta_learner_early_stopping: true
      meta_learner_patience: 20
    
    # Note: Blending removed - using stacking approach


# Data Quality & Leakage Prevention
data_quality:
  # Leakage detection - Enhanced for financial models
  leakage_detection:
    enabled: true
    methods: ["temporal_consistency", "feature_correlation", "target_correlation", "future_data_detection", "volatility_leakage", "ensemble_leakage", "tactician_leakage"]
    max_correlation_threshold: 0.95
    temporal_window: 5
    future_data_threshold: 0.01  # Max correlation with future data
    volatility_lookback: 20  # Volatility calculation lookback window
    ensemble_purge_length: 3  # Additional purge for ensemble models
    tactician_purge_length: 4  # Additional purge for tactician models
  
  # Data validation - Enhanced for financial data
  validation:
    check_missing_values: true
    check_infinite_values: true
    check_duplicate_timestamps: true
    check_data_types: true
    max_missing_percentage: 0.05
    check_temporal_order: true  # Ensure data is chronologically ordered
    check_lookahead_bias: true  # Detect potential future data leakage
    check_stationarity: true  # Check for non-stationary features
    stationarity_threshold: 0.05
  
  # Outlier detection
  outlier_detection:
    enabled: true
    method: "isolation_forest"
    contamination: 0.1
    random_state: 42
  
  # Tactician-specific validation
  tactician_validation:
    check_target_bounds: true
    entry_timing_bounds: [-1.0, 1.0]
    exit_timing_bounds: [-1.0, 1.0]
    position_sizing_bounds: [0.0, 1.0]
    check_temporal_consistency: true

# Metrics & Evaluation
metrics:
  primary: "f1_score"
  secondary: ["precision", "recall", "accuracy", "auc_roc"]
  confidence_metrics: ["brier_score", "log_loss", "calibration_error"]
  
  # SHAP analysis
  shap_analysis:
    enabled: true
    sample_size: 1000
    background_samples: 100
    explainer_type: "tree"
  
  # Feature importance
  feature_importance:
    enabled: true
    methods: ["permutation", "shap", "builtin"]
    top_n_features: 20
  
  # Tactician-specific metrics
  tactician_metrics:
    # Trading performance
    trading_metrics:
      enabled: true
      metrics: ["sharpe_ratio", "calmar_ratio", "sortino_ratio", "max_drawdown"]
    
    # Timing accuracy
    timing_accuracy:
      enabled: true
      metrics: ["timing_precision", "timing_recall", "timing_f1"]
    
    # Position sizing accuracy
    position_sizing_accuracy:
      enabled: true
      metrics: ["sizing_rmse", "sizing_mae", "sizing_correlation"]
  
  # Ensemble-specific metrics
  ensemble_metrics:
    # Individual model performance
    track_individual_models: true
    individual_model_metrics: ["rmse", "mae", "r2_score"]
    
    # Ensemble performance
    ensemble_improvement: true
    diversity_metrics: true
    correlation_analysis: true
    
    # Tactician ensemble metrics
    tactician_ensemble_metrics:
      track_entry_timing_ensemble: true
      track_exit_timing_ensemble: true
      track_position_sizing_ensemble: true
      track_trading_performance_ensemble: true

# Memory Optimization - Uses unified configuration from utils/hardware/
memory_optimization:
  # Import unified configuration
  config_source: "unified_memory_config.yaml"
  model_type: "tactician_ensemble"
  
  # Hardware integration
  use_integrated_hardware_manager: true
  use_enhanced_caching_system: true
  use_memory_optimized_decorators: true
  use_dynamic_memory_allocator: true

# Performance Monitoring
monitoring:
  # Training monitoring
  training:
    log_metrics_every: 10  # epochs
    save_checkpoints: true
    checkpoint_frequency: 50  # epochs
    checkpoint_dir: "checkpoints/tactician_ensemble"
  
  # Model performance
  performance:
    track_training_time: true
    track_memory_usage: true
    track_gpu_usage: true
    log_predictions: true
    prediction_sample_size: 1000
  
  # Tactician monitoring
  tactician_monitoring:
    track_entry_timing: true
    track_exit_timing: true
    track_position_sizing: true
    track_trading_performance: true
    track_risk_metrics: true
  
  # Ensemble monitoring
  ensemble_monitoring:
    track_individual_models: true
    track_ensemble_weights: true
    track_diversity_metrics: true
    track_correlation_matrix: true
    track_tactician_ensemble_performance: true

# Output Configuration
output:
  # Model artifacts
  models:
    save_format: "joblib"
    save_path: "models/tactician_ensemble"
    include_metadata: true
    include_feature_names: true
    include_training_history: true
    include_target_names: true
    include_ensemble_weights: true
    include_individual_models: true
  
  # Results
  results:
    save_predictions: true
    save_probabilities: true
    save_feature_importance: true
    save_shap_values: true
    save_trading_signals: true
    save_risk_metrics: true
    save_ensemble_weights: true
    save_individual_predictions: true
    results_path: "results/tactician_ensemble"
  
  # Reports
  reports:
    generate_report: true
    report_format: "html"
    include_plots: true
    include_tables: true
    include_trading_analysis: true
    include_risk_analysis: true
    include_ensemble_analysis: true
    report_path: "reports/tactician_ensemble"