# Tactician Ensemble Training Configuration
# Configuration for ensemble tactician models training (15m timeframe, runs every 3m)
# Role: When Analyst gives green light, decides WHEN to trade based on 0.5% price change timing
# Uses outputs from Analyst ensemble + Tactician base models (separate GRU and LGBM)

tactician_config:
  model_name: "tactician_ensemble"
  model_type: "meta_ensemble"
  params: {}
  target: "entry_timing"  # Timing for 0.5% price change
  base_timeframe: "15m"  # Base timeframe for cross-timeframe features & optimized lookback
  execution_timeframe: "15m"  # When to run the model
  execution_frequency: "3m"  # Run every 3 minutes
  price_change_target: 0.005  # 0.5% price change target
  
  # Meta-learner configuration (uses Analyst ensemble + Tactician base outputs)
  meta_learner:
    model_type: "stacker_lgbm_calibrated"
    gating: true  # Enable gating mechanism
    params:
      n_estimators: 500
      learning_rate: 0.05
      max_depth: 6
      num_leaves: 63
      subsample: 0.9
      colsample_bytree: 0.9
      random_state: 42
      verbosity: -1
      n_jobs: -1
    calibration:
      method: "isotonic"
      enable_temperature_scaling: true
    gating_params:
      gate_threshold: 0.7
      enable_adaptive_gating: true
      gate_learning_rate: 0.01
    # HPO search ranges for meta-learner (optimal parameters will be saved here after HPO)
    hpo:
      enabled: true
      n_rounds: 2
      enable_final_refinement: true
      final_refinement_trials: 50
      search_space:
        max_depth:
          type: "int"
          low: 3
          high: 8
        learning_rate:
          type: "float"
          low: 0.01
          high: 0.2
          log: true
        num_leaves:
          type: "int"
          low: 20
          high: 150
        reg_alpha:
          type: "float"
          low: 0.0
          high: 3.0
        reg_lambda:
          type: "float"
          low: 0.0
          high: 3.0
        subsample:
          type: "float"
          low: 0.7
          high: 1.0
        colsample_bytree:
          type: "float"
          low: 0.7
          high: 1.0
        min_child_samples:
          type: "int"
          low: 10
          high: 50
        min_gain_to_split:
          type: "float"
          low: 0.1
          high: 1.0
      # Optimal parameters found by HPO (will be updated automatically)
      optimal_params: {}
  
  # Input features from Analyst ensemble models
  analyst_ensemble_outputs:
    enable: true
    source: "analyst_ensemble_models"
    features:
      - "analyst_ensemble_predictions"
      - "analyst_ensemble_confidence"
      - "analyst_ensemble_meta_learner_output"
  
  # Input features from Tactician base models
  tactician_base_outputs:
    enable: true
    source: "tactician_base_models"
    features:
      - "gru_predictions"          # Standalone GRU model predictions
      - "lgbm_predictions"         # Standalone LGBM model predictions
      - "catboost_predictions"     # CatBoost model predictions
      - "extratrees_predictions"   # Extra Trees model predictions
      - "tactician_base_meta_learner_output"
      - "tactician_base_confidence_scores"
  
  # Training configuration
  # NOTE: The absolute sample numbers below are now OVERRIDDEN by percentage-based allocations
  # calculated in unified_models_training_step.py. Default percentages are:
  # - Training: 70% of total samples
  # - Validation: 15% of total samples
  # - Test: 15% of total samples
  # You can override these percentages by setting train_percentage, validation_percentage, 
  # and test_percentage in the runtime config
  training:
    training_samples: 12000  # Deprecated - calculated as % of total samples
    validation_samples: 4000  # Deprecated - calculated as % of total samples
    test_samples: 2500  # Deprecated - calculated as % of total samples
    enable_cross_validation: true
    cv_folds: 3  # Reduced from 5 for faster training
    enable_early_stopping: true
    early_stopping_patience: 20
    validation_split: 0.2
    test_split: 0.1
  
  # Performance settings
  performance:
    expected_accuracy: 0.88
    expected_sharpe_ratio: 1.78
    expected_calibration_score: 0.91
    training_time_limit: 800  # seconds
    memory_limit_mb: 4096
  
  # Output settings
  output:
    save_models: true
    save_predictions: true
    generate_reports: true
    output_dir: "./tactician_ensemble_models"

# Feature engineering configuration
feature_engineering:
  # Primary feature source
  primary_features:
    source: "feature_generation_final_feature_selection_step"
    artifact_name: "tactician_features"  # Will be determined by direction, exchange, asset, token
    initial_count: 300  # 300+ features before selection
    target_count: 100   # Down to 100 after selection
  
  # Cross-timeframe features
  cross_timeframe:
    enable: true
    base_timeframe: "15m"
    target_timeframes: ["1m", "5m", "15m", "30m", "1h", "4h", "1d"]
    feature_types: ["technical_indicators", "price_action", "volume_profile", "volatility"]
    optimized_lookback: true
  
  # Regime features (probabilities for each regime)
  regime_features:
    enable: true
    source: "regime_ml_models"
    feature_names: ["regime_prob_0", "regime_prob_1", "regime_prob_2", "regime_prob_3"]
    include_regime_outputs: true
  
  # Analyst ensemble outputs as features
  analyst_ensemble_outputs:
    enable: true
    source: "analyst_ensemble_models"
    features:
      - "analyst_ensemble_predictions"
      - "analyst_ensemble_confidence"
      - "analyst_ensemble_meta_learner_output"
  
  # Tactician base outputs as features
  tactician_base_outputs:
    enable: true
    source: "tactician_base_models"
    features:
      - "gru_predictions"          # Standalone GRU model predictions
      - "lgbm_predictions"         # Standalone LGBM model predictions
      - "catboost_predictions"     # CatBoost model predictions
      - "extratrees_predictions"   # Extra Trees model predictions
      - "tactician_base_meta_learner_output"
      - "tactician_base_confidence_scores"
  
  # Feature selection
  feature_selection:
    method: "lasso"
    alpha: 0.005
    max_features: 150
    enable_recursive_elimination: true
    enable_feature_importance: true
  
  # Feature scaling
  scaling:
    method: "robust"
    enable_outlier_handling: true
    outlier_threshold: 2.5

# Data preparation configuration
data_preparation:
  # Time series specific
  time_series:
    enable_temporal_features: true
    lookback_window: 200
    forecast_horizon: 1
  
  # Target generation for strategy optimization
  target_generation:
    method: "momentum_based"
    lookback_periods: [5, 10, 20]
    momentum_threshold: 0.01
    enable_risk_adjustment: true
    risk_free_rate: 0.02

# Model evaluation configuration
evaluation:
  metrics:
    regression: ["mse", "mae", "r2", "mape"]
    classification: ["accuracy", "precision", "recall", "f1"]
    trading: ["sharpe_ratio", "max_drawdown", "calmar_ratio", "sortino_ratio"]
    ensemble: ["diversity_score", "calibration_score", "consistency_score"]
  
  # Cross-validation
  cross_validation:
    method: "time_series_split"
    n_splits: 5
    test_size: 0.2
  
  # Model comparison
  comparison:
    enable_model_ranking: true
    ranking_metric: "sharpe_ratio"
    enable_feature_importance: true
    enable_trading_metrics: true
    enable_ensemble_metrics: true

# Risk management configuration
risk_management:
  enable_position_sizing: true
  max_position_size: 0.1
  enable_stop_loss: true
  enable_take_profit: true
  enable_portfolio_limits: true
  
  # Risk limits
  limits:
    max_drawdown: 0.05
    max_daily_loss: 0.02
    max_position_concentration: 0.3
  
  # Risk monitoring
  monitoring:
    enable_real_time_monitoring: true
    alert_thresholds:
      drawdown: 0.03
      daily_loss: 0.01
      position_size: 0.08

# Confidence calibration configuration
confidence_calibration:
  enable_calibration: true
  methods: ["platt_scaling", "isotonic_regression"]
  enable_temperature_scaling: true
  enable_histogram_binning: true
  enable_bayesian_calibration: true
  
  # Calibration parameters
  platt_scaling:
    learning_rate: 0.005
    max_iterations: 2000
    convergence_threshold: 1e-6
  
  isotonic_regression:
    out_of_bounds: "clip"
    increasing: true
  
  temperature_scaling:
    temperature_range: [0.1, 10.0]
    optimization_method: "lbfgs"
  
  histogram_binning:
    bin_count: 15
    bin_strategy: "uniform"
  
  bayesian_calibration:
    prior_strength: 1.0
    mcmc_samples: 2000
    burn_in_samples: 200

# Hardware optimization
hardware:
  enable_gpu_acceleration: true
  enable_memory_optimization: true
  enable_parallel_processing: true
  memory_limit_gb: 4.0
  max_workers: null

# Logging configuration
logging:
  level: "INFO"
  enable_detailed_logging: true
  log_predictions: true
  log_performance_metrics: true
  log_feature_importance: true
  log_risk_metrics: true
  log_ensemble_metrics: true
  log_calibration_metrics: true
  
  # Logging intervals
  intervals:
    training_progress: 50  # log every 50 iterations
    prediction_summary: 500  # log every 500 predictions
    performance_update: 2000  # log every 2000 samples
    risk_monitoring: 100  # log every 100 samples
    ensemble_update: 1000  # log every 1000 ensemble predictions
    calibration_update: 500  # log every 500 calibration updates
