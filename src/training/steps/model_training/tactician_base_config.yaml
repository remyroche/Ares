# Tactician Base Training Configuration
# Configuration for base tactician models training (15m timeframe, runs every 3m)
# Role: When Analyst gives green light, decides WHEN to trade based on 0.5% price change timing
# Trained on all regimes at once
# Uses separate GRU and LGBM models (not GRU as embeddings for LGBM)

tactician_config:
  model_name: "tactician_base"
  model_type: "separate_models"  # GRU and LGBM as independent models
  target: "entry_timing"  # Timing for 0.5% price change
  base_timeframe: "15m"  # Base timeframe for cross-timeframe features & optimized lookback
  execution_timeframe: "15m"  # When to run the model
  execution_frequency: "3m"  # Run every 3 minutes
  price_change_target: 0.005  # 0.5% price change target
  
  # Base models configuration - now separate and independent
  base_models:
  - model_name: "StandaloneGRU"
    # Standalone GRU model for independent predictions
    class_name: "src.models.standalone_gru_generator.StandaloneGRUGenerator"
    # Model makes independent predictions (not used as feature generator)
    is_feature_generator: False
    params:
      sequence_length: 12       # GRU sequence length (3 hours at 15m timeframe)
      num_features: 100         # Placeholder: This should match the number of input features for the GRU
      hidden_units: 64
      num_layers: 2
      dropout: 0.2
      learning_rate: 0.001
      # Training parameters for the GRU
      training_params:
        epochs: 40  # Reduced from 50 for faster training
        batch_size: 256  # Increased from 128 for faster training
        verbose: 1
        # Add early stopping for the GRU
        callbacks:
          - class: "tensorflow.keras.callbacks.EarlyStopping"
            params:
              monitor: "val_loss"
              patience: 5
              restore_best_weights: True
    # HPO search ranges (optimal parameters will be saved here after HPO)
    hpo:
      enabled: true
      n_rounds: 2
      enable_final_refinement: true
      final_refinement_trials: 50
      search_space:
        hidden_units:
          type: "categorical"
          choices: [32, 64, 128, 256]
        num_layers:
          type: "int"
          low: 1
          high: 4
        dropout:
          type: "float"
          low: 0.1
          high: 0.5
        learning_rate:
          type: "float"
          low: 0.0001
          high: 0.01
          log: true
        batch_size:
          type: "categorical"
          choices: [64, 128, 256, 512]
        sequence_length:
          type: "int"
          low: 6
          high: 24
      # Optimal parameters found by HPO (will be updated automatically)
      optimal_params: {}

  - model_name: "LGBM"
    # Standalone LGBM model for independent predictions
    class_name: "lightgbm.LGBMRegressor"
    # Model makes independent predictions
    is_feature_generator: False
    params:
      n_estimators: 1000
      learning_rate: 0.05
      num_leaves: 31
      objective: "regression"
      metric: "rmse"
      boosting_type: "gbdt"
      n_jobs: -1
      verbose: -1
      # LGBM-specific training parameters
      training_params:
        callbacks:
          - "lightgbm.early_stopping(100, verbose=False)"
        eval_metric: "rmse"
    # HPO search ranges (optimal parameters will be saved here after HPO)
    hpo:
      enabled: true
      n_rounds: 2
      enable_final_refinement: true
      final_refinement_trials: 50
      search_space:
        max_depth:
          type: "int"
          low: 3
          high: 10
        learning_rate:
          type: "float"
          low: 0.01
          high: 0.2
          log: true
        num_leaves:
          type: "int"
          low: 20
          high: 200
        reg_alpha:
          type: "float"
          low: 0.0
          high: 5.0
        reg_lambda:
          type: "float"
          low: 0.0
          high: 5.0
        subsample:
          type: "float"
          low: 0.6
          high: 1.0
        colsample_bytree:
          type: "float"
          low: 0.6
          high: 1.0
        min_child_samples:
          type: "int"
          low: 10
          high: 100
        min_gain_to_split:
          type: "float"
          low: 0.1
          high: 1.0
      # Optimal parameters found by HPO (will be updated automatically)
      optimal_params: {}

  - model_name: "CatBoost"
    # Standalone CatBoost model for independent predictions
    class_name: "catboost.CatBoostRegressor"
    is_feature_generator: False
    params:
      iterations: 500  # Reduced from 1500 for faster training
      learning_rate: 0.1  # Increased from 0.08 to compensate for fewer iterations
      depth: 6  # Reduced from 8 for faster training
      l2_leaf_reg: 3.0
      subsample: 0.8
      colsample_bylevel: 0.8
      border_count: 128  # Reduced from default 254 for faster training
      max_ctr_complexity: 2  # Limit categorical feature combinations for speed
      random_seed: 42
      verbose: false
      early_stopping_rounds: 50  # Stop if no improvement
      # Performance params (bootstrap_type, thread_count, task_type) are set by hardware manager in code
    # HPO search ranges (optimal parameters will be saved here after HPO)
    hpo:
      enabled: true
      n_rounds: 2
      enable_final_refinement: true
      final_refinement_trials: 50
      search_space:
        iterations:
          type: "int"
          low: 300
          high: 1500
        learning_rate:
          type: "float"
          low: 0.01
          high: 0.3
          log: true
        depth:
          type: "int"
          low: 4
          high: 10
        l2_leaf_reg:
          type: "float"
          low: 1.0
          high: 10.0
        subsample:
          type: "float"
          low: 0.6
          high: 1.0
        colsample_bylevel:
          type: "float"
          low: 0.6
          high: 1.0
        border_count:
          type: "int"
          low: 64
          high: 254
        max_ctr_complexity:
          type: "int"
          low: 1
          high: 4
      # Optimal parameters found by HPO (will be updated automatically)
      optimal_params: {}

  - model_name: "ExtraTrees"
    # Extra Trees Classifier for independent predictions
    class_name: "sklearn.ensemble.ExtraTreesClassifier"
    is_feature_generator: False
    params:
      n_estimators: 500
      max_depth: 10
      min_samples_split: 5
      min_samples_leaf: 2
      max_features: "sqrt"
      bootstrap: true
      n_jobs: -1
      random_state: 42
      verbose: 0
    # HPO search ranges (optimal parameters will be saved here after HPO)
    hpo:
      enabled: true
      n_rounds: 2
      enable_final_refinement: true
      final_refinement_trials: 50
      search_space:
        n_estimators:
          type: "int"
          low: 200
          high: 1000
        max_depth:
          type: "int"
          low: 5
          high: 20
        min_samples_split:
          type: "int"
          low: 2
          high: 20
        min_samples_leaf:
          type: "int"
          low: 1
          high: 10
        max_features:
          type: "categorical"
          choices: ["sqrt", "log2", 0.5, 0.7, 0.9]
      # Optimal parameters found by HPO (will be updated automatically)
      optimal_params: {}

  - model_name: "DepthwiseCNN"
      # model_type is used by HPOOrchestrator
      model_type: "depthwise_cnn" 
      # Class path to the new model
      class_name: "src.models.tcn_regressor.DepthwiseSeparableCNNRegressor"
      is_feature_generator: False
      params:
        filters: 64
        kernel_size: 3
        dropout: 0.2
        epochs: 50
        batch_size: 32
        learning_rate: 0.001
        validation_split: 0.2
        early_stopping_patience: 10
        reduce_lr_patience: 5
        use_batch_norm: false
        verbose: 0
      # HPO search ranges
      hpo:
        enabled: true
        n_rounds: 2
        enable_final_refinement: true
        final_refinement_trials: 50
        # search_space is now defined in hpo_config.py
        # optimal parameters will be saved here
        optimal_params: {}
        
  # Training configuration
  # NOTE: The absolute sample numbers below are now OVERRIDDEN by percentage-based allocations
  # calculated in unified_models_training_step.py. Default percentages are:
  # - Training: 70% of total samples
  # - Validation: 15% of total samples
  # - Test: 15% of total samples
  # You can override these percentages by setting train_percentage, validation_percentage, 
  # and test_percentage in the runtime config
  training:
    training_samples: 8000  # Deprecated - calculated as % of total samples
    validation_samples: 2500  # Deprecated - calculated as % of total samples
    test_samples: 1500  # Deprecated - calculated as % of total samples
    enable_cross_validation: true
    cv_folds: 3  # Reduced from 5 for faster training
    enable_early_stopping: true
    early_stopping_patience: 10
    validation_split: 0.2
    test_split: 0.1
  
  # Performance settings
  performance:
    expected_accuracy: 0.82
    expected_sharpe_ratio: 1.45
    training_time_limit: 200  # seconds
    memory_limit_mb: 2048
  
  # Output settings
  output:
    save_models: true
    save_predictions: true
    generate_reports: true
    output_dir: "./tactician_base_models"

# Feature engineering configuration
feature_engineering:
  # Primary feature source
  primary_features:
    source: "feature_generation_final_feature_selection_step"
    artifact_name: "tactician_features"  # Will be determined by direction, exchange, asset, token
    initial_count: 300  # 300+ features before selection
    target_count: 100   # Down to 100 after selection
  
  # Cross-timeframe features
  cross_timeframe:
    enable: true
    base_timeframe: "15m"
    target_timeframes: ["1m", "5m", "15m", "30m", "1h", "4h", "1d"]
    feature_types: ["technical_indicators", "price_action", "volume_profile", "volatility"]
    optimized_lookback: true
  
  # Regime features (probabilities for each regime)
  regime_features:
    enable: true
    source: "regime_ml_models"
    feature_names: ["regime_prob_0", "regime_prob_1", "regime_prob_2", "regime_prob_3"]
    include_regime_outputs: true
  
  # Analyst ensemble outputs as features
  analyst_ensemble_outputs:
    enable: true
    source: "analyst_ensemble_models"
    features:
      - "analyst_ensemble_predictions"
      - "analyst_ensemble_confidence"
      - "analyst_ensemble_meta_learner_output"
  
  # Feature selection
  feature_selection:
    method: "lasso"
    alpha: 0.005
    max_features: 100
    enable_recursive_elimination: true
    enable_feature_importance: true
  
  # Feature scaling
  scaling:
    method: "robust"
    enable_outlier_handling: true
    outlier_threshold: 2.5

# Data preparation configuration
data_preparation:
  # Time series specific
  time_series:
    enable_temporal_features: true
    lookback_window: 100
    forecast_horizon: 1
  
  # Target generation for strategy optimization
  target_generation:
    method: "momentum_based"
    lookback_periods: [5, 10, 20]
    momentum_threshold: 0.01
    enable_risk_adjustment: true
    risk_free_rate: 0.02

# Model evaluation configuration
evaluation:
  metrics:
    regression: ["mse", "mae", "r2", "mape"]
    classification: ["accuracy", "precision", "recall", "f1"]
    trading: ["sharpe_ratio", "max_drawdown", "calmar_ratio", "sortino_ratio"]
  
  # Cross-validation
  cross_validation:
    method: "time_series_split"
    n_splits: 5
    test_size: 0.2
  
  # Model comparison
  comparison:
    enable_model_ranking: true
    ranking_metric: "sharpe_ratio"
    enable_feature_importance: true
    enable_trading_metrics: true

# Risk management configuration
risk_management:
  enable_position_sizing: true
  max_position_size: 0.1
  enable_stop_loss: true
  enable_take_profit: true
  enable_portfolio_limits: true
  
  # Risk limits
  limits:
    max_drawdown: 0.05
    max_daily_loss: 0.02
    max_position_concentration: 0.3
  
  # Risk monitoring
  monitoring:
    enable_real_time_monitoring: true
    alert_thresholds:
      drawdown: 0.03
      daily_loss: 0.01
      position_size: 0.08

# Hardware optimization
hardware:
  enable_gpu_acceleration: false  # ExtraTrees doesn't use GPU
  enable_memory_optimization: true
  enable_parallel_processing: true
  memory_limit_gb: 2.0
  max_workers: null

# Logging configuration
logging:
  level: "INFO"
  enable_detailed_logging: true
  log_predictions: true
  log_performance_metrics: true
  log_feature_importance: true
  log_risk_metrics: true
  
  # Logging intervals
  intervals:
    training_progress: 100  # log every 100 iterations
    prediction_summary: 1000  # log every 1000 predictions
    performance_update: 5000  # log every 5000 samples
    risk_monitoring: 100  # log every 100 samples
