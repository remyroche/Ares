tag_thresholds:
  min_timestamp_rows: 5
  quiet_continuation: 0.25
  loud_breakout_impulse: 0.20
  dirty_shock_avoid: 0.15
  clean_execution_context: 0.20
  calm_positive_source: 0.20
  loud_clean_execution: 0.10
  clean_run_entry: 0.10
  compression_capture_candidate: 0.10
  risk_adjusted_capture_candidate: 0.10
  clean_economic_capture_candidate: 0.10
  misleading_location_risk: 0.15
  retest_reversal: 0.20
  compression_release: 0.20
  run_entry: 0.20
  late_run_continuation: 0.20
  run_prior_hours: 3.0
  run_prior_rows: 3
  run_prior_low_threshold: 0.55
  run_prior_high_threshold: 0.55

label_thresholds:
  good_top_frac: 0.30
  bad_bottom_frac: 0.40
  neutral_weight: 0.0
  bad_mae_norm_threshold: 1.0
  wide_barrier_abs_threshold: 0.025
  fallback_bad_mae_quantile: 0.75
  fallback_wide_barrier_quantile: 0.75
  calibration_fraction: 0.50
  source_conditioned_min_prior_rows: 200
  source_conditioned_global_min_prior_rows: 1000
  opportunity_mfe_norm_threshold: 1.0
  opportunity_max_mae_norm: 1.0
  clean_path_max_mae_norm: 0.75
  recovery_ratio_threshold: 1.25
  recovery_ratio_cap: 20.0
  opportunity_capture_efficiency_threshold: 0.10
  opportunity_capture_loss_efficiency_threshold: -0.05
  opportunity_capture_efficiency_cap: 3.0
  economic_capture_min_utility: 0.0
  economic_capture_min_efficiency: 0.10
  economic_capture_max_mae_norm: 0.75

timeout_holding_labels:
  timeout_risk_v1:
    type: binary
    target_side_only: true
    positive_condition: reached_timeout_horizon_without_resolution
    outcome_columns:
      - "__is_timeout__"
    intended_use: diagnostic_timeout_risk_head
  holding_risk_v1:
    type: binary
    target_side_only: true
    positive_condition: holding_time_exceeds_trailing_p80_budget
    outcome_columns:
      - "__bars_policy__"
    calibration: prior_months_only
    default_quantile: 0.80
    intended_use: diagnostic_holding_risk_head
  time_to_resolution_bucket_v1:
    type: ordinal
    target_side_only: true
    positive_condition: ordinal_time_to_resolution_bucket
    outcome_columns:
      - "__bars_policy__"
      - "__is_timeout__"
      - "__u_policy_net__"
    calibration: prior_months_only
    fast_quantile: 0.40
    slow_quantile: 0.80
    buckets:
      - fast_positive
      - fast_negative
      - slow_positive
      - slow_negative
      - timeout
    intended_use: diagnostic_time_to_resolution_head

sample_weight_multipliers:
  quiet_continuation: 1.00
  loud_breakout_impulse_clean: 1.00
  dirty_shock_avoid: 0.25
  run_entry: 1.25
  late_run_continuation: 0.75
  ambiguous_none: 0.50

minimum_coverage_stability:
  trainable_min_coverage: 0.05
  preferred_min_coverage: 0.10
  max_monthly_coverage_cv: 1.00
  max_weekly_coverage_cv: 1.50

diagnostics:
  proxy_top_frac: 0.10
  proxy_top_fracs:
    - 0.01
    - 0.05
    - 0.10
  prediction_min_match_rate: 0.80
  capture_top_frac: 0.05
  promotion_scorecard_top_frac: 0.10
  promotion_walkforward_min_history_months: 2
  promotion_stable_month_rate: 0.75
  promotion_mixed_month_rate: 0.50
  promotion_high_confidence_utility_positive_month_rate: 0.50
  source_score_top_fracs:
    - 0.005
    - 0.01
    - 0.03
    - 0.05
    - 0.10
