# Regime Detection Feature Configuration
# This configuration defines features appropriate for market regime identification
# vs trading signal generation

regime_detection_features:
  # Core volatility regime features
  volatility_features:
    - realized_volatility
    - parkinson_volatility
    - garman_klass_volatility
    - vol_persistence
    - vol_regime_strength
    - vol_clustering
    - vol_consistency
    - vol_of_vol
    - vol_uncertainty
    - vol_stability
    - vol_regime_change
    - vol_transition_prob
    - regime_persistence

  # Trend and structural regime features
  structural_features:
    - structural_persistence
    - trend_direction_consistency
    - trend_regime_persistence
    - structural_trend_strength
    - trend_acceleration
    - trend_intensity
    - market_structure_strength
    - support_resistance_strength
    - market_structure_consistency
    - trend_regime_change
    - trend_transition_prob
    - structural_trend_momentum
    - trend_stability
    - trend_persistence_score
    - trend_entropy

  # Volume regime features
  volume_regime_features:
    - vol_mean
    - vol_std
    - vol_regime_strength
    - vol_consistency
    - vol_clustering
    - vol_patterns
    - vol_intensity
    - vol_price_corr
    - vol_weighted_price
    - vol_price_impact
    - vol_regime_change
    - vol_transition_prob
    - vol_momentum
    - vol_stability
    - vol_persistence_score
    - vol_entropy

  # Basic technical indicators for regime identification
  basic_technical_features:
    - ADX  # Trend strength
    - ATR  # Volatility measure
    - SMA_9
    - SMA_21
    - SMA_50
    - EMA_12
    - EMA_26
    - OBV  # Volume regime
    - VWAP  # Volume-weighted average price

  # Statistical regime features
  statistical_features:
    - autocorrelation_5
    - autocorrelation_20
    - cross_timeframe_correlation
    - returns_skewness
    - returns_kurtosis
    - skewness_persistence
    - kurtosis_persistence
    - distribution_normality
    - statistical_persistence
    - distribution_stability
    - statistical_strength

  # Cross-timeframe correlation features (basic regime relationships)
  cross_timeframe_regime_features:
    - corr_1m_5m_5
    - corr_1m_5m_20
    - corr_1m_15m_5
    - corr_1m_15m_20
    - corr_5m_15m_5
    - corr_5m_15m_20
    - momentum_correlation_1m_5m_5
    - momentum_correlation_1m_5m_10
    - momentum_correlation_1m_15m_5
    - momentum_correlation_1m_15m_10
    - momentum_correlation_5m_15m_5
    - momentum_correlation_5m_15m_10

# Features that should NOT be used for regime detection
excluded_trading_features:
  # Order flow and microstructure features
  order_flow_features:
    - taker_buy_ratio
    - taker_sell_ratio
    - market_aggression_index
    - order_flow_imbalance
    - buy_sell_pressure_ratio
    - kyle_lambda
    - amihud_illiquidity
    - liquidity_regime
    - nearest_bid_wall_dist_pct
    - orderbook_pressure
    - spread_liquidity
    - price_impact
    - tick_volatility

  # Momentum and divergence features
  momentum_features:
    - RSI_MACD_Divergence
    - Volume_Price_Divergence
    - momentum_divergence
    - RSI_14
    - MACD_12_26_9
    - STOCHk_14_3_3
    - STOCHd_14_3_3

  # Support/resistance features
  support_resistance_features:
    - distance_to_sr
    - sr_strength
    - sr_type
    - price_position

  # Time-based features
  time_features:
    - Hour_Sin
    - Hour_Cos
    - DayOfWeek_Sin
    - DayOfWeek_Cos
    - is_monday
    - is_friday

  # Advanced trading indicators
  trading_indicators:
    - SuperTrend_10_2.0
    - Parabolic_SAR
    - Williams_R_14
    - CCI_14
    - MFI_14
    - ROC_10
    - BBP_20_2.0

  # Feature engineering artifacts
  engineered_features:
    - "*_z_score"
    - "*_change"
    - "*_pct_change"
    - "*_bounded"
    - "poly_*"
    - "cross_*"

# Configuration for regime detection
regime_detection_config:
  max_features: 80  # Limit to essential regime features
  feature_selection_method: "regime_relevant"
  exclude_trading_features: true
  focus_on_volatility_regimes: true
  focus_on_trend_regimes: true
  focus_on_volume_regimes: true
  include_cross_timeframe_correlations: true
  exclude_microstructure_features: true
  exclude_order_flow_features: true

# Validation rules
validation_rules:
  - "No trading signal features in regime detection"
  - "No microstructure features in regime detection"
  - "No time-of-day features in regime detection"
  - "Focus on volatility, trend, and volume regime identification"
  - "Limit to 50-80 core regime features maximum"
