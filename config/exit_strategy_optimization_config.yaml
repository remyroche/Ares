# Exit Strategy Optimization Configuration
# This configuration defines how exit strategy parameters are optimized through backtesting

exit_strategy_optimization:
  # Optimization settings
  n_trials: 100                    # Number of optimization trials
  timeout: 600                     # Timeout in seconds
  study_name: "exit_strategy_optimization"
  output_path: "results/exit_strategy_optimization.json"
  
  # Search space configuration
  search_space:
    # Confidence thresholds optimization ranges
    confidence_thresholds:
      very_low:
        type: "float"
        low: 0.1
        high: 0.3
      low:
        type: "float" 
        low: 0.3
        high: 0.5
      medium:
        type: "float"
        low: 0.5
        high: 0.7
      high:
        type: "float"
        low: 0.7
        high: 0.9
    
    # Profit-taking parameters optimization ranges
    profit_taking:
      base_profit_target:
        type: "float"
        low: 0.02    # 2%
        high: 0.08   # 8%
      min_confidence_for_profit:
        type: "float"
        low: 0.5
        high: 0.8
      confidence_profit_multiplier:
        type: "float"
        low: 0.2
        high: 0.8
      scaling_levels:
        tier_1:
          type: "float"
          low: 0.2
          high: 0.4
        tier_2:
          type: "float"
          low: 0.4
          high: 0.6
        tier_3:
          type: "float"
          low: 0.6
          high: 0.8
      profit_buffer:
        type: "float"
        low: 0.0015
        high: 0.004
      trail_activation_thresholds:
        activate_at_0_5_atr:
          type: "float"
          low: 0.45
          high: 0.65
        trail_tighten_at_0_8_atr:
          type: "float"
          low: 0.85
          high: 1.05
        hard_stop_at_1_2_atr:
          type: "float"
          low: 1.2
          high: 1.6
      regime_bands:
        bull_trend:
          type: "float"
          low: 1.0
          high: 1.2
        bear_trend:
          type: "float"
          low: 0.8
          high: 1.0
        sideways_range:
          type: "float"
          low: 0.9
          high: 1.1
      time_decay_modifiers:
        enabled:
          type: "categorical"
          choices: [true, false]
        time_decay_schedule:
          type: "categorical"
          choices:
            - [[0, 1.0], [90, 0.9], [180, 0.85]]
            - [[0, 1.0], [120, 0.92], [240, 0.88]]
    
    # Stop-loss parameters optimization ranges
    stop_loss:
      base_stop_loss:
        type: "float"
        low: -0.08   # -8%
        high: -0.02  # -2%
      atr_multiplier:
        type: "float"
        low: 1.0
        high: 3.0
      volatility_adjustment_factor:
        type: "float"
        low: 0.5
        high: 2.0
      profit_buffer:
        type: "float"
        low: 0.0005
        high: 0.0025
      trail_activation_thresholds:
        activate_at_0_5_atr:
          type: "float"
          low: 0.4
          high: 0.6
        trail_tighten_at_0_8_atr:
          type: "float"
          low: 0.7
          high: 0.9
        hard_stop_at_1_2_atr:
          type: "float"
          low: 1.0
          high: 1.4
      regime_bands:
        bull_trend:
          type: "float"
          low: 0.8
          high: 1.0
        bear_trend:
          type: "float"
          low: 1.0
          high: 1.3
        sideways_range:
          type: "float"
          low: 0.9
          high: 1.1
      time_decay_modifiers:
        enabled:
          type: "categorical"
          choices: [true, false]
        time_decay_schedule:
          type: "categorical"
          choices:
            - [[0, 1.0], [45, 0.95], [90, 0.9]]
            - [[0, 1.0], [60, 0.94], [120, 0.88]]
    
    # Time-based parameters optimization ranges
    time_based:
      max_hold_time:
        type: "int"
        low: 3600    # 1 hour
        high: 14400  # 4 hours
      min_hold_time:
        type: "int"
        low: 60      # 1 minute
        high: 1800   # 30 minutes
      confidence_time_scaling_factor:
        type: "float"
        low: 0.5
        high: 2.0
    
    # Trailing stop parameters optimization ranges
    trailing_stop:
      atr_multiplier:
        type: "float"
        low: 1.0
        high: 3.0
      min_distance:
        type: "float"
        low: 0.005   # 0.5%
        high: 0.03   # 3%
      confidence_activation:
        type: "float"
        low: 0.6
        high: 0.9

    # Unified trailing framework parameters
    unified_trailing:
      profit_buffer_atr_multiplier:
        type: "float"
        low: 0.3
        high: 0.9
      profit_buffer_min_fraction:
        type: "float"
        low: 0.0005
        high: 0.002
      trail_base_atr_multiplier:
        type: "float"
        low: 0.6
        high: 1.2
      breakeven_activation_atr:
        type: "float"
        low: 0.8
        high: 1.5
      trail_activation_atr:
        type: "float"
        low: 0.8
        high: 1.5
      tp_trail_activation_atr:
        type: "float"
        low: 1.8
        high: 2.5
      tp_trail_trigger_atr:
        type: "float"
        low: 2.0
        high: 3.5
      partial_take_fraction:
        type: "float"
        low: 0.3
        high: 0.7
      drawdown_tighten_atr:
        type: "float"
        low: 0.6
        high: 1.0
      tighten_trail_atr:
        type: "float"
        low: 0.3
        high: 0.8
      drawdown_exit_atr:
        type: "float"
        low: 1.0
        high: 1.6
      volatility_tighten_threshold:
        type: "float"
        low: 0.6
        high: 0.9
      volatility_tighten_adjustment:
        type: "float"
        low: 0.1
        high: 0.5
      volatility_loosen_threshold:
        type: "float"
        low: 1.1
        high: 1.6
      volatility_loosen_adjustment:
        type: "float"
        low: 0.1
        high: 0.4
      time_decay_bars:
        type: "int"
        low: 6
        high: 12
      time_decay_threshold_atr:
        type: "float"
        low: 0.2
        high: 0.6
      ml_confidence_tighten_threshold:
        type: "float"
        low: 0.2
        high: 0.5
      ml_confidence_tighten_atr:
        type: "float"
        low: 0.2
        high: 0.6
      ml_regime_partial_fraction:
        type: "float"
        low: 0.3
        high: 0.7
      low_vol_sl_atr:
        type: "float"
        low: 1.0
        high: 1.6
      low_vol_tp_atr:
        type: "float"
        low: 1.8
        high: 2.6
      low_vol_trail_atr:
        type: "float"
        low: 0.6
        high: 1.0
      low_vol_tp_trail:
        type: "float"
        low: 2.0
        high: 2.6
      normal_vol_sl_atr:
        type: "float"
        low: 1.3
        high: 1.9
      normal_vol_tp_atr:
        type: "float"
        low: 2.2
        high: 3.0
      normal_vol_trail_atr:
        type: "float"
        low: 0.8
        high: 1.2
      normal_vol_tp_trail:
        type: "float"
        low: 2.2
        high: 3.0
      high_vol_sl_atr:
        type: "float"
        low: 1.5
        high: 2.2
      high_vol_tp_atr:
        type: "float"
        low: 2.6
        high: 3.6
      high_vol_trail_atr:
        type: "float"
        low: 1.0
        high: 1.5
      high_vol_tp_trail:
        type: "float"
        low: 2.6
        high: 3.6

    # Regime-aware parameters optimization ranges
    regime_aware:
      transition_penalty:
        type: "float"
        low: 0.05
        high: 0.2
      regime_specific_scaling:
        type: "float"
        low: 0.8
        high: 1.2

  # Optimization objectives and weights
  objectives:
    primary:
      - "sharpe_ratio"      # Risk-adjusted returns (weight: 0.4)
      - "profit_factor"     # Profit efficiency (weight: 0.3)
      - "max_drawdown"       # Drawdown control (weight: 0.2)
      - "win_rate"          # Win rate (weight: 0.1)
    
    secondary:
      - "total_return"       # Absolute returns
      - "num_trades"         # Trade frequency
      - "avg_trade_duration" # Trade duration
      - "consecutive_wins"   # Win streaks
      - "consecutive_losses" # Loss streaks

  # Backtesting configuration
  backtesting:
    # Data requirements
    min_data_points: 1000
    required_columns: ["timestamp", "open", "high", "low", "close", "volume"]
    
    # Walk-forward validation
    walk_forward:
      enabled: true
      n_splits: 5
      test_size: 0.2
      min_train_size: 0.6
    
    # Monte Carlo simulation
    monte_carlo:
      enabled: true
      n_simulations: 1000
      confidence_level: 0.95
    
    # Statistical testing
    statistical_tests:
      enabled: true
      significance_level: 0.05
      tests: ["sharpe_ratio", "profit_factor", "win_rate"]

  # Regime-specific optimization
  regime_optimization:
    enabled: true
    regimes: ["trending", "ranging", "volatile"]
    regime_specific_params: true
    transition_analysis: true

  # Performance constraints
  constraints:
    min_sharpe_ratio: 1.0
    min_profit_factor: 1.2
    max_drawdown: 0.25
    min_win_rate: 0.45
    max_consecutive_losses: 5

  # Output configuration
  output:
    save_detailed_results: true
    save_parameter_history: true
    save_backtest_charts: true
    save_regime_analysis: true
    
    # File paths
    results_dir: "results/exit_strategy_optimization"
    charts_dir: "results/exit_strategy_optimization/charts"
    reports_dir: "results/exit_strategy_optimization/reports"

# Integration with existing systems
integration:
  # Position monitor integration
  position_monitor:
    auto_update: true
    update_frequency: "daily"
    validation_required: true
  
  # Model calibration integration
  model_calibration:
    use_calibration_results: true
    confidence_weighting: true
    regime_aware: true
  
  # Risk management integration
  risk_management:
    portfolio_level: true
    correlation_aware: true
    drawdown_limits: true

# Example usage scenarios:
#
# Scenario 1: Conservative Optimization
# - Focus on risk management (higher Sharpe, lower drawdown)
# - Tighter stop losses, lower profit targets
# - Longer hold times, higher confidence thresholds
#
# Scenario 2: Aggressive Optimization  
# - Focus on returns (higher profit factor, more trades)
# - Wider stop losses, higher profit targets
# - Shorter hold times, lower confidence thresholds
#
# Scenario 3: Balanced Optimization
# - Equal weight on risk and return metrics
# - Moderate parameter ranges
# - Regime-aware adjustments
#
# Scenario 4: Regime-Specific Optimization
# - Different parameters for different market regimes
# - Regime transition penalties
# - Adaptive parameter scaling
