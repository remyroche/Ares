name: Basic_ML_Pipeline
version: 1.0.0
description: Basic machine learning pipeline for data processing and model training
environment: development

global_settings:
  data_source:
    type: file
    format: parquet
    base_path: data/
  model:
    type: multi_output_stacking_ensemble
    ensemble_type: stacking
    models:
      # Basic multi-output model
      basic:
        type: multi_output_stacking
        base_models:
          - type: lightgbm
            weight: 0.4
            hyperparameters:
              n_estimators: 1000
              learning_rate: 0.1
              max_depth: 6
              subsample: 0.8
              colsample_bytree: 0.8
          - type: catboost
            weight: 0.3
            hyperparameters:
              n_estimators: 1000
              learning_rate: 0.1
              max_depth: 6
              subsample: 0.8
              colsample_bytree: 0.8
          - type: random_forest
            weight: 0.3
            hyperparameters:
              n_estimators: 500
              max_depth: 8
              min_samples_split: 5
              min_samples_leaf: 2
        meta_learner:
          type: ridge
          hyperparameters:
            alpha: 1.0
            fit_intercept: true
        outputs:
          - prediction
          - confidence
          - risk_score
        enable_confidence_calibration: true
  logging:
    level: INFO
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  performance:
    max_memory_mb: 8192
    timeout_seconds: 3600
  security:
    encrypt_artifacts: false
  monitoring:
    enable_metrics: true
    metrics_interval: 60

steps:
  - name: data_loading
    class_name: DataLoadingStep
    enabled: true
    timeout_seconds: 300
    retry_count: 2
    retry_delay_seconds: 5
    fail_fast: true
    priority: 4
    parameters:
      source: data/raw/training_data.parquet
      required_columns:
        - open
        - high
        - low
        - close
        - volume
      save_snapshot: true
    dependencies: []
    validation_rules:
      - type: data_quality
        min_rows: 1000
        max_null_percentage: 5.0
    resource_limits:
      max_memory_mb: 1024
    metadata:
      description: "Load and validate raw market data"
      tags: ["data", "loading", "validation"]

  - name: feature_engineering
    class_name: FeatureEngineeringStep
    enabled: true
    timeout_seconds: 600
    retry_count: 1
    retry_delay_seconds: 10
    fail_fast: true
    priority: 3
    parameters:
      feature_types:
        - technical
        - statistical
        - price_action
      technical_indicators:
        - sma
        - ema
        - rsi
        - macd
        - bollinger_bands
      statistical_features:
        - returns
        - volatility
        - skewness
        - kurtosis
    dependencies: [data_loading]
    validation_rules:
      - type: feature_quality
        min_features: 10
        max_correlation: 0.95
    resource_limits:
      max_memory_mb: 2048
    metadata:
      description: "Engineer technical and statistical features"
      tags: ["features", "engineering", "technical_indicators"]

  - name: model_training
    class_name: StackingModelTrainer
    enabled: true
    timeout_seconds: 1800
    retry_count: 1
    retry_delay_seconds: 30
    fail_fast: true
    priority: 2
    parameters:
      model_type: multi_output_stacking
      base_models:
        - type: lightgbm
          hyperparameters:
            n_estimators: 1000
            learning_rate: 0.1
            max_depth: 6
            subsample: 0.8
            colsample_bytree: 0.8
        - type: catboost
          hyperparameters:
            n_estimators: 1000
            learning_rate: 0.1
            max_depth: 6
            subsample: 0.8
            colsample_bytree: 0.8
        - type: random_forest
          hyperparameters:
            n_estimators: 500
            max_depth: 8
            min_samples_split: 5
            min_samples_leaf: 2
      meta_learner:
        type: ridge
        hyperparameters:
          alpha: 1.0
          fit_intercept: true
      outputs:
        - prediction
        - confidence
        - risk_score
      validation_split: 0.2
      early_stopping_rounds: 50
      save_model: true
      confidence_calibration:
        enabled: true
        method: platt_scaling
        calibration_split: 0.2
    dependencies: [feature_engineering]
    validation_rules:
      - type: model_quality
        min_accuracy: 0.6
        max_overfitting: 0.1
        min_multi_output_accuracy: 0.5
    resource_limits:
      max_memory_mb: 4096
    metadata:
      description: "Train multi-output stacking ensemble model"
      tags: ["training", "stacking", "multi_output", "ensemble"]

  - name: model_validation
    class_name: ModelValidationStep
    enabled: true
    timeout_seconds: 600
    retry_count: 1
    retry_delay_seconds: 15
    fail_fast: false
    priority: 1
    parameters:
      validation_method: time_series_split
      n_splits: 5
      test_size: 0.2
      metrics:
        - accuracy
        - precision
        - recall
        - f1_score
        - roc_auc
        - mse
        - mae
        - r2
      multi_output_validation:
        enabled: true
        per_output_metrics: true
        overall_metrics: true
        confidence_metrics: true
        calibration_metrics: true
    dependencies: [model_training]
    validation_rules:
      - type: validation_quality
        min_samples: 100
        min_multi_output_accuracy: 0.5
    resource_limits:
      max_memory_mb: 1024
    metadata:
      description: "Validate multi-output model performance using time series cross-validation"
      tags: ["validation", "cross_validation", "metrics", "multi_output"]

metadata:
  author: "ML Pipeline Team"
  created_at: "2024-01-01T00:00:00Z"
  tags: ["basic", "ml", "trading", "stacking", "multi_output", "ensemble"]
  documentation: "https://docs.example.com/pipelines/basic_ml"