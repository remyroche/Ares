# Tactician Base Models Configuration
# This config defines which ML models to train for confidence-based position decisions

model_type: "tactician_base"
timeframe: "15m"
description: "Tactician base models for calibrated confidence scores on position entry/stay decisions"

# Tactician Base Models Configuration
# Base models: LGBM + small GRU, CatBoost, Causal Dilated TCN
models:
  - name: "lgbm_gru_embeddings"
    type: "LIGHTGBM_GRU"
    enabled: true
    description: "LightGBM with small GRU for embeddings"
    parameters:
      # LightGBM parameters
      objective: "binary"
      metric: "binary_logloss"
      boosting_type: "gbdt"
      num_leaves: 31
      learning_rate: 0.08  # Higher learning rate for faster convergence
      feature_fraction: 0.8  # Reduced to prevent overfitting
      bagging_fraction: 0.8
      bagging_freq: 5
      verbose: -1
      random_state: 42
      n_estimators: 300  # Further reduced for efficiency
      early_stopping_rounds: 30  # More aggressive early stopping
      min_data_in_leaf: 20
      min_gain_to_split: 0.0
      lambda_l1: 0.1  # Added L1 regularization
      lambda_l2: 0.1  # Added L2 regularization
      
      # GRU parameters for embeddings
      gru_hidden_size: 32
      gru_num_layers: 2
      gru_dropout: 0.2  # Increased dropout for better generalization
      gru_bidirectional: false
      embedding_dim: 16
      sequence_length: 20
      gru_learning_rate: 0.002  # Higher learning rate
      gru_epochs: 30  # Reduced epochs with early stopping
      gru_batch_size: 64

  - name: "catboost_tactician"
    type: "CATBOOST"
    enabled: true
    description: "CatBoost for tactician confidence predictions"
    parameters:
      objective: "Logloss"
      eval_metric: "Logloss"
      iterations: 300  # Further reduced for efficiency
      learning_rate: 0.1  # Higher learning rate for faster convergence
      depth: 6
      l2_leaf_reg: 5  # Increased regularization
      random_seed: 42
      early_stopping_rounds: 30  # More aggressive early stopping
      verbose: false
      min_data_in_leaf: 25  # Higher minimum for stability
      bootstrap_type: "Bayesian"
      bagging_temperature: 0.8  # Reduced for more conservative sampling
      subsample: 0.8
      # Confidence-specific parameters
      loss_function: "Logloss"
      custom_metric: ["AUC", "Precision", "Recall"]
      boosting_type: "Plain"

  - name: "causal_dilated_tcn"
    type: "CAUSAL_DILATED_TCN"
    enabled: true
    description: "Causal Dilated Temporal Convolutional Network for confidence scoring"
    parameters:
      # TCN architecture
      input_channels: 1
      output_channels: 64
      num_layers: 4
      kernel_size: 3
      dilation_base: 2
      dropout: 0.1
      
      # Causal convolution parameters
      causal_padding: true
      zero_init_residual: true
      
      # Training parameters
      learning_rate: 0.002  # Higher learning rate
      batch_size: 64
      epochs: 40  # Further reduced for efficiency
      early_stopping_patience: 10  # More aggressive early stopping
      weight_decay: 1e-3  # Increased weight decay
      
      # Sequence parameters
      sequence_length: 50
      prediction_horizon: 1
      
      # Optimization
      optimizer: "adam"
      scheduler: "cosine"
      warmup_epochs: 10
      
      # Regularization
      gradient_clip_norm: 1.0
      label_smoothing: 0.0
      learning_rate_init: 0.001
      max_iter: 1000
      early_stopping: true
      validation_fraction: 0.1
      n_iter_no_change: 10
      random_state: 42

  - name: "linear"
    type: "LINEAR"
    enabled: true
    parameters:
      fit_intercept: true
      # normalize: false  # Removed - deprecated in sklearn
      # copy_X: true  # Removed - deprecated in sklearn
      n_jobs: -1
      random_state: 42

# Target Configuration - Enhanced with proper target validation
targets:
  primary: "position_confidence"  # Calibrated confidence score for position entry/stay (0-1)
  secondary: "position_target"  # Original binary classification target (0/1)
  target_type: "binary_classification"
  confidence_calibration: true
  calibration_method: "isotonic"  # or "platt", "sigmoid"
  
  # Target validation
  target_validation:
    check_binary_target: true
    check_confidence_bounds: true
    confidence_bounds: [0.0, 1.0]
    binary_target_values: [0, 1]
    check_temporal_consistency: true
    check_lookahead_bias: true  # Critical for financial models
  
  # Adaptive confidence configuration
  adaptive_confidence:
    enabled: true
    base_threshold: 0.7
    volatility_adjustment: true
    volatility_window: 20
    min_threshold: 0.5
    max_threshold: 0.9
    volatility_threshold: 0.02
    adjustment_factor: 0.1
    regime_aware: true  # Adjust based on market regime
    regime_weights:
      low_volatility: 0.8
      medium_volatility: 0.7
      high_volatility: 0.6

# Input Configuration
inputs:
  # Pre-selected features from upstream feature generation
  # These are specific to tactician model type and direction (shorts/longs)
  pre_selected_features:
    description: "Features pre-selected by feature_generation_final_feature_selection_step"
    source: "upstream_feature_generation"
    
  # Regime features from regime_ensemble_training
  regime_features:
    description: "Regime features generated by regime ML model"
    source: "regime_ensemble_training"
    enabled: true
    
  # Volatility modeling features
  volatility_features:
    description: "Volatility and risk features for ETHUSDT"
    enabled: true
    features:
      - "realized_volatility_1h"
      - "realized_volatility_4h"
      - "realized_volatility_1d"
      - "garch_volatility"
      - "ewma_volatility"
      - "volatility_regime"
      - "volatility_percentile"
      - "volatility_momentum"
      
    
  # Analyst ensemble model outputs
  analyst_ensemble_outputs:
    description: "Outputs from Analyst ensemble model"
    source: "analyst_ensemble_training"
    enabled: true
  
  # Regime model outputs (from previous pipeline steps)
  regime_outputs:
    - "regime_classification"
    - "regime_probabilities"
    - "regime_transition_matrix"
    - "regime_volatility_estimates"
    - "regime_correlation_structure"
  
  # Analyst model outputs (from analyst base and ensemble models)
  analyst_outputs:
    - "analyst_base_predictions"
    - "analyst_base_confidence"
    - "analyst_ensemble_predictions"
    - "analyst_ensemble_confidence"
    - "analyst_feature_importance"
    - "analyst_shap_values"
    
  # Risk management features
  risk_management:
    description: "Risk management and position sizing features"
    enabled: true
    features:
      - "value_at_risk_95"
      - "expected_shortfall"
      - "maximum_drawdown"
      - "sharpe_ratio_rolling"
      - "calmar_ratio_rolling"
      - "sortino_ratio_rolling"
      - "portfolio_heat"
      - "correlation_risk"
      - "concentration_risk"
      - "liquidity_risk"
      
  # Position sizing features
  position_sizing:
    description: "Position sizing and sizing features"
    enabled: true
    features:
      - "volatility_adjusted_sizing"
      - "kelly_criterion_sizing"
      - "risk_parity_sizing"
      - "momentum_sizing"
      - "regime_conditional_sizing"
      - "drawdown_adjusted_sizing"

# Training Configuration
training:
  validation_split: 0.15
  cv_folds: 5
  test_split: 0.05
  random_state: 42
  stratify: true  # Binary classification uses stratification
  
  # Cross-validation strategy - Enhanced for financial data
  cv_strategy: "PurgedTimeSeriesSplit"  # Prevents lookahead bias
  cv_params:
    n_splits: 5
    test_size: 0.2
    purge_length: 5  # Purge 5 periods to prevent leakage
    embargo_length: 2  # Embargo 2 periods after test set
  
  # Caching configuration - Uses unified configuration
  caching:
    config_source: "unified_memory_config.yaml"
    model_type: "tactician_base"
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 50
    min_delta: 0.001
    monitor: "val_loss"
    mode: "min"
  
  # Hyperparameter optimization - Enhanced with financial metrics
  hyperparameter_optimization:
    enabled: true
    method: "optuna"
    n_trials: 100
    timeout: 3600  # 1 hour
    direction: "maximize"
    metric: "f1_score"
    
    # Financial-specific optimization
    financial_metrics:
      enabled: true
      primary_metric: "sharpe_ratio"  # Risk-adjusted returns
      secondary_metrics: ["calmar_ratio", "sortino_ratio", "max_drawdown"]
      cost_aware: true
      transaction_cost: 0.001  # 0.1% transaction cost
      risk_penalty: 0.1  # Penalty for high volatility
      
    # Multi-objective optimization
    multi_objective:
      enabled: true
      objectives: ["f1_score", "sharpe_ratio", "calmar_ratio"]
      weights: [0.4, 0.4, 0.2]  # Balance classification and financial performance
  
  # Confidence calibration
  confidence_calibration:
    enabled: true
    method: "isotonic"  # or "platt", "sigmoid"
    cv_folds: 3
    test_size: 0.2

# Feature Engineering
# Feature engineering is handled upstream by feature_generation_final_feature_selection_step
# Features are pre-selected and specific to model type and direction

# Data Quality & Leakage Prevention
data_quality:
  # Leakage detection - Enhanced for financial models
  leakage_detection:
    enabled: true
    methods: ["temporal_consistency", "feature_correlation", "target_correlation", "future_data_detection", "volatility_leakage", "confidence_leakage"]
    max_correlation_threshold: 0.95
    temporal_window: 5
    future_data_threshold: 0.01  # Max correlation with future data
    volatility_lookback: 20  # Volatility calculation lookback window
    confidence_purge_length: 3  # Additional purge for confidence models
  
  # Data validation - Enhanced for financial data
  validation:
    check_missing_values: true
    check_infinite_values: true
    check_duplicate_timestamps: true
    check_data_types: true
    max_missing_percentage: 0.05
    check_temporal_order: true  # Ensure data is chronologically ordered
    check_lookahead_bias: true  # Detect potential future data leakage
    check_stationarity: true  # Check for non-stationary features
    stationarity_threshold: 0.05
  
  # Outlier detection
  outlier_detection:
    enabled: true
    method: "isolation_forest"
    contamination: 0.1
    random_state: 42
  
  # Confidence-specific validation
  confidence_validation:
    check_confidence_bounds: true
    confidence_bounds: [0.0, 1.0]
    check_temporal_consistency: true
    check_calibration_quality: true

# Metrics & Evaluation
metrics:
  primary: "f1_score"
  secondary: ["precision", "recall", "accuracy", "auc_roc"]
  confidence_metrics: ["brier_score", "log_loss", "calibration_error"]
  
  # Financial-specific metrics
  financial_metrics:
    enabled: true
    trading_metrics: ["sharpe_ratio", "calmar_ratio", "sortino_ratio", "max_drawdown", "profit_factor"]
    risk_metrics: ["var_95", "expected_shortfall", "volatility", "beta"]
    cost_metrics: ["transaction_costs", "slippage", "market_impact"]
    
  # Cost-sensitive evaluation
  cost_sensitive:
    enabled: true
    transaction_cost: 0.001  # 0.1% per trade
    slippage_cost: 0.0005  # 0.05% slippage
    holding_cost: 0.0001  # 0.01% per period holding cost
    risk_free_rate: 0.02  # 2% annual risk-free rate
  
  # SHAP analysis
  shap_analysis:
    enabled: true
    sample_size: 1000
    background_samples: 100
    explainer_type: "tree"
  
  # Feature importance
  feature_importance:
    enabled: true
    methods: ["permutation", "shap", "builtin"]
    top_n_features: 20
  
  # Confidence-specific metrics
  confidence_metrics:
    # Calibration metrics
    calibration_metrics:
      enabled: true
      metrics: ["brier_score", "log_loss", "calibration_error", "reliability_diagram"]
    
    # Confidence quality
    confidence_quality:
      enabled: true
      metrics: ["confidence_accuracy", "confidence_precision", "confidence_recall"]

# Memory Optimization - Uses unified configuration from utils/hardware/
memory_optimization:
  # Import unified configuration
  config_source: "unified_memory_config.yaml"
  model_type: "tactician_base"
  
  # Hardware integration
  use_integrated_hardware_manager: true
  use_enhanced_caching_system: true
  use_memory_optimized_decorators: true
  use_dynamic_memory_allocator: true

# Performance Monitoring
monitoring:
  # Training monitoring
  training:
    log_metrics_every: 10  # epochs
    save_checkpoints: true
    checkpoint_frequency: 50  # epochs
    checkpoint_dir: "checkpoints/tactician_base"
  
  # Model performance
  performance:
    track_training_time: true
    track_memory_usage: true
    track_gpu_usage: true
    log_predictions: true
    prediction_sample_size: 1000
  
  # Confidence monitoring
  confidence_monitoring:
    track_confidence_distribution: true
    track_calibration_quality: true
    track_confidence_accuracy: true
    track_confidence_precision: true
    track_confidence_recall: true

# Output Configuration
output:
  # Model artifacts
  models:
    save_format: "joblib"
    save_path: "models/tactician_base"
    include_metadata: true
    include_feature_names: true
    include_training_history: true
    include_target_names: true
  
  # Results
  results:
    save_predictions: true
    save_probabilities: true
    save_confidence_scores: true
    save_feature_importance: true
    save_shap_values: true
    save_calibration_plots: true
    results_path: "results/tactician_base"
  
  # Reports
  reports:
    generate_report: true
    report_format: "html"
    include_plots: true
    include_tables: true
    include_confidence_analysis: true
    include_calibration_analysis: true
    report_path: "reports/tactician_base"