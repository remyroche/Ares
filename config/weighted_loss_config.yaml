# Weighted Loss Configuration for Negative Learning Approximation
# This configuration enables weighted losses to approximate negative learning
# by emphasizing difficult samples and failure contexts.

# Core settings
enable_weighted_loss: true
weighting_strategy: "adaptive"  # Options: difficulty_based, failure_context, adaptive, focal_loss, gradient_based

# Model-specific settings
enable_for_lightgbm: true
enable_for_catboost: true
enable_for_xgboost: true
enable_for_sklearn: true
enable_for_neural_networks: true

# Failure context detection parameters
failure_contexts:
  volatility_threshold: 0.02
  chop_threshold: 0.5
  spread_threshold: 0.01
  liquidity_threshold: 1000.0
  
  # Context-specific weights
  high_volatility_weight: 2.0
  chop_weight: 1.5
  wide_spread_weight: 1.8
  low_liquidity_weight: 2.2
  outlier_weight: 2.5
  uncertainty_weight: 1.3

# Weighting parameters
weighting:
  base_weight: 1.0
  max_weight: 5.0
  min_weight: 0.1
  weight_smoothing: 0.1
  
  # Adaptive parameters
  adaptation_rate: 0.01
  memory_decay: 0.95
  stability_threshold: 0.1
  
  # Focal loss parameters (when using focal_loss strategy)
  focal_alpha: 0.25
  focal_gamma: 2.0

# Performance monitoring
monitoring:
  enable_monitoring: true
  log_frequency: 100
  save_weight_statistics: true
  
  # Alert thresholds
  weight_variance_threshold: 2.0
  weight_trend_threshold: 0.5
  performance_degradation_threshold: 0.05

# Integration settings
integration:
  # When to apply weighted loss
  apply_during_training: true
  apply_during_validation: true
  apply_during_testing: false
  
  # Market data requirements
  require_market_data: false
  market_data_sources:
    - "returns"
    - "high"
    - "low"
    - "bid"
    - "ask"
    - "volume"
  
  # Feature requirements
  require_price_features: true
  price_feature_columns: 10  # Number of price-related feature columns

# Model-specific configurations
model_configs:
  lightgbm:
    enable_weighted_loss: true
    use_sample_weight: true
    weight_normalization: true
    
  catboost:
    enable_weighted_loss: true
    use_sample_weight: true
    weight_normalization: true
    
  xgboost:
    enable_weighted_loss: true
    use_sample_weight: true
    weight_normalization: true
    
  sklearn:
    enable_weighted_loss: true
    use_sample_weight: true
    weight_normalization: true
    
  neural_networks:
    enable_weighted_loss: true
    use_sample_weight: true
    weight_normalization: true
    loss_weighting: true

# Advanced settings
advanced:
  # Weight calculation
  weight_calculation_method: "combined"  # Options: difficulty_only, context_only, combined
  
  # Difficulty assessment
  difficulty_methods:
    - "feature_variance"
    - "prediction_error"
    - "target_complexity"
    - "feature_correlation"
  
  # Context detection
  context_detection_methods:
    - "volatility_analysis"
    - "chop_detection"
    - "spread_analysis"
    - "outlier_detection"
    - "uncertainty_estimation"
  
  # Weight smoothing
  smoothing_method: "moving_average"  # Options: moving_average, exponential, gaussian
  smoothing_window: 5
  
  # Adaptive learning
  adaptive_learning: true
  learning_rate: 0.01
  momentum: 0.9
  decay_rate: 0.95

# Debugging and logging
debug:
  enable_debug_logging: false
  log_weight_distributions: false
  log_failure_contexts: false
  log_difficulty_scores: false
  
  # Save intermediate results
  save_weights: false
  save_contexts: false
  save_difficulty_scores: false