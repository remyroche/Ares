# Regime Meta-Model Training Configuration
# Enhanced configurations for regime-specific meta-model training

# LightGBM Meta (multiclass) Configuration - Very shallow
lightgbm_meta:
  objective: multiclass
  num_class: null  # set to number of regimes (K)
  num_leaves: [15, 23, 31]
  max_depth: [3, 4, 5]
  learning_rate: [0.03, 0.04, 0.05]
  min_data_in_leaf: [50, 100, 150]
  feature_fraction: [0.6, 0.75, 0.9]
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l1: [0, 1e-2, 1e-1]
  lambda_l2: [0, 1e-2, 1e-1]
  n_estimators: [200, 400, 600]
  boosting: gbdt
  metric: multi_logloss
  # Stable sweet spot: num_leaves=23, max_depth=4, lr=0.04, min_data_in_leaf=100, n_estimators≈400
  stable_sweet_spot:
    num_leaves: 23
    max_depth: 4
    learning_rate: 0.04
    min_data_in_leaf: 100
    n_estimators: 400

# Meta-features Configuration for Meta-Model
meta_features:
  # Disagreement & uncertainty features
  disagreement_uncertainty:
    margin: true  # margin=max_k p̄_k - max_{j≠k*} p̄_j where p̄ is mean over base models
    entropy: true  # H(p̄) = -∑_k p̄_k log p̄_k (higher ⇒ more uncertain)
    gini_impurity: true  # 1 - ∑_k p̄_k² (equivalent signal to entropy, cheaper)
    pairwise_variance: true  # Var_m(p_{k*}^{(m)}) for the top class k*
    disagreement_rate: true  # fraction of base models not equal to ensemble argmax
    js_divergence_spread: true  # mean pairwise Jensen-Shannon divergence between p^{(m)} distributions
  
  # Temporal dynamics (use short windows: 3–8 bars)
  temporal_dynamics:
    probability_slope: true  # Δp̄_{k*} = p̄_{k*}(t) - p̄_{k*}(t-1)
    momentum_confidence: true  # EWMA of margin (half-life 3–8 bars)
    flip_pressure: true  # rolling count of argmax changes over last W bars
    duration_prior: true  # time since last regime change (or EWMA of persistence)
  
  # Calibration & reliability
  calibration_reliability:
    brier_components: true  # per-class (p̄_k - 𝟙[y=k])² on shadow validation stream
    temperature_proxy: true  # optimize single temperature on rolling window
  
  # Diversity & specialist detection
  diversity_specialist:
    specialist_gating_cues: true  # include each model's own top-class prob and calibration error
    cohens_kappa: true  # Cohen's κ / Q-statistic between hard predictions on rolling window
    diversity_metrics: true  # higher diversity tends to help stacking

# Meta-Model Training Configuration
meta_training:
  # Model selection
  enable_lightgbm_meta: true
  
  # Hyperparameter optimization
  enable_hpo: true
  hpo_trials: 100
  hpo_timeout: 3600
  
  # Cross-validation
  cv_folds: 5
  validation_split: 0.2
  
  # Early stopping
  enable_early_stopping: true
  early_stopping_patience: 10
  
  # Meta-features
  enable_meta_features: true
  meta_feature_selection: true
  max_meta_features: 10  # Use 2-5 of the most important meta-features
  
  # Ensemble configuration
  enable_ensemble_meta: true
  ensemble_method: "stacking"  # stacking, voting, blending
  meta_learner: "lightgbm"
  
  # Regime-specific training
  enable_regime_specific_meta: true
  min_regime_samples: 100
  regime_validation_split: 0.2

# Performance Configuration
performance:
  # Memory management
  max_memory_usage: 0.8
  enable_memory_optimization: true
  
  # Parallel processing
  n_jobs: -1
  enable_parallel_processing: true
  
  # Caching
  enable_caching: true
  cache_directory: "cache/regime_metamodel_training"
  
  # Logging
  enable_detailed_logging: true
  log_level: "INFO"

# Advanced Meta-Model Features
advanced_features:
  # Uncertainty quantification
  enable_uncertainty_quantification: true
  uncertainty_methods: ["ensemble_variance", "monte_carlo_dropout", "bayesian_approximation"]
  
  # Regime transition modeling
  enable_regime_transitions: true
  transition_window: 5
  transition_smoothing: true
  
  # Adaptive learning
  enable_adaptive_learning: true
  adaptation_rate: 0.01
  adaptation_window: 100
  
  # Model selection
  enable_dynamic_model_selection: true
  selection_criteria: ["accuracy", "stability", "diversity"]
  
  # Calibration
  enable_calibration: true
  calibration_method: "platt_scaling"  # platt_scaling, isotonic_regression
  calibration_window: 200