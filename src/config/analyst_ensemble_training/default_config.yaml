# Configuration par défaut pour Analyst Ensemble Training
# Configuration centralisée migrée depuis analyst_ensemble_config.yaml
# Version: 1.0.0
# Date: 2025-11-03T22:09:00.000Z

version: "1.0.0"
component_name: "analyst_ensemble_training"
description: "Configuration centralisée pour l'entraînement d'ensemble des modèles analyst"
created_at: "2025-11-03T22:09:00.000Z"
last_updated: "2025-11-03T22:09:00.000Z"

# Configuration principale du modèle analyst
analyst_config:
  model_name: "analyst_ensemble"
  model_type: "meta_ensemble"
  target: "trading_signal"
  base_timeframe: "15m"
  execution_timeframe: "15m"
  execution_frequency: "15m"
  params: {}

# Configuration du meta-learner
meta_learner:
  model_type: "stacker_lgbm_calibrated"
  params:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 63
    subsample: 0.9
    colsample_bytree: 0.9
    random_state: 42
    verbosity: -1
    n_jobs: -1
  calibration:
    method: "isotonic"
    enable_temperature_scaling: true
  hpo:
    enabled: true
    n_rounds: 2
    enable_final_refinement: true
    final_refinement_trials: 50
    search_space:
      max_depth:
        type: "int"
        low: 3
        high: 8
      learning_rate:
        type: "float"
        low: 0.01
        high: 0.2
        log: true
      num_leaves:
        type: "int"
        low: 20
        high: 150
      reg_alpha:
        type: "float"
        low: 0.0
        high: 3.0
      reg_lambda:
        type: "float"
        low: 0.0
        high: 3.0
      subsample:
        type: "float"
        low: 0.7
        high: 1.0
      colsample_bytree:
        type: "float"
        low: 0.7
        high: 1.0
      min_child_samples:
        type: "int"
        low: 10
        high: 50
      min_gain_to_split:
        type: "float"
        low: 0.1
        high: 1.0
    optimal_params: {}

# Configuration des sorties de modèles de base
base_model_outputs:
  lgbm_output: "analyst_base_lgbm_predictions"
  tcn_output: "analyst_base_tcn_predictions"
  catboost_output: "analyst_base_catboost_predictions"
  meta_learner_output: "analyst_base_meta_learner_predictions"

# Configuration hardware et optimisation
hardware:
  enable_gpu_acceleration: true
  enable_memory_optimization: true
  enable_parallel_processing: true
  memory_limit_gb: 4.0
  max_workers: null
  cpu_optimization_level: "aggressive"
  gpu_optimization_level: "balanced"

# Configuration HPO
hpo:
  enabled: true
  max_trials: 50
  timeout_seconds: 300
  enable_early_stopping: true
  enable_pruning: true
  cv_folds: 3

# Configuration de l'entraînement
training:
  enable_cross_validation: true
  cv_folds: 3
  enable_early_stopping: true
  early_stopping_patience: 15
  validation_split: 0.2
  test_split: 0.1
  training_samples: 15000
  validation_samples: 5000
  test_samples: 3000

# Configuration de l'ingénierie des features
feature_engineering:
  primary_features:
    source: "feature_generation_final_feature_selection_step"
    artifact_name: "analyst_features"
    initial_count: 300
    target_count: 100
  cross_timeframe:
    enable: true
    base_timeframe: "5m"
    target_timeframes: ["1m", "5m", "15m", "30m", "1h", "4h", "1d"]
    feature_types: ["technical_indicators", "price_action", "volume_profile", "volatility"]
  regime_features:
    enable: true
    source: "regime_ml_models"
    feature_names: ["regime_prob_0", "regime_prob_1", "regime_prob_2", "regime_prob_3"]
    include_regime_outputs: true
  analyst_base_outputs:
    enable: true
    source: "analyst_base_models"
    features:
      - "lgbm_predictions"
      - "lgbm_patchtst_predictions"
      - "catboost_predictions"
      - "meta_learner_predictions"
      - "base_model_confidence_scores"
  feature_selection:
    method: "lasso"
    alpha: 0.01
    max_features: 100
    enable_recursive_elimination: true
    enable_feature_importance: true
  scaling:
    method: "robust"
    enable_outlier_handling: true
    outlier_threshold: 3.0

# Configuration de préparation des données
data_preparation:
  time_series:
    enable_temporal_features: true
    lookback_window: 100
    forecast_horizon: 1
  target_generation:
    method: "price_momentum"
    lookback_periods: [5, 10, 20]
    threshold: 0.02

# Configuration d'évaluation
evaluation:
  metrics:
    regression: ["mse", "mae", "r2", "mape"]
    classification: ["accuracy", "precision", "recall", "f1"]
  cross_validation:
    method: "time_series_split"
    n_splits: 5
    test_size: 0.2
  comparison:
    enable_model_ranking: true
    ranking_metric: "r2"
    enable_feature_importance: true
    enable_model_explanations: true

# Configuration de performance
performance:
  expected_accuracy: 0.85
  expected_diversity_score: 0.92
  training_time_limit: 600
  memory_limit_mb: 4096

# Configuration de sortie
output:
  save_models: true
  save_predictions: true
  generate_reports: true
  output_dir: "./analyst_ensemble_models"

# Configuration de logging
logging:
  level: "INFO"
  enable_detailed_logging: true
  log_predictions: true
  log_performance_metrics: true
  log_feature_importance: true
  log_ensemble_metrics: true
  intervals:
    training_progress: 50
    prediction_summary: 500
    performance_update: 2000
    ensemble_update: 1000

# Configuration des modèles de base
base_models:
  lgbm:
    enabled: true
    params:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      num_leaves: 63
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      verbosity: -1
      n_jobs: -1
  catboost:
    enabled: true
    params:
      iterations: 100
      depth: 6
      learning_rate: 0.1
      l2_leaf_reg: 3
      random_seed: 42
      verbose: false
  tcn:
    enabled: true
    params:
      epochs: 50
      batch_size: 32
      learning_rate: 0.001
      dropout: 0.2
      hidden_units: 64

# Métadonnées
_comment: "Configuration complète pour l'entraînement d'ensemble des modèles analyst"
