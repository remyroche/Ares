# Step17 Optimization Structure for Tactician Components
# This file shows the expected structure of step17 optimization results
# that will be automatically loaded by all tactician components

step17_optimization:
  # Leverage Sizing Optimization
  leverage:
    min_leverage: 10.0
    max_leverage: 100.0
    confidence_threshold: 0.6
    liquidation_buffer: 0.05
    ml_weight: 0.6
    liquidation_weight: 0.4
    leverage_multiplier: 1.0
    risk_adjustment_factor: 1.0
    confidence_boost_threshold: 0.8
    max_risk_leverage: 50.0

  # Position Sizing Optimization
  position_sizing:
    kelly_multiplier: 0.25
    max_position_size: 0.5
    min_position_size: 0.01
    confidence_threshold: 0.6
    ml_weight: 0.7
    kelly_weight: 0.3
    risk_adjustment_factor: 1.0
    confidence_boost_threshold: 0.8
    volatility_adjustment: 1.0
    market_regime_multiplier: 1.0

  # Take Profit / Stop Loss (TPSL) Optimization - COMMENTED OUT FOR NOW
  # tpsl:
  #   atr_multiplier: 2.0
  #   confidence_threshold: 0.7
  #   min_hold_time: 300
  #   stop_loss_multiplier: 1.5
  #   take_profit_multiplier: 2.0
  #   trailing_stop_enabled: true
  #   trailing_stop_distance: 0.02
  #   max_hold_time: 3600

  # ML Tactics Optimization
  ml_tactics:
    enable_ml_tactics: true
    confidence_threshold: 0.7
    regime_threshold: 0.6
    ml_weight: 0.8
    regime_weight: 0.2
    confidence_boost_factor: 1.2
    risk_adjustment_factor: 1.0

  # Decision Policy Optimization
  decision_policy:
    confidence_threshold: 0.6
    risk_threshold: 0.1

  # Confidence Optimization (for ML confidence factors)
  confidence:
    price_deviation_boost: 1.35
    price_direction_boost: 1.28
    price_target_boost: 1.42

  # Ensemble Optimization (for performance metrics)
  ensemble:
    sharpe_ratio: 2.45
    max_drawdown: -0.08
    win_rate: 0.68
    profit_factor: 1.85
    total_return: 0.42
    barrier_hit_rate: 0.12

  # System Monitoring Optimization
  system_monitoring:
    health_check_interval: 30
    performance_threshold: 0.8
    alert_threshold: 0.6

  # Training Optimization
  training_optimization:
    batch_size: 64
    learning_rate: 0.001
    epochs: 100
    validation_split: 0.2

  # Regime Transitions Optimization
  regime_transitions:
    transition_threshold: 0.7
    stability_period: 300
    confirmation_required: true

  # Technical Indicators Optimization
  technical_indicators:
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bollinger_period: 20
    bollinger_std: 2

  # Two Tier System Optimization
  two_tier:
    tier1_threshold: 0.8
    tier2_threshold: 0.6
    tier1_multiplier: 1.5
    tier2_multiplier: 1.0

  # Support/Resistance Optimization
  sr:
    breakout_threshold: 0.7
    confirmation_period: 5
    volume_threshold: 1.5
    price_threshold: 0.02