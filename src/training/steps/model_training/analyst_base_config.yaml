analyst_config:
  model_name: analyst_base
  model_type: multi_model_ensemble
  target: trading_signal
  base_timeframe: 5m
  execution_timeframe: 15m
  execution_frequency: 15m
  # Feature set selector for analyst_base:
  #   A = default selected_feature_dataframe_50 (+ specialists)
  #   B = meta-gated feature set (labeled_data meta columns + specialist scalars)
  feature_set: B
  base_models:
    lgbm:
      model_type: LGBMRegressor
      use_float32: true
      use_isotonic_calibration: true
      params:
        n_estimators: 200
        learning_rate: 0.13125830316209655
        max_depth: 5
        num_leaves: 32
        subsample: 0.9852142919229748
        colsample_bytree: 0.9852142919229748
        random_state: 42
        verbosity: -1
        n_jobs: -1
        reg_lambda: 1.1236203565420875
        sampling_rate: 0.9852142919229748
        min_child_samples: 64
        objective: regression_l1
        metric: mae
        early_stopping_rounds: 100
        min_boost_rounds: 200
      hpo:
        enabled: true
        n_rounds: 2
        enable_final_refinement: true
        final_refinement_trials: 50
        search_space:
          max_depth:
            type: int
            low: 3
            high: 10
          learning_rate:
            type: float
            low: 0.01
            high: 0.3
            log: true
          num_leaves:
            type: int
            low: 20
            high: 300
          reg_alpha:
            type: float
            low: 0.0
            high: 5.0
          reg_lambda:
            type: float
            low: 0.0
            high: 5.0
          subsample:
            type: float
            low: 0.6
            high: 1.0
          colsample_bytree:
            type: float
            low: 0.6
            high: 1.0
          min_child_samples:
            type: int
            low: 10
            high: 100
          min_gain_to_split:
            type: float
            low: 0.1
            high: 1.0
        optimal_params:
          max_depth: 6
          learning_rate: 0.05
          reg_lambda: 0.1
          sampling_rate: 0.8
          min_child_samples: 20
          num_leaves: 64
          subsample: 0.8
          colsample_bytree: 0.8
          n_estimators: 1000
          early_stopping_rounds: 50
        last_optimization:
          timestamp: '2025-11-21T00:42:07.546435'
          best_score: -.inf
          total_trials: 350
          total_time_seconds: 0.45926570892333984
          n_rounds: 2
    lgbm_bag_lower:
      enabled: true
      model_type: LGBMRegressor
      use_float32: true
      use_isotonic_calibration: true
      # When true, restricts features to specialist scalars only. For meta-gated
      # Feature Set B we keep this disabled so models see both meta-labeling
      # features (meta_probability, volatility_1d, adaptive thresholds) and
      # specialist scalars.
      use_specialist_outputs_only: false
      # Bagging configuration for IncrementalLGBMBaggedTrainer
      n_bags: 10
      bagging_feature_fraction: 0.7
      bagging_sample_fraction: 0.7
      params:
        n_estimators: 200
        learning_rate: 0.13125830316209655
        max_depth: 5
        num_leaves: 32
        subsample: 0.9852142919229748
        colsample_bytree: 0.9852142919229748
        random_state: 42
        verbosity: -1
        n_jobs: -1
        reg_lambda: 1.1236203565420875
        sampling_rate: 0.9852142919229748
        min_child_samples: 64
        objective: regression_l1
        metric: mae
        early_stopping_rounds: 100
        min_boost_rounds: 200
    knn:
      enabled: false
      model_type: KNeighborsClassifier
      use_float32: true
      use_isotonic_calibration: true
      use_specialist_outputs_only: true
      use_soft_clipping: true
      soft_clip_stretch: 2.0
      use_pca: true
      pca_n_components: 0.95
      pca_max_components: 15
      subsample_rate: 5
      params:
        n_neighbors: 50
        algorithm: ball_tree
        leaf_size: 40
        weights: distance
        metric: minkowski
        p: 2
        n_jobs: -1
      hpo:
        enabled: true
        n_rounds: 2
        enable_final_refinement: true
        final_refinement_trials: 50
        search_space:
          n_neighbors:
            type: int
            low: 20
            high: 100
          leaf_size:
            type: int
            low: 20
            high: 60
          weights:
            type: categorical
            choices:
            - uniform
            - distance
          p:
            type: int
            low: 1
            high: 3
        optimal_params:
          n_neighbors: 50
          leaf_size: 40
          weights: distance
          p: 2
        last_optimization:
          timestamp: '2025-11-25T00:00:00.000000'
          best_score: -.inf
          total_trials: 100
          total_time_seconds: 0.0
          n_rounds: 2
    bayesianridge:
      model_type: RidgeClassifier
      use_float32: true
      use_isotonic_calibration: true
      # For Feature Set B we want full meta-gated features, not specialists-only
      use_specialist_outputs_only: false
      use_soft_clipping: true
      soft_clip_stretch: 2.0
      standardize_features: true
      params:
        alpha: 1.0
        tol: 0.001
        class_weight: balanced
      hpo:
        enabled: false
    ngboost:
      model_type: NGBClassifier
      use_float32: true
      use_isotonic_calibration: true
      output_mean_and_variance: true
      params:
        n_estimators: 300
        learning_rate: 0.01
        minibatch_frac: 0.2
        verbose: false
        base_learner_params:
          max_depth: 4
          min_samples_leaf: 20
      hpo:
        enabled: true
        n_rounds: 2
        enable_final_refinement: true
        final_refinement_trials: 50
        search_space:
          n_estimators:
            type: int
            low: 300
            high: 800
          learning_rate:
            type: float
            low: 0.01
            high: 0.05
            log: true
          minibatch_frac:
            type: float
            low: 0.1
            high: 0.5
          base_learner_max_depth:
            type: int
            low: 3
            high: 5
          base_learner_min_samples_leaf:
            type: int
            low: 10
            high: 30
        optimal_params:
          n_estimators: 800
          learning_rate: 0.02
          minibatch_frac: 0.5
          base_learner_max_depth: 4
          base_learner_min_samples_leaf: 20
          early_stopping_rounds: 50
        last_optimization:
          timestamp: '2025-11-25T00:00:00.000000'
          best_score: -.inf
          total_trials: 100
          total_time_seconds: 0.0
          n_rounds: 2
  training:
    training_samples: 50000
    validation_samples: 15000
    test_samples: 10000
    enable_cross_validation: true
    cv_folds: 3
    enable_early_stopping: true
    early_stopping_patience: 20
    validation_split: 0.2
    test_split: 0.1
    enable_time_series_split: true
  performance:
    expected_accuracy: 0.78
    training_time_limit: 300
    memory_limit_mb: 2048
  output:
    save_models: true
    save_predictions: true
    generate_reports: true
    output_dir: ./analyst_base_models
feature_engineering:
  exclude_raw_ohlcv:
    enabled: true
    excluded_patterns:
    - volume
    - close
    - high
    - open
    - low
    technical_indicators:
    - rsi
    - sma
    - ema
    - bb_
    - macd
    - atr
    - roc
    - mom
    - return
    - pct
    - ratio
    - std
    - volatility
    - trend
    - momentum
    - oscillator
    - signal
    - cross
    - divergence
    - force
    - alpha
    - score
    - regime
    - probability
  primary_features:
    source: feature_generation_final_feature_selection_step
    artifact_name: analyst_features
    initial_count: 300
    target_count: 60
  cross_timeframe:
    enable: true
    base_timeframe: 5m
    target_timeframes:
    - 1m
    - 5m
    - 15m
    - 30m
    - 1h
    - 4h
    - 1d
    feature_types:
    - technical_indicators
    - price_action
    - volume_profile
    - volatility
  regime_features:
    enable: true
    source: regime_ml_models
    feature_names:
    - regime_prob_0
    - regime_prob_1
    - regime_prob_2
    - regime_prob_3
    include_regime_outputs: true
  feature_selection:
    method: lasso
    alpha: 0.01
    max_features: 100
    enable_recursive_elimination: true
    enable_feature_importance: true
  scaling:
    method: robust
    enable_outlier_handling: true
    outlier_threshold: 3.0
data_preparation:
  time_series:
    enable_temporal_features: true
    lookback_window: 50
    forecast_horizon: 1
  target_generation:
    method: price_momentum
    lookback_periods:
    - 5
    - 10
    - 20
    threshold: 0.02
evaluation:
  metrics:
    regression:
    - mse
    - mae
    - r2
    - mape
    classification:
    - accuracy
    - precision
    - recall
    - f1
    trading:
    - sharpe_ratio
    - max_drawdown
    - calmar_ratio
    - sortino_ratio
  cross_validation:
    method: time_series_split
    n_splits: 5
    test_size: 0.2
  comparison:
    enable_model_ranking: true
    ranking_metric: custom_balanced_score
    enable_feature_importance: true
hardware:
  enable_gpu_acceleration: false
  enable_memory_optimization: true
  enable_parallel_processing: true
  memory_limit_gb: 2.0
  max_workers: null
logging:
  level: INFO
  enable_detailed_logging: true
  log_predictions: true
  log_performance_metrics: true
  log_feature_importance: true
  intervals:
    training_progress: 100
    prediction_summary: 1000
    performance_update: 5000
