# Analyst Ensemble Models Configuration
# This config defines ensemble models that combine multiple analyst base models

model_type: "analyst_ensemble"
timeframe: "15m"
description: "Analyst ensemble models combining multiple base models for enhanced performance"

# Analyst Ensemble Models Configuration
# Meta-learner: stacker_lgbm_calibrated
models:
  - name: "stacker_lgbm_calibrated"
    type: "STACKER_LGBM_CALIBRATED"
    enabled: true
    description: "Stacked ensemble with LightGBM meta-learner and calibration"
    parameters:
      # Base models (inherited from analyst base)
      base_models:
        - "lgbm_base"
        - "lgbm_patchtst_embeddings"
        - "catboost_base"
      
      # Meta-learner configuration
      meta_learner_type: "LIGHTGBM"
      meta_learner_params:
        objective: "binary"
        metric: "binary_logloss"
        boosting_type: "gbdt"
        num_leaves: 31
        learning_rate: 0.05
        feature_fraction: 0.9
        bagging_fraction: 0.8
        bagging_freq: 5
        verbose: -1
        random_state: 42
        n_estimators: 1000
        early_stopping_rounds: 50
        min_data_in_leaf: 20
        min_gain_to_split: 0.0
        lambda_l1: 0.0
        lambda_l2: 0.0
      
      # Stacking configuration
      cv_folds: 5
      use_features_in_secondary: true
      use_proba_as_level1: true
      n_jobs: -1
      
      # Calibration parameters
      calibration_method: "isotonic"  # isotonic or platt
      calibration_cv_folds: 3
      calibration_test_size: 0.2
      
      # Ensemble weights
      ensemble_weights: null  # null for equal weights, or list of weights
      
      # Performance optimization
      enable_parallel_processing: true
      memory_efficient: true
      blend_method: "weighted_average"
      weights: null  # null for equal weights, or list of weights
      validation_split: 0.2

# Base Models for Ensemble
base_models:
  - name: "lightgbm"
    type: "LIGHTGBM"
    enabled: true
    parameters:
      objective: "binary"
      metric: "binary_logloss"
      boosting_type: "gbdt"
      num_leaves: 31
      learning_rate: 0.05
      feature_fraction: 0.9
      bagging_fraction: 0.8
      bagging_freq: 5
      verbose: -1
      random_state: 42
      n_estimators: 1000
      early_stopping_rounds: 50

  - name: "catboost"
    type: "CATBOOST"
    enabled: true
    parameters:
      objective: "Logloss"
      eval_metric: "Logloss"
      iterations: 1000
      learning_rate: 0.05
      depth: 6
      l2_leaf_reg: 3
      random_seed: 42
      early_stopping_rounds: 50
      verbose: false

  - name: "xgboost"
    type: "XGBOOST"
    enabled: true
    parameters:
      objective: "binary:logistic"
      eval_metric: "logloss"
      max_depth: 6
      learning_rate: 0.05
      n_estimators: 1000
      subsample: 0.8
      colsample_bytree: 0.9
      random_state: 42
      early_stopping_rounds: 50
      verbosity: 0

  - name: "random_forest"
    type: "RANDOM_FOREST"
    enabled: true
    parameters:
      n_estimators: 1000
      max_depth: 10
      min_samples_split: 5
      min_samples_leaf: 2
      max_features: "sqrt"
      random_state: 42
      n_jobs: -1

# Target Configuration
targets:
  primary: "analyst_confidence"  # Calibrated confidence score for position entry/stay (0-1)
  target_type: "binary_classification"
  confidence_calibration: true
  calibration_method: "isotonic"  # or "platt", "sigmoid"

# Input Configuration
inputs:
  # Pre-selected features from upstream feature generation
  # These are specific to analyst model type and direction (shorts/longs)
  pre_selected_features:
    description: "Features pre-selected by feature_generation_final_feature_selection_step"
    source: "upstream_feature_generation"
    
  # Regime features from regime_ensemble_training
  regime_features:
    description: "Regime features generated by regime ML model"
    source: "regime_ensemble_training"
    enabled: true
    
  # Analyst base model outputs
  analyst_base_outputs:
    description: "Outputs from Analyst base models"
    source: "analyst_base_training"
    enabled: true
  
  # Regime model outputs (from previous pipeline steps)
  regime_outputs:
    - "regime_classification"
    - "regime_probabilities"
    - "regime_transition_matrix"
    - "regime_volatility_estimates"
  
  # Previous model outputs (from analyst base models)
  previous_model_outputs:
    - "analyst_base_predictions"  # From analyst base models
    - "analyst_base_probabilities"  # From analyst base models
    - "analyst_base_confidence"  # From analyst base models
    - "analyst_base_feature_importance"  # From analyst base models

# Training Configuration
training:
  validation_split: 0.2
  cv_folds: 5
  test_split: 0.1
  random_state: 42
  stratify: true
  
  # Cross-validation strategy
  cv_strategy: "TimeSeriesSplit"
  cv_params:
    n_splits: 5
    test_size: 0.2
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 50
    min_delta: 0.001
    monitor: "val_loss"
    mode: "min"
  
  # Hyperparameter optimization
  hyperparameter_optimization:
    enabled: true
    method: "optuna"
    n_trials: 100
    timeout: 3600  # 1 hour
    direction: "maximize"
    metric: "f1_score"
  
  # Ensemble-specific training
  ensemble_training:
    # Stacking training
    stacking:
      meta_learner_cv: 5
      use_features_in_secondary: true
      meta_learner_early_stopping: true
      meta_learner_patience: 20
    
    # Blending training
    blending:
      holdout_split: 0.2
      blend_method: "weighted_average"
      weight_optimization: true
      weight_optimization_method: "grid_search"

# Feature Engineering
# Feature engineering is handled upstream by feature_generation_final_feature_selection_step
# Features are pre-selected and specific to model type and direction
  
  # Ensemble-specific features
  ensemble_features:
    # Base model predictions as features
    include_base_predictions: true
    include_base_probabilities: true
    include_base_confidence: true
    
    # Feature interactions
    enable_feature_interactions: true
    interaction_degree: 2
    interaction_threshold: 0.1

# Data Quality & Leakage Prevention
data_quality:
  # Leakage detection
  leakage_detection:
    enabled: true
    methods: ["temporal_consistency", "feature_correlation", "target_correlation"]
    max_correlation_threshold: 0.95
    temporal_window: 5
  
  # Data validation
  validation:
    check_missing_values: true
    check_infinite_values: true
    check_duplicate_timestamps: true
    check_data_types: true
    max_missing_percentage: 0.05
  
  # Outlier detection
  outlier_detection:
    enabled: true
    method: "isolation_forest"
    contamination: 0.1
    random_state: 42

# Metrics & Evaluation
metrics:
  primary: "f1_score"
  secondary: ["precision", "recall", "accuracy", "auc_roc"]
  regression_metrics: ["mse", "mae", "r2_score"]
  
  # SHAP analysis
  shap_analysis:
    enabled: true
    sample_size: 1000
    background_samples: 100
    explainer_type: "tree"
  
  # Feature importance
  feature_importance:
    enabled: true
    methods: ["permutation", "shap", "builtin"]
    top_n_features: 20
  
  # Ensemble-specific metrics
  ensemble_metrics:
    # Individual model performance
    track_individual_models: true
    individual_model_metrics: ["f1_score", "precision", "recall", "auc_roc"]
    
    # Ensemble performance
    ensemble_improvement: true
    diversity_metrics: true
    correlation_analysis: true

# Performance Monitoring
monitoring:
  # Training monitoring
  training:
    log_metrics_every: 10  # epochs
    save_checkpoints: true
    checkpoint_frequency: 50  # epochs
    checkpoint_dir: "checkpoints/analyst_ensemble"
  
  # Model performance
  performance:
    track_training_time: true
    track_memory_usage: true
    track_gpu_usage: true
    log_predictions: true
    prediction_sample_size: 1000
  
  # Ensemble monitoring
  ensemble_monitoring:
    track_individual_models: true
    track_ensemble_weights: true
    track_diversity_metrics: true
    track_correlation_matrix: true

# Output Configuration
output:
  # Model artifacts
  models:
    save_format: "joblib"
    save_path: "models/analyst_ensemble"
    include_metadata: true
    include_feature_names: true
    include_training_history: true
    include_ensemble_weights: true
    include_individual_models: true
  
  # Results
  results:
    save_predictions: true
    save_probabilities: true
    save_feature_importance: true
    save_shap_values: true
    save_ensemble_weights: true
    save_individual_predictions: true
    results_path: "results/analyst_ensemble"
  
  # Reports
  reports:
    generate_report: true
    report_format: "html"
    include_plots: true
    include_tables: true
    include_ensemble_analysis: true
    report_path: "reports/analyst_ensemble"