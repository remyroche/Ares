# Ares Trading Bot - Main Configuration File
# Updated for New Triple Barrier System and Enhanced Features

# =============================================================================
# ANALYST CONFIGURATION
# =============================================================================
analyst:
  # Triple Barrier System Configuration
  triple_barrier:
    profit_take_multiplier: 0.0028  # 0.28% (0.2% + 0.08% fee)
    stop_loss_multiplier: 0.0025    # 0.25% (0.17% + 0.08% fee) - Increased for crypto volatility
    confidence_threshold: 0.6       # 60% threshold for green light
    time_barrier_minutes: 30        # Time barrier for triple barrier method
    max_lookahead: 100              # Maximum lookahead for barrier calculation

  # ML Confidence Predictor Configuration
  ml_confidence_predictor:
    enable_ml_predictions: true
    enable_fallback_predictions: true
    fallback_decay_rate: 0.1
    fallback_base_confidence: 0.3
    price_targets: [0.001, 0.002, 0.005, 0.01, 0.02]  # 0.1%, 0.2%, 0.5%, 1.0%, 2.0%
    adversarial_targets: [0.001, 0.002, 0.005, 0.01, 0.02]

  # Feature Engineering Configuration
  enable_feature_engineering: true
  enable_advanced_features: true
  enable_autoencoder_features: true
  enable_legacy_features: true
  enable_microstructure_features: true
  enable_multi_timeframe: true
  enable_meta_labeling: true

  # Market Health Analysis
  enable_market_health_analysis: true
  health_check_interval: 30
  performance_threshold: 0.8

  # Liquidation Risk Analysis
  enable_liquidation_risk_analysis: true
  liquidation_buffer: 0.05
  max_leverage: 100.0

# =============================================================================
# TACTICIAN CONFIGURATION
# =============================================================================
tactician:
  # Triple Barrier System Configuration (inherited from Analyst)
  triple_barrier:
    profit_take_multiplier: 0.0028  # 0.28% (0.2% + 0.08% fee)
    stop_loss_multiplier: 0.0025    # 0.25% (0.17% + 0.08% fee) - Increased for crypto volatility
    confidence_threshold: 0.6       # 60% threshold for green light
    time_barrier_minutes: 30        # Time barrier for triple barrier method

  # Tactics Configuration
  tactics_interval: 30
  max_history: 100
  enable_enhanced_predictions: true

  # Decision Thresholds (Step17 Optimizable)
  decision_thresholds:
    entry_profit_threshold: 0.6     # Range: [0.4, 0.8] - Minimum profit probability for entry
    entry_risk_threshold: 0.2       # Range: [0.1, 0.4] - Maximum risk probability for entry
    entry_confidence_threshold: 0.7 # Range: [0.5, 0.9] - Minimum confidence for entry
    entry_profit_risk_ratio: 2.0    # Range: [1.5, 3.0] - Minimum profit/risk ratio for entry
    entry_scenario_dominance: 0.4   # Range: [0.3, 0.6] - Minimum scenario dominance for entry
    exit_risk_threshold: 0.5        # Range: [0.3, 0.7] - Maximum risk probability for exit
    exit_confidence_drop: 0.2       # Range: [0.1, 0.3] - Confidence drop threshold for exit
    position_size_multiplier: 1.0   # Range: [0.5, 2.0] - Multiplier for calculated position size
    leverage_multiplier: 1.0        # Range: [0.5, 2.0] - Multiplier for calculated leverage

  # Risk Management (Step17 Optimizable)
  risk_management:
    max_position_size: 0.1
    max_leverage: 3.0
    stop_loss_multiplier: 1.0
    take_profit_multiplier: 1.0
    max_drawdown: 0.05
    correlation_threshold: 0.8

  # SR Optimization Configuration
  sr_optimization:
    enable_quality_evaluation: true
    quality_thresholds:
      elite_threshold: 0.85
      strong_threshold: 0.70
      moderate_threshold: 0.50
      weak_threshold: 0.30
      historical_min_tests: 5
      confluence_min_levels: 2
      volume_min_ratio: 1.2
    optimization:
      enabled: true
      n_calls: 50
      n_random_starts: 10
      convergence_threshold: 0.001
    training_data:
      create_elite_only: true
      create_strong_plus: true
      create_moderate_plus: true
      create_weighted_quality: true
      create_all_levels_with_strength: true
      create_progressive_elite_to_all: true
      min_samples_per_class: 100

  # SR Detection Configuration
  sr_detection:
    max_dataset_rows: 10000  # Maximum rows to process for SR detection (default: 10000)
    enable_stratified_sampling: true  # Use stratified sampling to maintain historical context

# =============================================================================
# FEATURE ENGINEERING PARAMETERS
# =============================================================================
feature_engineering_parameters:
  # Core Feature Engineering
  enable_advanced_features: true
  enable_autoencoder_features: true
  enable_legacy_features: true
  enable_microstructure_features: true
  enable_entropy_features: true
  enable_fractal_features: true
  enable_network_features: true
  enable_risk_features: true
  enable_calendar_features: true
  enable_market_profile_features: true
  enable_ichimoku_features: true
  enable_harmonic_features: true
  enable_sentiment_features: true

  # Entropy Feature Parameters
  entropy_parameters:
    shannon_windows: [20, 50, 100]
    sample_windows: [20, 50]
    permutation_windows: [20, 50]
    spectral_windows: [20, 50]
    conditional_windows: [20, 50]
    multiscale_windows: [20, 50]
    sample_entropy_m: 2
    sample_entropy_r: 0.2
    permutation_order: 3

  # Fractal Feature Parameters
  fractal_parameters:
    hurst_windows: [20, 50, 100]
    fractal_dimension_windows: [20, 50]
    lyapunov_windows: [20, 50]

  # Network Feature Parameters
  network_parameters:
    correlation_windows: [20, 50]
    minimum_correlation: 0.3
    network_centrality_windows: [20, 50]

  # Risk Feature Parameters
  risk_parameters:
    var_windows: [20, 50]
    cvar_alpha: 0.05
    drawdown_windows: [20, 50]
    stress_test_windows: [20, 50]

  # Calendar Feature Parameters
  calendar_parameters:
    holiday_impact_window: 5
    earnings_season_weight: 1.5
    economic_event_window: 3
    timezone_adjustments: true

  # Market Profile Feature Parameters
  enable_market_profile_features: true
  market_profile_parameters:
    profile_periods: [20, 50, 100]
    value_area_percentage: 0.7
    initial_balance_periods: [5, 10, 20]

  # Ichimoku Feature Parameters
  enable_ichimoku_features: true
  ichimoku_parameters:
    tenkan_period: 9
    kijun_period: 26
    senkou_span_b_period: 52
    displacement: 26

  # Harmonic Pattern Parameters
  enable_harmonic_features: true
  harmonic_parameters:
    fib_levels: [0.236, 0.382, 0.5, 0.618, 0.786, 1.0, 1.272, 1.618]
    pattern_tolerance: 0.05
    min_pattern_length: 5
    max_pattern_length: 50

  # Sentiment Feature Parameters
  enable_sentiment_features: true
  sentiment_parameters:
    greed_fear_lookback: 30
    momentum_crowding_window: 20
    sentiment_smoothing: 5

  # Step06 Feature Interaction Engineering
  step06_feature_engineering:
    use_matrix_optimizer: true
    force_regime_specific_periods: false
    max_interactions: 150
    min_importance: 0.01
    correlation_threshold: 0.8
    mutual_info_threshold: 0.05

    # Interaction Pattern Weights (Step17 Optimizable)
    momentum_volume_weight: 1.5
    trend_volatility_weight: 1.8
    oscillator_trend_weight: 1.3
    volume_price_weight: 1.6
    volatility_regime_weight: 1.4
    cross_timeframe_weight: 1.2
    regime_dependent_weight: 1.7

    # Interaction Thresholds (Step17 Optimizable)
    strong_interaction_threshold: 0.7
    medium_interaction_threshold: 0.5
    weak_interaction_threshold: 0.3

# =============================================================================
# STEP17 OPTIMIZATION PARAMETERS
# =============================================================================
step17_optimization:
  # Fully Migrated Tactician Parameters (Step17 Optimizable)
  fully_migrated_tactician:
    # Entry Logic Parameters
    entry_profit_threshold: 0.6
    entry_risk_threshold: 0.2
    entry_confidence_threshold: 0.7
    entry_profit_risk_ratio: 2.0
    entry_scenario_dominance: 0.4

    # Exit Logic Parameters
    exit_risk_threshold: 0.5
    exit_confidence_drop: 0.2

    # Position Sizing Parameters
    position_size_multiplier: 1.0
    leverage_multiplier: 1.0
    max_position_size: 0.1
    max_leverage: 3.0

    # Risk Management Parameters
    stop_loss_multiplier: 1.0
    take_profit_multiplier: 1.0
    max_drawdown: 0.05
    correlation_threshold: 0.8

  # Leverage Sizing Optimization (Step17 Optimizable)
  leverage:
    min_leverage: 10.0              # Range: [5.0, 20.0] - Minimum leverage for trading
    max_leverage: 100.0             # Range: [50.0, 200.0] - Maximum leverage for trading
    confidence_threshold: 0.6       # Range: [0.4, 0.8] - Minimum confidence for leverage sizing
    liquidation_buffer: 0.05        # Range: [0.02, 0.1] - Liquidation risk buffer
    ml_weight: 0.6                  # Range: [0.3, 0.8] - Weight of ML predictions in leverage
    liquidation_weight: 0.4         # Range: [0.2, 0.7] - Weight of liquidation risk in leverage
    leverage_multiplier: 1.0        # Range: [0.5, 2.0] - Multiplier for calculated leverage
    # risk_adjustment_factor removed as requested
    max_risk_leverage: 50.0         # Range: [20.0, 100.0] - Maximum leverage in high risk conditions

  # Position Sizing Optimization (Step17 Optimizable)
  position_sizing:
    kelly_multiplier: 0.25          # Range: [0.1, 1.5] - Kelly criterion multiplier for position sizing
    max_position_size: 0.3          # Range: [0.2, 0.3] - HARD CAP: Maximum position size (absolute limit)
    min_position_size: 0.01         # Range: [0.001, 0.1] - Minimum position size
    confidence_threshold: 0.6       # Range: [0.4, 0.8] - Minimum confidence for position sizing
    ml_weight: 0.7                  # Range: [0.4, 0.9] - Weight of ML predictions in position sizing (used in multiplication formula)
    # kelly_weight removed as requested
    # risk_adjustment_factor removed as requested

  # Take Profit / Stop Loss (TPSL) Optimization (Step17 Optimizable) - COMMENTED OUT FOR NOW
  # tpsl:
  #   atr_multiplier: 2.0             # Range: [1.0, 4.0] - ATR multiplier for dynamic barriers
  #   confidence_threshold: 0.7       # Range: [0.5, 0.9] - Minimum confidence for TPSL
  #   stop_loss_multiplier: 1.5       # Range: [1.0, 3.0] - Multiplier for stop loss distance
  #   take_profit_multiplier: 2.0     # Range: [1.0, 4.0] - Multiplier for take profit distance
  #   trailing_stop_enabled: true
  #   trailing_stop_distance: 0.02
  #   max_hold_time: 3600

  # ML Tactics Optimization (Step17 Optimizable)
  ml_tactics:
    enable_ml_tactics: true
    confidence_threshold: 0.7       # Range: [0.5, 0.9] - Minimum confidence for ML tactics
    regime_threshold: 0.6           # Range: [0.4, 0.8] - Minimum regime confidence for ML tactics
    ml_weight: 0.8                  # Range: [0.5, 0.95] - Weight of ML predictions in tactics
    regime_weight: 0.2              # Range: [0.05, 0.5] - Weight of regime analysis in tactics
    # risk_adjustment_factor removed as requested

  # Decision Policy Optimization (Step17 Optimizable)
  decision_policy:
    confidence_threshold: 0.6       # Range: [0.4, 0.8] - Minimum confidence for trading decisions
    risk_threshold: 0.1             # Range: [0.05, 0.2] - Maximum acceptable risk level

  # Confidence Optimization (Step17 Optimizable)
  confidence:
    price_deviation_boost: 1.35
    price_direction_boost: 1.28
    price_target_boost: 1.42

  # Technical Indicators Optimization (Step17 Optimizable)
  technical_indicators:
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bollinger_period: 20
    bollinger_std: 2

  # Market Profile Optimization (Step17 Optimizable)
  market_profile:
    profile_periods: [20, 50, 100]                    # Range: [[10, 30], [30, 70], [70, 150]]
    value_area_percentage: 0.7                         # Range: [0.6, 0.8] - Percentage of volume in value area
    initial_balance_periods: [5, 10, 20]               # Range: [[3, 8], [8, 15], [15, 30]]

  # Ichimoku Optimization (Step17 Optimizable)
  ichimoku:
    tenkan_period: 9                                   # Range: [7, 12] - Tenkan-sen period
    kijun_period: 26                                   # Range: [20, 35] - Kijun-sen period
    senkou_span_b_period: 52                           # Range: [40, 65] - Senkou Span B period
    displacement: 26                                   # Range: [20, 35] - Displacement period

  # Harmonic Pattern Optimization (Step17 Optimizable)
  harmonic_patterns:
    fib_levels: [0.236, 0.382, 0.5, 0.618, 0.786, 1.0, 1.272, 1.618]  # Fixed Fibonacci levels
    pattern_tolerance: 0.05                           # Range: [0.02, 0.08] - Pattern recognition tolerance
    min_pattern_length: 5                              # Range: [3, 8] - Minimum pattern length
    max_pattern_length: 50                             # Range: [30, 80] - Maximum pattern length

  # Sentiment Features Optimization (Step17 Optimizable)
  sentiment_features:
    greed_fear_lookback: 30                            # Range: [15, 50] - Lookback period for greed/fear
    momentum_crowding_window: 20                       # Range: [10, 35] - Window for momentum crowding
    sentiment_smoothing: 5                             # Range: [2, 10] - Smoothing period for sentiment

# =============================================================================
# A/B TESTING FRAMEWORK CONFIGURATION
# =============================================================================
ab_testing:
  # HMM Regime A/B Testing
  hmm_regime_ab_testing:
    enable_ab_testing: true
    trading_fee: 0.0008  # 0.08% trading fee
    min_trades_per_group: 100
    confidence_level: 0.95
    max_test_duration_hours: 168  # 1 week

    # Conservative Regime Configs (Step17 Optimizable)
    conservative_regime_configs:
      profit_take_multiplier: 0.0018  # 0.18% (0.1% + 0.08% fee)
      stop_loss_multiplier: 0.0020    # 0.20% (0.12% + 0.08% fee) - Increased for crypto volatility
      confidence_threshold: 0.7
      timeframe_weights:
        "1m": 0.1
        "5m": 0.2
        "15m": 0.3
        "30m": 0.3
        "1h": 0.1
      # Feature Engineering Parameters (Conservative)
      market_profile_periods: [15, 40, 80]         # Shorter periods for conservative
      ichimoku_periods: [8, 22, 44, 22]            # Shorter periods for conservative
      harmonic_tolerance: 0.03                      # Tighter tolerance for conservative
      sentiment_lookback: 25                        # Shorter lookback for conservative

    # Aggressive Regime Configs (Step17 Optimizable)
    aggressive_regime_configs:
      profit_take_multiplier: 0.0038  # 0.38% (0.3% + 0.08% fee)
      stop_loss_multiplier: 0.0030    # 0.30% (0.22% + 0.08% fee) - Increased for crypto volatility
      confidence_threshold: 0.5
      timeframe_weights:
        "1m": 0.2
        "5m": 0.4
        "15m": 0.3
        "30m": 0.1
        "1h": 0.0
      # Feature Engineering Parameters (Aggressive)
      market_profile_periods: [25, 60, 120]        # Longer periods for aggressive
      ichimoku_periods: [10, 30, 60, 30]           # Longer periods for aggressive
      harmonic_tolerance: 0.07                      # Looser tolerance for aggressive
      sentiment_lookback: 35                        # Longer lookback for aggressive

# =============================================================================
# ML-OPTIMIZED BARRIERS CONFIGURATION
# =============================================================================
ml_optimized_barriers:
  # Multi-Objective Optimization Weights (Step17 Optimizable)
  optimization_weights:
    pnl_weight: 0.5      # 50% PnL
    win_rate_weight: 0.25 # 25% Win Rate
    sharpe_weight: 0.25   # 25% Sharpe Ratio

  # Optimization Bounds (Step17 Optimizable)
  optimization_bounds:
    profit_take_multiplier: [0.0013, 0.0058]  # 0.13% to 0.58% (0.05%+fee to 0.5%+fee)
    stop_loss_multiplier: [0.0020, 0.0038]    # 0.20% to 0.38% (0.12%+fee to 0.3%+fee) - Updated for crypto volatility
    confidence_threshold: [0.4, 0.8]

  # Trading Fee Integration
  trading_fee: 0.0008  # 0.08% trading fee

  # Optimization Constraints (Step17 Optimizable)
  optimization_constraints:
    min_profit_take_vs_fee: 2.0    # Profit take >= 2x fee
    min_stop_loss_vs_fee: 1.5      # Stop loss >= 1.5x fee
    max_risk_reward_ratio: 5.0     # Max risk-reward ratio
    min_confidence_threshold: 0.4  # Min confidence threshold

# =============================================================================
# PERFORMANCE ATTRIBUTION CONFIGURATION
# =============================================================================
performance_attribution:
  # Timeframes for Attribution (Step17 Optimizable)
  timeframes: ["1m", "5m", "15m", "30m", "1h"]
  
  # HMM Clusters
  hmm_clusters: 20
  
  # Performance Metrics (Step17 Optimizable)
  performance_metrics:
    sharpe_ratio_threshold: 1.0
    max_drawdown_threshold: 0.1
    win_rate_threshold: 0.6
    profit_factor_threshold: 1.5

  # Attribution Weights (Step17 Optimizable)
  attribution_weights:
    regime_weight: 0.4
    timeframe_weight: 0.3
    barrier_type_weight: 0.3

# =============================================================================
# MICROSTRUCTURE FEATURES CONFIGURATION (Step06 Optimization)
# =============================================================================
microstructure_features:
  # Feature Extraction Parameters (Optimize in Step06, not Step17)
  feature_extraction:
    spread_threshold: 0.0001
    volume_imbalance_threshold: 0.1
    vwap_deviation_threshold: 0.05
    volatility_window: 20
    price_position_threshold: 0.1

  # Trading Session Detection
  trading_sessions:
    asian_overnight: [0, 6]      # 0-6 UTC
    asian_morning: [6, 12]       # 6-12 UTC
    european_afternoon: [12, 18] # 12-18 UTC
    us_evening: [18, 24]         # 18-24 UTC

  # Timeframe-Specific Features (Optimize in Step06, not Step17)
  timeframe_features:
    "5m":
      ultra_tight_spread_threshold: 0.00005
      high_volume_threshold: 1.5
      high_volatility_threshold: 0.002
    "15m":
      ultra_tight_spread_threshold: 0.0001
      high_volume_threshold: 1.3
      high_volatility_threshold: 0.0015
    "30m":
      ultra_tight_spread_threshold: 0.0002
      high_volume_threshold: 1.2
      high_volatility_threshold: 0.001
    "1h":
      ultra_tight_spread_threshold: 0.0003
      high_volume_threshold: 1.1
      high_volatility_threshold: 0.0008

# =============================================================================
# BAYESIAN PROBABILITY UPDATES CONFIGURATION (Separate Optimization)
# =============================================================================
bayesian_updates:
  # Update Parameters (Optimize separately, not in Step17)
  update_parameters:
    learning_rate: 0.1
    prior_strength: 0.5
    min_observations: 10
    max_observations: 1000
    confidence_decay: 0.95

  # Regime-Specific Updates (Optimize separately, not in Step17)
  regime_updates:
    update_frequency: 100  # Update every 100 trades
    regime_transition_threshold: 0.7
    stability_period: 300

# =============================================================================
# COPULA DEPENDENCY MODELS CONFIGURATION (Separate Optimization)
# =============================================================================
copula_models:
  # Dependency Modeling (Optimize separately, not in Step17)
  dependency_modeling:
    copula_type: "gaussian"  # gaussian, t, clayton, gumbel
    correlation_threshold: 0.3
    tail_dependence_threshold: 0.1
    update_frequency: 50

  # Cluster Dependencies (Optimize separately, not in Step17)
  cluster_dependencies:
    max_clusters: 20
    min_correlation: 0.1
    max_correlation: 0.9
    dependency_strength: 0.5

# =============================================================================
# SYSTEM MONITORING CONFIGURATION
# =============================================================================
system_monitoring:
  # Health Check Parameters (Step17 Optimizable)
  health_check_interval: 30
  performance_threshold: 0.8
  alert_threshold: 0.6
  max_alert_frequency: 10  # Max alerts per hour

  # Performance Monitoring (Step17 Optimizable)
  performance_monitoring:
    sharpe_ratio_threshold: 1.0
    max_drawdown_threshold: 0.1
    win_rate_threshold: 0.6
    profit_factor_threshold: 1.5

# =============================================================================
# TRAINING CONFIGURATION
# =============================================================================
training:
  # Training Optimization (Step17 Optimizable)
  training_optimization:
    batch_size: 64
    learning_rate: 0.001
    epochs: 100
    validation_split: 0.2
    early_stopping_patience: 10

  # Regime Transitions (Step17 Optimizable)
  regime_transitions:
    transition_threshold: 0.7
    stability_period: 300
    confirmation_required: true

# =============================================================================
# EXCHANGE CONFIGURATION
# =============================================================================
exchange:
  # Trading Fee Configuration
  trading_fee: 0.0008  # 0.08% trading fee
  
  # Market Hours (24/7 for crypto)
  market_hours:
    enable_24_7: true
    trading_sessions:
      asian_overnight: [0, 6]
      asian_morning: [6, 12]
      european_afternoon: [12, 18]
      us_evening: [18, 24]

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "log/ares.log"
  max_size: "10MB"
  backup_count: 5

# =============================================================================
# DATA CONFIGURATION
# =============================================================================
data:
  # Data Directory
  data_dir: "data"
  
  # Data Sources
  sources:
    klines: true
    agg_trades: true
    futures: true
    order_book: false  # Limited access

  # Data Quality
  quality:
    min_data_points: 1000
    max_missing_ratio: 0.1
    outlier_threshold: 3.0

# =============================================================================
# STEP17 FINAL PARAMETERS OPTIMIZATION
# =============================================================================
step17_optimization:
  # Position Sizing (Logarithmic Computations)
  position_sizing:
    kelly_multiplier: 0.25      # Range: [0.1, 1.5] - Kelly criterion multiplier
    max_position_size: 0.3      # Range: [0.2, 0.3] - Hard cap, cannot be overridden
    min_position_size: 0.01     # Range: [0.001, 0.1] - Minimum position size
    ml_weight: 0.7              # Range: [0.4, 0.9] - Used in log(position) = (1-ml_weight)*log(kelly) + ml_weight*log(ml)

  # Leverage Sizing (Logarithmic Computations)
  leverage:
    min_leverage: 1.0           # Range: [1.0, 2.0] - Minimum leverage
    max_leverage: 3.0           # Range: [2.0, 5.0] - Maximum leverage
    ml_weight: 0.6              # Range: [0.3, 0.8] - ML weight in log space
    liquidation_weight: 0.4     # Range: [0.2, 0.7] - Liquidation weight in log space
    confidence_threshold: 0.7   # Range: [0.5, 0.9] - Minimum confidence for leverage

  # Decision Thresholds (Logarithmic Computations)
  decision_thresholds:
    entry_profit_threshold: 0.6     # Range: [0.4, 0.8] - Minimum profit probability for entry
    entry_risk_threshold: 0.2       # Range: [0.1, 0.4] - Maximum risk probability for entry
    entry_profit_risk_ratio: 2.0    # Range: [1.5, 3.0] - Minimum profit/risk ratio for entry
    entry_scenario_dominance: 0.4   # Range: [0.3, 0.6] - Minimum scenario dominance for entry
    exit_confidence_drop: 0.2       # Range: [0.1, 0.3] - Confidence drop threshold for exit
    position_size_multiplier: 1.0   # Range: [0.5, 2.0] - Applied in log space
    leverage_multiplier: 1.0        # Range: [0.5, 2.0] - Applied in log space

  # ML Tactics (Logarithmic Computations)
  ml_tactics:
    confidence_threshold: 0.7   # Range: [0.5, 0.9] - ML confidence threshold
    regime_threshold: 0.6       # Range: [0.4, 0.8] - Regime confidence threshold
    ml_weight: 0.8              # Range: [0.5, 0.95] - ML weight in log space
    regime_weight: 0.2          # Range: [0.05, 0.5] - Regime weight in log space

  # A/B Testing Configs (20 HMM Clusters)
  ab_testing_configs:
    # Conservative regime configs for 20 HMM clusters
    conservative_regime_configs:
      profit_take_multiplier: 0.0018  # Range: [0.0013, 0.0028] - Conservative profit take
      stop_loss_multiplier: 0.0020    # Range: [0.0020, 0.0025] - Conservative stop loss - Updated for crypto volatility
      confidence_threshold: 0.7       # Range: [0.6, 0.8] - Conservative confidence
      timeframe_weights:
        "5m": 0.2                     # Range: [0.1, 0.3] - 5m weight
        "15m": 0.3                    # Range: [0.2, 0.4] - 15m weight
        "30m": 0.3                    # Range: [0.2, 0.4] - 30m weight
        "1h": 0.2                     # Range: [0.1, 0.3] - 1h weight

    # Aggressive regime configs for 20 HMM clusters
    aggressive_regime_configs:
      profit_take_multiplier: 0.0038  # Range: [0.0028, 0.0058] - Aggressive profit take
      stop_loss_multiplier: 0.0030    # Range: [0.0025, 0.0038] - Aggressive stop loss - Updated for crypto volatility
      confidence_threshold: 0.5       # Range: [0.4, 0.6] - Aggressive confidence
      timeframe_weights:
        "5m": 0.4                     # Range: [0.3, 0.5] - 5m weight
        "15m": 0.3                    # Range: [0.2, 0.4] - 15m weight
        "30m": 0.2                    # Range: [0.1, 0.3] - 30m weight
        "1h": 0.1                     # Range: [0.05, 0.2] - 1h weight

  # ML-Optimized Barriers
  ml_optimized_barriers:
    optimization_weights:
      pnl_weight: 0.5              # Range: [0.4, 0.6] - PnL weight in optimization
      win_rate_weight: 0.25        # Range: [0.2, 0.3] - Win rate weight in optimization
      sharpe_weight: 0.25          # Range: [0.2, 0.3] - Sharpe ratio weight in optimization

    optimization_bounds:
      profit_take_multiplier: [0.0013, 0.0058]  # Range bounds for profit take
      stop_loss_multiplier: [0.0020, 0.0038]    # Range bounds for stop loss - Updated for crypto volatility
      confidence_threshold: [0.4, 0.8]          # Range bounds for confidence

  # Performance Attribution
  performance_attribution:
    attribution_weights:
      regime_weight: 0.4           # Range: [0.3, 0.5] - Regime attribution weight
      timeframe_weight: 0.3        # Range: [0.2, 0.4] - Timeframe attribution weight
      barrier_type_weight: 0.3     # Range: [0.2, 0.4] - Barrier type attribution weight

    performance_metrics:
      sharpe_ratio_threshold: 1.0  # Range: [0.8, 1.5] - Sharpe ratio threshold
      max_drawdown_threshold: 0.1  # Range: [0.05, 0.15] - Max drawdown threshold
      win_rate_threshold: 0.6      # Range: [0.5, 0.7] - Win rate threshold
      profit_factor_threshold: 1.5 # Range: [1.2, 2.0] - Profit factor threshold

  # System Monitoring
  system_monitoring:
    health_check_interval: 30      # Range: [15, 60] - Health check interval
    performance_threshold: 0.8     # Range: [0.7, 0.9] - Performance threshold
    alert_threshold: 0.6           # Range: [0.5, 0.7] - Alert threshold
    max_alert_frequency: 10        # Range: [5, 20] - Max alerts per hour

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================
security:
  # API Security
  api:
    rate_limit: 1000  # Requests per minute
    timeout: 30
    retry_attempts: 3

  # Data Security
  data:
    encrypt_sensitive: true
    backup_frequency: "daily"
    retention_days: 30