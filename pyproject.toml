[tool.poetry]
name = "ares"
version = "0.1.0"
description = "Advanced Regime-based Ensemble System for Financial Market Analysis"
authors = ["Remy Roche <remy@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Core scientific computing
numpy = "^1.24.0"
pandas = "^2.0.0"
scipy = "^1.10.0"
scikit-learn = "^1.3.0"

# Data visualization
matplotlib = "^3.7.0"
seaborn = "^0.12.0"

# Machine Learning (simplified)
torch = "^2.0.0"
torchvision = "^0.15.0"
torchaudio = "^2.0.0"
pyro-ppl = "^1.8.0"

# Clustering
hdbscan = "^0.8.29"
hmmlearn = "^0.3.0"

# Optimization
optuna = "^3.2.0"

# Model Explainability
shap = "^0.42.0"
lime = "^0.2.0.1"

# Financial Data
vectorbt = "^0.28.0"
ccxt = "^4.0.0"
yfinance = "^0.2.18"
ta = "^0.10.2"

# Async and Networking
aiohttp = "^3.8.0"
requests = "^2.31.0"

# Data Processing
pyarrow = "^12.0.0"
fastparquet = "^0.8.0"

# Utilities
psutil = "^5.9.0"
tqdm = "^4.65.0"
python-dateutil = "^2.8.0"
pytz = "^2023.3"
pyyaml = "^6.0"
python-dotenv = "^1.0.0"

# Performance Optimization
numba = "^0.57.0"

# Web Framework (for GUI)
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"

# Monitoring and Metrics
prometheus-client = "^0.19.0"

[tool.poetry.group.dev.dependencies]
# Code Quality Tools
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
pylint = "^2.17.0"
mypy = "^1.5.0"

# Testing
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"

# Development Utilities
rich = "^13.0.0"
ipython = "^8.15.0"
jupyter = "^1.0.0"

[tool.poetry.group.optional.dependencies]
# Additional ML Libraries
xgboost = "^1.7.0"
lightgbm = "^4.0.0"
catboost = "^1.2.0"

# Advanced Analytics
statsmodels = "^0.14.0"
arch = "^6.2.0"

# Visualization Extensions
plotly = "^5.15.0"
networkx = "^3.1.0"

# Note: These packages have complex version requirements:
# - tensorflow: Requires specific numpy versions and has Python version restrictions
# - vectorbt: Only supports Python <3.11
# - pandas-ta: Requires Python 3.12+ and numpy 2.2.6+
# Install manually if needed

[tool.poetry.scripts]
ares = "src.launcher.ares_launcher:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]
known_third_party = ["numpy", "pandas", "scipy", "sklearn", "matplotlib", "seaborn"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "hdbscan.*",
    "ccxt.*",
    "yfinance.*",
    "ta.*",
    "hmmlearn.*",
    "shap.*",
    "lime.*",
    "optuna.*",
    "pyhsmm.*",
    "ssm.*",
    "pyro.*"
]
ignore_missing_imports = true

[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
pythonPlatform = "Darwin"
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as async tests",
    "exchanges: marks tests as exchange-related tests",
    "trading: marks tests as trading-related tests",
    "simulator: marks tests as simulator-related tests"
]
