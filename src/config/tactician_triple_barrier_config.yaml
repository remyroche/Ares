# Tactician Triple Barrier Configuration
# This configuration ensures the Tactician completes the Analyst nicely with dynamic barriers
# calculated as fractions of the Analyst's triple barrier values

tactician_triple_barrier:
  # Dynamic Barrier Configuration - 2 Barrier Combinations
  analyst_barrier_fractions:
    # 50-50% combination
    upper_barrier_50_fraction: 0.5    # 50% of Analyst's upper barrier
    lower_barrier_50_fraction: 0.5    # 50% of Analyst's lower barrier
    # 25-25% combination  
    upper_barrier_25_fraction: 0.25   # 25% of Analyst's upper barrier
    lower_barrier_25_fraction: 0.25   # 25% of Analyst's lower barrier
  
  # Analyst Base Values (will be dynamically loaded from Analyst configuration)
  analyst_base_values:
    upper_barrier_multiplier: 0.002  # 0.2% (Analyst default - profit take)
    lower_barrier_multiplier: 0.001  # 0.1% (Analyst default - stop loss)
  
  # Timeframe Configuration - Tactician operates at both 1m and 5m
  timeframes: ["1m", "5m"]
  primary_timeframe: "1m"      # Primary timeframe for execution
  secondary_timeframe: "5m"    # Secondary timeframe for confirmation
  
  # Dynamic calculation settings
  enable_dynamic_barriers: true
  dynamic_calculation_method: "fraction_based"  # "fraction_based" or "adaptive"
  
  # Precision Settings
  enable_high_precision_mode: true
  precision_threshold: 0.85  # Minimum confidence for execution
  min_signal_strength: 0.8   # Minimum signal strength required
  
  # Risk Management
  max_risk_per_trade: 0.001  # 0.1% max risk per trade
  position_size_multiplier: 0.5  # Reduce position size for precision
  leverage_multiplier: 0.75  # Reduce leverage for precision
  
  # Quality Filters
  enable_quality_filters: true
  min_volume_threshold: 1000  # Minimum volume for execution
  min_spread_threshold: 0.0001  # Maximum spread allowed
  volatility_filter: true  # Filter based on volatility
  
  # Integration Settings
  analyst_signal_requirement: true  # Must have Analyst signal
  direction_agreement_required: true  # Must agree with Analyst direction
  confidence_boost_threshold: 0.9  # Boost confidence if above threshold
  
  # Execution Timing
  entry_delay_seconds: 5  # Wait 5 seconds after signal
  max_execution_time: 30  # Maximum 30 seconds to execute
  
  # Monitoring and Logging
  enable_detailed_logging: true
  log_execution_details: true
  track_precision_metrics: true
  
  # Performance Tracking
  track_success_rate: true
  track_profit_factor: true
  track_max_drawdown: true
  track_sharpe_ratio: true
  
  # Adaptive Settings
  enable_adaptive_barriers: true
  volatility_adjustment: true
  market_condition_adjustment: true
  confidence_adjustment: true
  
  # Timeframe Configuration - Both timeframes are equal, ML model decides usage
  timeframes: ["1m", "5m"]
  primary_timeframe: "1m"      # Default primary timeframe
  secondary_timeframe: "5m"    # Default secondary timeframe
  
  # Enhanced Scenario Analysis Configuration (for step17 optimization)
  enhanced_scenario_analysis:
    # Fractal scenario definitions (configurable for step17)
    # Profit zones (0.25% to 2.0% in 0.25% increments)
    profit_zone_1_target: 0.0025     # 0.25% profit target
    profit_zone_1_stop_loss: -0.005  # 0.5% stop loss
    profit_zone_2_target: 0.005      # 0.5% profit target
    profit_zone_2_stop_loss: -0.005  # 0.5% stop loss
    profit_zone_3_target: 0.0075     # 0.75% profit target
    profit_zone_3_stop_loss: -0.005  # 0.5% stop loss
    profit_zone_4_target: 0.01       # 1.0% profit target
    profit_zone_4_stop_loss: -0.005  # 0.5% stop loss
    profit_zone_5_target: 0.0125     # 1.25% profit target
    profit_zone_5_stop_loss: -0.005  # 0.5% stop loss
    profit_zone_6_target: 0.015      # 1.5% profit target
    profit_zone_6_stop_loss: -0.005  # 0.5% stop loss
    profit_zone_7_target: 0.0175     # 1.75% profit target
    profit_zone_7_stop_loss: -0.005  # 0.5% stop loss
    profit_zone_8_target: 0.02       # 2.0% profit target
    profit_zone_8_stop_loss: -0.005  # 0.5% stop loss
    
    # Risk zones (-0.25% to -2.0% in 0.25% increments)
    risk_zone_1_target: 0.005        # 0.5% profit target (for risk scenario)
    risk_zone_1_stop_loss: -0.0025   # 0.25% stop loss
    risk_zone_2_target: 0.005        # 0.5% profit target (for risk scenario)
    risk_zone_2_stop_loss: -0.005    # 0.5% stop loss
    risk_zone_3_target: 0.005        # 0.5% profit target (for risk scenario)
    risk_zone_3_stop_loss: -0.0075   # 0.75% stop loss
    risk_zone_4_target: 0.005        # 0.5% profit target (for risk scenario)
    risk_zone_4_stop_loss: -0.01     # 1.0% stop loss
    risk_zone_5_target: 0.005        # 0.5% profit target (for risk scenario)
    risk_zone_5_stop_loss: -0.0125   # 1.25% stop loss
    risk_zone_6_target: 0.005        # 0.5% profit target (for risk scenario)
    risk_zone_6_stop_loss: -0.015    # 1.5% stop loss
    risk_zone_7_target: 0.005        # 0.5% profit target (for risk scenario)
    risk_zone_7_stop_loss: -0.0175   # 1.75% stop loss
    risk_zone_8_target: 0.005        # 0.5% profit target (for risk scenario)
    risk_zone_8_stop_loss: -0.02     # 2.0% stop loss
    
    neutral_target: 0.0              # Neutral scenario target
    neutral_stop_loss: 0.0           # Neutral scenario stop loss
    
    # Time limit for scenario evaluation (15 minutes)
    time_limit_minutes: 15
    
    # Enhanced model configuration (configurable for step17)
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 8
    num_leaves: 63
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    
    # Enhanced decision thresholds (configurable for step17)
    profit_zone_combined_threshold: 0.6    # Minimum combined profit zone probability
    risk_zone_combined_threshold: 0.2      # Maximum combined risk zone probability
    exit_risk_threshold: 0.5               # Risk threshold for exit signals
    neutral_threshold: 0.3                 # Neutral scenario threshold
    confidence_threshold: 0.7              # Minimum confidence for decisions
    profit_risk_ratio_threshold: 2.0       # Minimum profit/risk ratio
    scenario_dominance_threshold: 0.4      # Minimum scenario dominance
    
    # Step7 technical indicator parameters (configurable for step17)
    # RSI parameters
    rsi_lookback_period: 14
    rsi_overbought_threshold: 70
    rsi_oversold_threshold: 30
    
    # MACD parameters
    macd_fast_period: 12
    macd_slow_period: 26
    macd_signal_period: 9
    
    # Bollinger Bands parameters
    bb_lookback_period: 20
    bb_std_dev: 2.0
    bb_squeeze_threshold: 0.2
    
    # SMA parameters
    sma_short_period: 10
    sma_long_period: 30
    
    # EMA parameters
    ema_short_period: 10
    ema_long_period: 30
    
    # ATR parameters
    atr_lookback_period: 14
    
    # Stochastic parameters
    stoch_k_period: 14
    stoch_d_period: 3
    stoch_overbought: 80
    stoch_oversold: 20
    
    # ADX parameters
    adx_lookback_period: 14
    adx_threshold: 25
    
    # CCI parameters
    cci_lookback_period: 14
    cci_constant: 0.015
    
         # Enhanced feature engineering parameters (configurable for step17)
     lookback_periods: 20
     volatility_window: 20
     volume_ma_period: 10
     price_momentum_periods: [5, 10, 20]  # Multiple momentum periods
     volatility_periods: [5, 10, 20]      # Multiple volatility periods
   
   # Fully Migrated Tactician Configuration (for step17 optimization)
   fully_migrated_tactician:
     # Decision thresholds (configurable for step17)
     entry_profit_threshold: 0.6          # Minimum profit zone probability for entry
     entry_risk_threshold: 0.2            # Maximum risk zone probability for entry
     entry_confidence_threshold: 0.7      # Minimum confidence for entry
     entry_profit_risk_ratio: 2.0         # Minimum profit/risk ratio for entry
     entry_scenario_dominance: 0.4        # Minimum scenario dominance for entry
     exit_risk_threshold: 0.5             # Risk threshold for exit
     exit_confidence_drop: 0.2            # Confidence drop threshold for exit
     position_size_multiplier: 1.0        # Position size multiplier
     leverage_multiplier: 1.0             # Leverage multiplier
     
     # Risk management parameters (configurable for step17)
     max_position_size: 0.1               # Maximum position size (10% of capital)
     max_leverage: 3.0                    # Maximum leverage
     stop_loss_multiplier: 1.0            # Stop loss multiplier
     take_profit_multiplier: 1.0          # Take profit multiplier
     max_drawdown: 0.05                   # Maximum drawdown (5%)
     correlation_threshold: 0.8           # Correlation threshold for risk management